# Keep the raw speaker below the DSP virtual sink. This prevents a fallback
# from silently selecting the raw, hidden output instead of Speaker (Tuning).

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_04_00.6.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]
