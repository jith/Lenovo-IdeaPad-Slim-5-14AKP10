# Demote the RAW speaker sink below the DSP sink (priority.session 900, set in
# 50-speaker-tuning.conf) so a lost configured default falls back to the tuned
# sink instead of silently bypassing the chain. See README platform bug #12.
#
# WirePlumber scores default-sink candidates in bands: configured default
# 30000+prio, selection history 20001+prio-position, plain fallback prio. A
# history position is worth only +-1, so the stock 1000 vs 900 gap decided it:
# unplugging headphones put audio on raw (20998) over the DSP sink (20899).
#
# Demoting raw rather than raising the DSP sink is deliberate - a DSP sink
# above 1000 would also outrank an explicit `speaker-dsp off`, which wins here
# because a configured default scores in the 30000 band.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_04_00.6.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]
