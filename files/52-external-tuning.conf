# Common DSP for every output that is NOT the internal speaker: Bluetooth
# speakers, Bluetooth earbuds, wired headphones, HDMI.
#
# WHY THIS IS NOT THE INTERNAL CHAIN. 50-speaker-tuning.conf is tuned to one
# measured driver -- a Linkwitz transform built from that driver's Fs and Q, a
# notch at its 761 Hz resonance, and synthesised harmonics standing in for bass
# a sealed micro-speaker cannot radiate. None of that transfers. Earbuds and a
# Bluetooth speaker have their own responses and real low end, so those stages
# would not be a correction there, they would be damage.
#
# So this chain does not voice. It protects and it controls dynamics, which are
# the only things that are right on hardware you have not measured. Every GOTT
# makeup is pinned at 1.0 for exactly that reason: the compressor may hold a
# band down when it misbehaves, but it never imposes a tonal curve.
#
# The audible win is stage X4. Lossy Bluetooth codecs (SBC, AAC) clip on
# inter-sample peaks that never show on a sample-peak meter, and material
# mastered to 0 dBFS is full of them. A true-peak ceiling removes that whole
# class of distortion before the codec ever sees it.
#
# HOW IT ATTACHES. A pinned target.object, updated at runtime -- NOT a
# WirePlumber smart filter.
#
# Smart filters were the first design and they are the obviously right feature
# for this: node.link-group + filter.smart + filter.smart.target, and
# WirePlumber splices the chain in front of a device by itself. WirePlumber
# 0.5.13 does link it correctly -- pw-link shows stream -> effect_input ->
# effect_output -> device, with no bypass link anywhere -- but THE DSP IS NOT
# APPLIED. Measured 20 Aug 2026 with an output trim of 0.1 (-20 dB) compiled
# into the graph and a 1 kHz tone captured off the target's monitor:
#
#   configuration                                  captured   verdict
#   filter.smart, target via metadata               -38.05     bypassed
#   filter.smart, target static in this file        -38.05     bypassed
#   filter.smart, stream targeted explicitly        -38.05     bypassed
#   no filter.smart, target.object pinned           -58.05     DSP runs
#   no filter.smart, + node.link-group, pinned      -58.05     DSP runs
#
# Source tone was -38.05 dBFS, so -58.05 is exactly the 20 dB the trim asks
# for. filter.smart is the single variable that decides it. Do not re-add it
# without repeating that trim measurement -- the links look perfect either way,
# so nothing short of measuring the audio catches this.
#
# node.link-group is kept: it is harmless, it groups the pair for tooling, and
# it was verified above not to be the cause.

# Rate is pinned to 48000, matching the internal chain. Leaving it unset was
# tried first, on the theory that Bluetooth commonly runs 44100 and pinning
# forces a resample; pw-top then reports the filter nodes at rate 0. That was
# NOT what broke the DSP (see the table above), but there is no reason to run
# the graph at an unnegotiated rate, and PipeWire resamples into the device
# cleanly.
context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "External (Tuning)"
            filter.graph = {
                nodes = [
                    # -- stage X0: input trim ------------------------------- --
                    # Headroom for X4's lookahead. Left at unity until measured
                    # -- tools/offline-chain.py --config files/52-external-tuning.conf
                    { type = builtin label = linear name = x0trim_l control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = x0trim_r control = { "Mult" = 1.0 "Add" = 0.0 } }

                    # -- stage X1: subsonic high-pass ---------------------- --
                    # 30 Hz rather than the internal chain's 20. A small BT
                    # speaker's driver flaps below this and turns cone travel
                    # into intermodulation without radiating anything. On
                    # earbuds there is nothing down there to lose either.
                    { type = builtin label = bq_highpass name = x1hp_l control = { "Freq" = 30.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = x1hp_r control = { "Freq" = 30.0 "Q" = 0.707 } }

                    # -- stage X2: multiband dynamics ---------------------- --
                    # Crossovers carried from the internal chain: those were
                    # chosen for Linkwitz-Riley sections that sum flat, which is
                    # a property of the plugin and not of the speaker, so it
                    # transfers where the voicing does not.
                    #
                    # ebe = 1 is load-bearing. At 0 the plugin silently runs
                    # THREE bands and everything named _4 is inert, which is how
                    # an earlier table in this repo concluded "mk_4 moves
                    # nothing anywhere".
                    #
                    # Thresholds are high and ratios low on purpose: this should
                    # catch excess, not compress programme. Band 4 is the one
                    # exception, set slightly lower, because cheap Bluetooth
                    # tweeters are where harshness actually lives -- and note it
                    # acts only when there IS excess, which is why it is safe on
                    # a device that does not have the problem.
                    #
                    # ta_/tr_ MUST stay explicit. GOTT defaults to 2 ms attack
                    # and 3.5 ms release, fast enough to modulate gain inside a
                    # bass cycle and manufacture the distortion this is here to
                    # avoid.
                    #
                    # ru_ = 1.0 keeps upward compression off. The README already
                    # records that it fights the volume control, and volume is
                    # applied before this graph here too.
                    { type = lv2 name = x2mbc plugin = "http://lsp-plug.in/plugins/lv2/gott_compressor_stereo"
                      control = { enabled = 1 mode = 1 g_in = 1.0 g_out = 1.0
                                  g_dry = 0.0 g_wet = 1.0
                                  sf1 = 120.0 sf2 = 1000.0 sf3 = 6000.0
                                  ebe = 1
                                  be_1 = 1 be_2 = 1 be_3 = 1 be_4 = 1
                                  bs_1 = 0 bs_2 = 0 bs_3 = 0 bs_4 = 0
                                  bm_1 = 0 bm_2 = 0 bm_3 = 0 bm_4 = 0
                                  td_1 = 0.50 rd_1 = 2.0 ta_1 = 20.0 tr_1 = 250.0
                                  td_2 = 0.50 rd_2 = 2.0 ta_2 = 30.0 tr_2 = 250.0
                                  td_3 = 0.45 rd_3 = 2.0 ta_3 = 50.0 tr_3 = 200.0
                                  td_4 = 0.35 rd_4 = 2.5 ta_4 = 50.0 tr_4 = 200.0
                                  ru_1 = 1.0 ru_2 = 1.0 ru_3 = 1.0 ru_4 = 1.0
                                  mk_1 = 1.0 mk_2 = 1.0 mk_3 = 1.0 mk_4 = 1.0 } }

                    # -- stage X3: band limit ------------------------------ --
                    # Keeps X4 from spending its gain reduction on ultrasonics
                    # that no earbud reproduces. Same role as stage 12a.
                    { type = builtin label = bq_lowpass name = x3lp_l control = { "Freq" = 20000.0 "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = x3lp_r control = { "Freq" = 20000.0 "Q" = 0.707 } }

                    # -- stage X4: true-peak brickwall --------------------- --
                    # ovs = 22 is what makes this a TRUE peak limiter rather
                    # than a sample-peak one -- see "The brickwall must limit
                    # true peak, not sample peak" in the README. It is the whole
                    # point of the stage: lossy Bluetooth codecs clip on
                    # inter-sample peaks a sample-peak meter never shows.
                    #
                    # th SWEPT 20 Aug 2026 on 30 s of -5.70 LUFS programme.
                    # True peak lands a consistent 0.107 dB above th:
                    #
                    #     th        LUFS-I    dLU    true pk
                    #   0.8913      -6.80    +0.00    -0.893
                    #   0.8414      -7.05    -0.25    -1.394   <- shipped
                    #   0.7943      -7.33    -0.53    -1.894
                    #   0.7499      -7.64    -0.84    -2.393
                    #
                    # 0.8913 (-1.0 dB nominal) was the first choice, but it
                    # delivers only -0.893 dBTP, and an SBC or AAC encoder can
                    # overshoot by up to about a decibel -- which would put the
                    # codec's own output back at clipping, reintroducing exactly
                    # the distortion this stage exists to remove. 0.8414 buys
                    # 1.4 dB of headroom for 0.25 LU, far below audibility.
                    # Going further to -1.9 dBTP costs twice that for headroom
                    # nothing has been measured to need.
                    { type = lv2 name = x4brick plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = { enabled = 1 mode = 0 th = 0.8414 boost = 0 alr = 0
                                  ovs = 22 dith = 0 lk = 1.0 g_in = 1.0 g_out = 1.0 } }

                    # -- stage X5: output trim ----------------------------- --
                    # Level match against the raw device, so switching the
                    # filter off is an honest A/B and not a loudness test.
                    { type = builtin label = linear name = x5trim_l control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = x5trim_r control = { "Mult" = 1.0 "Add" = 0.0 } }
                ]
                links = [
                    { output = "x0trim_l:Out" input = "x1hp_l:In" }
                    { output = "x0trim_r:Out" input = "x1hp_r:In" }
                    { output = "x1hp_l:Out" input = "x2mbc:in_l" }
                    { output = "x1hp_r:Out" input = "x2mbc:in_r" }
                    { output = "x2mbc:out_l" input = "x3lp_l:In" }
                    { output = "x2mbc:out_r" input = "x3lp_r:In" }
                    { output = "x3lp_l:Out" input = "x4brick:in_l" }
                    { output = "x3lp_r:Out" input = "x4brick:in_r" }
                    { output = "x4brick:out_l" input = "x5trim_l:In" }
                    { output = "x4brick:out_r" input = "x5trim_r:In" }
                ]
                inputs  = [ "x0trim_l:In" "x0trim_r:In" ]
                outputs = [ "x5trim_l:Out" "x5trim_r:Out" ]
            }
            capture.props = {
                node.name = "effect_input.external-tuning"
                node.description = "External (Tuning)"
                media.class = Audio/Sink
                audio.position = [ FL FR ]
                audio.rate = 48000
                audio.channels = 2
                node.link-group = external-tuning
                # This sink's volume is applied BEFORE the graph, so it is not a
                # listening level -- at anything below unity the chain stops
                # seeing full scale and its limiting stops happening. WirePlumber
                # restores a remembered volume for every node, and after a
                # restart this one came back at 38%, silently switching the DSP
                # off. state.restore-props = false makes it come up at unity
                # every time; WirePlumber's own bluez monitor uses the same
                # property for nodes whose volume must not be second-guessed.
                # The listening level lives on the device, after the graph.
                state.restore-props = false
            }
            playback.props = {
                node.name = "effect_output.external-tuning"
                audio.position = [ FL FR ]
                audio.rate = 48000
                audio.channels = 2
                node.passive = true
                node.link-group = external-tuning
                # WITHOUT THIS the chain is a hazard. With no target resolved,
                # PipeWire routes this playback stream to the default sink --
                # which is effect_input.speaker-tuning, the INTERNAL chain.
                # Verified 20 Aug 2026: the external chain's output linked
                # straight into the internal chain's input, so everything would
                # be processed twice, by two chains tuned for different
                # speakers. dont-reconnect keeps it unlinked until
                # 52-external-target.lua names a real device.
                target.object = "__external-tuning-unset__"
                stream.dont-remix = true
            }
        }
    }
]
