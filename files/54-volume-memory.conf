# Load the script that lets every output keep its own remembered level.
# See /usr/local/share/wireplumber/scripts/54-volume-memory.lua.
#
# This replaced 54-volume-sync.{conf,lua}, which did the opposite -- it carried
# one level onto every output. install.sh removes that pair, because a leftover
# 54-volume-sync.conf would keep loading the carry alongside this.

wireplumber.components = [
  {
    name = 54-volume-memory.lua, type = script/lua
    provides = custom.volume-memory
  }
]

wireplumber.profiles = {
  main = {
    custom.volume-memory = required
  }
}
