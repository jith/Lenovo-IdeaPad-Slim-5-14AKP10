# HDA codec idle timeout for the speaker DSP (P1, 2026-08-02).
# Installed to /etc/modprobe.d/speaker-dsp-powersave.conf
#
# THE PROBLEM
# The speaker pin (HDA 0x17) is EAPD-enabled: a single on/off line that
# powers an external amp. Stock power_save=1 suspends the codec one second
# after it goes idle, and WirePlumber's suspend-node.lua idles the node
# five seconds after audio stops. So ~6 s of silence drops the amp, and the
# next sound arrives with a POP and a TRUNCATED ATTACK - the first note, or
# the first word of a video. Short notification sounds get hit hardest.
#
# WHY 15 AND NOT 0
# Suspension is worth keeping. Two reasons not to disable it:
#   1. Forcing the sink to stay RUNNING (session.suspend-timeout-seconds=0)
#      makes the DSP graph - a 2048-tap FIR plus four LV2 plugins - process
#      silence continuously, forever. That is a permanent CPU draw and costs
#      far more battery than the codec it would be protecting. This machine
#      runs no TLP and no power-profiles-daemon, so nothing else claws it back.
#   2. power_save=0 never lets the codec sleep at all.
# The problem was never that suspension happens - it is that the timeout was
# one second. With 15: node idles at 5 s, codec drops to D3 at ~20 s. Anything
# within ~20 s of the last sound is pop-free, which covers the cases that
# actually annoy (repeated notifications, a brief pause, gaps between tracks),
# while genuine idle still powers everything down. Cost is ~14 extra seconds
# of a few tens of mW per audio session against a ~4-8 W idle draw.
#
# Deliberately NOT split by AC/battery: 15 on both. The marginal cost on
# battery is negligible and a udev rule is more moving parts than it is worth.
#
# power_save_controller is left alone (Y) - the PCI controller is the larger
# draw and still suspends normally.
#
# VERIFYING THIS
# The artifact is created AFTER the DAC, in the analog amp-enable path. A
# pw-record capture looks IDENTICAL with and without the fix - the usual
# digital verification method is blind to it. Check by ear (or an external
# mic): a sound 5 s after the previous one should be clean; one 60 s later
# will still pop, and that is the accepted tradeoff, not a failure.
#
# Runtime override without a reboot (the parameter is writable):
#   echo 15 | sudo tee /sys/module/snd_hda_intel/parameters/power_save

options snd_hda_intel power_save=15
