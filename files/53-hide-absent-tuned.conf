# Load the script that shows a tuned sink only while its device is connected.
# See /usr/local/share/wireplumber/scripts/53-hide-absent-tuned.lua

wireplumber.components = [
  {
    name = 53-hide-absent-tuned.lua, type = script/lua
    provides = custom.hide-absent-tuned
  }
]

wireplumber.profiles = {
  main = {
    custom.hide-absent-tuned = required
  }
}
