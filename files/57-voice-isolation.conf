# Voice Isolation: the built-in microphone with everything but the voice
# removed. The plugin is plugins/voice-isolation/voice_isolation.c, compiled by
# install.sh; see README, "Voice Isolation".
#
# Loaded by the filter-chain process (pipewire -c filter-chain.conf), not the
# main daemon: it is new code, and there it has its own thread, so the speaker
# DSP never waits on it and a fault here cannot take the speakers with it.
#
# The plugin takes both capsules: how alike they are is one of the cues that
# tells the user at the laptop from people talking elsewhere in the house. It
# mixes them to mono itself, at 0.5 each, and the source is mono.
#
# Like internal-mic it is passive toward Mic2, so the hardware sleeps when
# nothing records, and it never falls back to another source. Its capture
# stream is hidden from GNOME by hide-speaker-tuning.lua, or the microphone
# indicator would stay lit.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Built-in Microphone (Voice Isolation)"
      media.name = "Built-in Microphone (Voice Isolation)"
      audio.rate = 48000
      filter.graph = {
        nodes = [
          { type = ladspa, name = vi
            plugin = /usr/local/lib/ladspa/speaker-dsp-voice-isolation.so
            label = voice_isolation
            # Strength: how much noise goes from UNDER the voice. 0.5 kept the
            # voice intact on the benchmark; 1 takes more and costs 3 dB of it.
            # Pauses are gated by the silence depth whatever the strength.
            # Reach: raise it, in dB, if sitting farther back cuts you out;
            # lower it if people farther away still get through.
            control = {
              "Strength" = 0.5, "Silence depth (dB)" = 60, "Reach (dB)" = 0
            }
          }
        ]
        inputs = [ "vi:In L", "vi:In R" ]
        outputs = [ "vi:Out" ]
      }
      capture.props = {
        node.name = "voice-isolation.capture"
        audio.position = [ FL FR ]
        target.object = "alsa_input.pci-0000_04_00.6.HiFi__Mic2__source"
        node.passive = true
        node.dont-fallback = true
        stream.dont-remix = true
      }
      playback.props = {
        node.name = "voice-isolation"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
        device.icon-name = "audio-input-microphone"
      }
    }
  }
]
