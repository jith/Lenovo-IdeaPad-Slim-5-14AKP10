# Built-in microphone. See
# /usr/local/share/wireplumber/scripts/56-internal-mic.lua for why the analog
# input has to be selected by hand and the "Digital Microphone" is removed.

# Nothing is wired to the ACP PDM input: it records a stuck full-scale signal.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.pci-0000_04_00.6.HiFi__Mic1__source" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]

wireplumber.components = [
  {
    name = 56-internal-mic.lua, type = script/lua
    provides = custom.internal-mic
  }
]

wireplumber.profiles = {
  main = {
    custom.internal-mic = required
  }
}
