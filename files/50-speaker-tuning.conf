# Speaker DSP for Lenovo IdeaPad Slim 5 14AKP10 (83HX).
#
# Thirteen-stage chain. Every stage exists as a real node; stages whose
# coefficients have not been measured yet are set to bypass-equivalent values.
# Drop measured values in one stage at a time.
#
# All fourteen stages are live. Every frequency in the chain comes from the
# sweep measurement in tests/captures/, not from a placeholder.
#
# Node naming: s<stage><role>_<channel>. Left and right are structurally
# identical, mechanically mirrored; only stage 9 crosses channels. Edit both
# or neither.
#
#
# ---------------------------------------------------------------------------
# SAMPLE RATE ASSUMPTION -- 48000 Hz
# ---------------------------------------------------------------------------
# Stage 2 uses bq_raw, which takes raw biquad coefficients. Those are
# rate-specific: unlike bq_lowpass and friends, bq_raw does not recompute them
# from a Freq control. The rate is pinned below in capture.props/playback.props
# and the coefficient blocks are tagged rate = 48000. If the graph rate ever
# changes, regenerate with `tools/lt-coeffs.py --rate <new>` and add a second
# coefficient entry -- bq_raw picks the block whose rate is closest to the
# graph rate, so a stale 48000 block would be silently used at 44100.
#
# bq_raw coefficient controls are clamped by the plugin to [-10, 10].
#
#
# ---------------------------------------------------------------------------
# HEADROOM BUDGET
# ---------------------------------------------------------------------------
# Keep this table balanced when enabling a stage. Only stages that can add
# gain are listed.
#
#   stage  0  headroom trim       -3.12 dB   (returned by stage 10 g_out)
#   stage  2  Linkwitz transform  +3.12 dB   (worst case, 761->650 Hz;
#                                             -10.3 dB at the resonance)
#   stage  5  harmonic pre-gain    +14.0 dB  (Mult 5, inside the branch only;
#                                             x^n collapses it again straight
#                                             after, see the node comment)
#   stage  6  harmonic weighting   +12.0 dB  (largest peaking gain; ln(n)*R(f))
#   stage  8  LF crossfade         -4.4 dB   (Gain 2 = 0.6, real bass down)
#   stage  8  harmonic injection  -24.4 dB   (Gain 3 = 0.06, set from
#                                             measured THD, not by ear)
#   stage  9  M/S widening           0.0 dB  (bass mono below 300 Hz;
#                                             no gain, removes side energy)
#   stage 10  multiband makeup     +6.24 dB  (GOTT g_out 2.05: +3.12 returns
#                                             stage 0, the rest is makeup and
#                                             deliberate loudness)
#   stage 13  A/B trim               0.0 dB  (unity -- the tuned path is
#                                             deliberately left 1.91 LU above
#                                             raw; see the node comment)
#   ------------------------------------------------------------------
#   net                                       level-matched to the raw path
#
# Stage 10 keeps everything clear of the brickwall: the 100 Hz square peaks at
# -0.46 dBFS where it used to pin the limiter at -0.30, and dense and
# bass-heavy material sit at -1.8 to -2.7 dBFS. Stage 12 is a safety net again
# rather than a working stage.
#
# The float32 graph will not clip internally. The hand-off to ALSA will, which
# is what stage 12 is there to prevent -- it is never bypassed.
#
#
# ---------------------------------------------------------------------------
# WHY f1 IS 350 Hz
# ---------------------------------------------------------------------------
# Virtual bass only works if the HARMONICS are reproduced -- the fundamental
# never is, that is the point. So f1 is set by where this driver starts
# producing output, not by where bass lives.
#
# Measured, corrected for the stage 2 transform: -20 dB at 381 Hz, -11.6 at
# 427, -6.2 at 604, -1.9 at 761. Usable output starts around 500 Hz.
#
# f1 = 350 Hz with subband centres at 0.35 / 0.50 / 0.72 of it -- 122.5, 175
# and 252 Hz, Q 2.0 -- puts every generated harmonic between 490 and 1008 Hz,
# where the speaker is within 10 dB of its passband. The 200 Hz placeholder
# this replaced put them at 200-600 Hz, where the speaker is 6 to 30 dB down
# and most of the branch was inaudible.
#
# The top band's upper edge is 323 Hz, inside the 350 Hz low-pass, so no band
# reaches past the split. Rescale all four together if f1 moves.
#
# What this cannot do: content below about 96 Hz falls outside the lowest
# subband, so it gets no enhancement. Its harmonics would need orders of 5 and
# up to clear 500 Hz, and that far up the series the missing-fundamental
# percept stops working. On a driver that resonates at 761 Hz, real sub-bass
# is not recoverable by any of this.

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker (Tuning)"

            filter.graph = {
                nodes = [
                    # -- stage 0: headroom trim ------------- US12342139B2 --
                    # Mult = 0.6983 is -3.12 dB, the worst peak increase stage 2
                    # causes across the three test signals. Sized on the 100 Hz
                    # square rather than the filter's frequency-domain peak of
                    # +2.73 dB, because a transient sees the filter's phase as
                    # well as its magnitude. Returned as part of stage 10's
                    # g_out, so the two move together.
                    # Re-derive whenever stage 2 changes: tools/lt-coeffs.py
                    # prints the peak boost.
                    { type = builtin label = linear name = s0trim_l control = { "Mult" = 0.6983 "Add" = 0.0 } }
                    { type = builtin label = linear name = s0trim_r control = { "Mult" = 0.6983 "Add" = 0.0 } }

                    # -- stage 1: subsonic high-pass -------- US12445775B2 --
                    # Active from the first commit: removes cone excursion
                    # that produces no output on a sealed micro-speaker.
                    { type = builtin label = bq_highpass name = s1sub_l control = { "Freq" = 20.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = s1sub_r control = { "Freq" = 20.0 "Q" = 0.707 } }

                    # -- stage 2: Linkwitz transform -------- US12342139B2 --
                    # One biquad per channel. Generate with:
                    #     tools/lt-coeffs.py FC QTC FC2 QTC2
                    #
                    # The filter that makes a measured response behave like a
                    # target one is H_target / H_measured. Both are second-order
                    # high-passes, so the s^2 terms cancel and what is left is
                    #
                    #     H(s) = (s^2 + (wm/Qm)s + wm^2)   <- MEASURED (fc, Qtc)
                    #            ---------------------------
                    #            (s^2 + (wt/Qt)s + wt^2)   <- TARGET  (fc', Qtc')
                    #
                    # so the measured parameters are the ones in the numerator.
                    # Putting the target on top instead inverts the correction
                    # and cuts the low end rather than extending it.
                    # Measured 761 Hz Q 2.63 -> target 650 Hz Q 0.707, 48 kHz.
                    # tools/lt-coeffs.py 761 2.63 650 0.707
                    #
                    # Q 2.63 is the LOWER of the two estimates the sweep gave
                    # (2.63 from peak height, 3.04 from -3 dB bandwidth). Taken
                    # deliberately: the measuring microphone sits inside the
                    # chassis, so part of that resonance peak is plausibly
                    # cavity rather than driver, and under-correcting leaves a
                    # small peak where over-correcting digs an audible hole.
                    # The measured +8.4 dB peak matches 20*log10(2.63) = 8.40,
                    # so the driver really does behave like a 2nd-order
                    # high-pass at this fc and Q.
                    #
                    # Corrected system is a Butterworth high-pass at 650 Hz:
                    # the 761 Hz peak goes, -3 dB lands at 650 instead.
                    # Net effect: -10.3 dB at 761 Hz, +2.7 dB peak boost.
                    { type = builtin label = bq_raw name = s2lt_l
                      config = { coefficients = [ { rate = 48000, b0 = 0.9618034723, b1 = -1.87859739, b2 = 0.9261378356, a0 = 1, a1 = -1.879860903, a2 = 0.886677795 } ] } }
                    { type = builtin label = bq_raw name = s2lt_r
                      config = { coefficients = [ { rate = 48000, b0 = 0.9618034723, b1 = -1.87859739, b2 = 0.9261378356, a0 = 1, a1 = -1.879860903, a2 = 0.886677795 } ] } }

                    # -- stage 3/4 split at f1 -------------- CN115442709B --
                    # LF = LP(f1); HF = input - LF, formed by invert + mixer
                    # rather than an independent bq_highpass. A Butterworth
                    # LP/HP pair does not sum to unity, which would put a
                    # crossover-shaped error into the null test. Complementary
                    # subtraction sums to exactly unity at delay 0.
                    { type = builtin label = bq_lowpass name = s4lp_l control = { "Freq" = 350.0 "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = s4lp_r control = { "Freq" = 350.0 "Q" = 0.707 } }
                    { type = builtin label = invert name = s3neg_l }
                    { type = builtin label = invert name = s3neg_r }
                    { type = builtin label = mixer name = s3hf_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
                    { type = builtin label = mixer name = s3hf_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

                    # -- stage 3: HF delay ------------------ CN115442709B --
                    # Matches the LF branch group delay once stages 5-7 run.
                    # Zero here; a non-zero value breaks the complementarity
                    # above, which is expected and fine at that point.
                    { type = builtin label = delay name = s3dly_l
                      config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0 "Feedback" = 0.0 "Feedforward" = 0.0 } }
                    { type = builtin label = delay name = s3dly_r
                      config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0 "Feedback" = 0.0 "Feedforward" = 0.0 } }

                    # -- stage 4: three subbands ------------ CN115442709B --
                    # Centres 0.25/0.45/0.75 * f1, Q 2.0. Upper edge of the
                    # top band is 0.96 * f1, so no band reaches past the split.
                    { type = builtin label = bq_bandpass name = s4bp1_l control = { "Freq" = 122.5  "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp2_l control = { "Freq" = 175.0  "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp3_l control = { "Freq" = 252.0 "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp1_r control = { "Freq" = 122.5  "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp2_r control = { "Freq" = 175.0  "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp3_r control = { "Freq" = 252.0 "Q" = 2.0 } }

                    # -- stage 5: harmonic generation ------- CN115442709B --
                    #                                         US5930373A   --
                    # Order n is x^n: one mult node with n inputs all tied to
                    # the same subband output. Squaring is the primitive; the
                    # extra inputs just extend it to a chosen order without a
                    # cascade. Band 1 -> orders 4/5/6, band 2 -> 3/4/5,
                    # band 3 -> 2/3/4.
                    # Pre-gain, without which the rest of this branch cannot
                    # work. x^n collapses a quiet signal: a 122 Hz band of
                    # pink noise peaks at -19.5 dBFS, so x^4 lands at -77.9
                    # and x^6 at -116.8 dBFS. The stage 7 compressor that is
                    # meant to level that has a threshold floor of -60 dBFS,
                    # so it would never open. Mult = 5 lifts the band to
                    # roughly -6 dBFS first, which puts every order inside the
                    # compressor's working range.
                    { type = builtin label = linear name = s5pre1_l control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre1_r control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre2_l control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre2_r control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre3_l control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre3_r control = { "Mult" = 5.0 "Add" = 0.0 } }

                    { type = builtin label = mult name = s5h1x4_l }
                    { type = builtin label = mult name = s5h1x5_l }
                    { type = builtin label = mult name = s5h1x6_l }
                    { type = builtin label = mult name = s5h2x3_l }
                    { type = builtin label = mult name = s5h2x4_l }
                    { type = builtin label = mult name = s5h2x5_l }
                    { type = builtin label = mult name = s5h3x2_l }
                    { type = builtin label = mult name = s5h3x3_l }
                    { type = builtin label = mult name = s5h3x4_l }
                    { type = builtin label = mult name = s5h1x4_r }
                    { type = builtin label = mult name = s5h1x5_r }
                    { type = builtin label = mult name = s5h1x6_r }
                    { type = builtin label = mult name = s5h2x3_r }
                    { type = builtin label = mult name = s5h2x4_r }
                    { type = builtin label = mult name = s5h2x5_r }
                    { type = builtin label = mult name = s5h3x2_r }
                    { type = builtin label = mult name = s5h3x3_r }
                    { type = builtin label = mult name = s5h3x4_r }

                    # -- stage 6: harmonic weighting -------- CN115442709B --
                    # One peaking filter per generated order, centred on that
                    # harmonic (n * subband centre). Gain comes from
                    # RR(f,n) proportional to ln(n) * R(f) with f the subband
                    # centre -- see the description of CN115442709B, not the
                    # claims. All at 0 dB until the branch is tuned.
                    { type = builtin label = bq_peaking name = s6w1x4_l control = { "Freq" = 490.0 "Q" = 1.0 "Gain" = 12.0 } }
                    { type = builtin label = bq_peaking name = s6w1x5_l control = { "Freq" = 612.5 "Q" = 1.0 "Gain" = 8.14 } }
                    { type = builtin label = bq_peaking name = s6w1x6_l control = { "Freq" = 735.0 "Q" = 1.0 "Gain" = 3.65 } }
                    { type = builtin label = bq_peaking name = s6w2x3_l control = { "Freq" = 525.0 "Q" = 1.0 "Gain" = 8.83 } }
                    { type = builtin label = bq_peaking name = s6w2x4_l control = { "Freq" = 700.0 "Q" = 1.0 "Gain" = 3.14 } }
                    { type = builtin label = bq_peaking name = s6w2x5_l control = { "Freq" = 875.0 "Q" = 1.0 "Gain" = 7.8 } }
                    { type = builtin label = bq_peaking name = s6w3x2_l control = { "Freq" = 504.0 "Q" = 1.0 "Gain" = 5.81 } }
                    { type = builtin label = bq_peaking name = s6w3x3_l control = { "Freq" = 756.0 "Q" = 1.0 "Gain" = 1.89 } }
                    { type = builtin label = bq_peaking name = s6w3x4_l control = { "Freq" = 1008.0 "Q" = 1.0 "Gain" = 6.4 } }
                    { type = builtin label = bq_peaking name = s6w1x4_r control = { "Freq" = 490.0 "Q" = 1.0 "Gain" = 12.0 } }
                    { type = builtin label = bq_peaking name = s6w1x5_r control = { "Freq" = 612.5 "Q" = 1.0 "Gain" = 8.14 } }
                    { type = builtin label = bq_peaking name = s6w1x6_r control = { "Freq" = 735.0 "Q" = 1.0 "Gain" = 3.65 } }
                    { type = builtin label = bq_peaking name = s6w2x3_r control = { "Freq" = 525.0 "Q" = 1.0 "Gain" = 8.83 } }
                    { type = builtin label = bq_peaking name = s6w2x4_r control = { "Freq" = 700.0 "Q" = 1.0 "Gain" = 3.14 } }
                    { type = builtin label = bq_peaking name = s6w2x5_r control = { "Freq" = 875.0 "Q" = 1.0 "Gain" = 7.8 } }
                    { type = builtin label = bq_peaking name = s6w3x2_r control = { "Freq" = 504.0 "Q" = 1.0 "Gain" = 5.81 } }
                    { type = builtin label = bq_peaking name = s6w3x3_r control = { "Freq" = 756.0 "Q" = 1.0 "Gain" = 1.89 } }
                    { type = builtin label = bq_peaking name = s6w3x4_r control = { "Freq" = 1008.0 "Q" = 1.0 "Gain" = 6.4 } }

                    # Per-band sum of the three weighted orders.
                    { type = builtin label = mixer name = s6sum1_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum2_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum3_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum1_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum2_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum3_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }

                    # Even orders (x^2, x^4, x^6) carry a DC term. One dcblock
                    # node handles all three bands of a channel on separate
                    # ports; DC into a 2 W sealed driver is pure excursion.
                    { type = builtin label = dcblock name = s7dc_l control = { "R" = 0.995 } }
                    { type = builtin label = dcblock name = s7dc_r control = { "R" = 0.995 } }

                    # -- stage 7: gain K -------------------- CN115442709B --
                    #                                         US10382857   --
                    # One compressor per subband, and this is what makes the
                    # harmonic branch usable at all rather than an afterthought.
                    #
                    # x^n is an n-th power law, so the generator's output level
                    # swings far harder than its input: the same x^4 node
                    # measures -77.9 dBFS on pink noise and -9.6 dBFS on the
                    # 100 Hz square -- 68 dB of range from 17 dB of input. Left
                    # alone the effect would be inaudible on quiet material and
                    # overwhelming on loud. A low threshold with a high ratio
                    # turns that into a near-constant level, which is exactly
                    # the automatic level control US10382857 describes.
                    #
                    # al 0.1 (-20 dBFS) with cr 20:1 does the work. Simulated
                    # end to end, band 1 arrives here between -15.6 dBFS on pink
                    # noise and +73.2 dBFS on the 100 Hz square -- 89 dB -- and
                    # leaves between -19.8 and -15.3, a range of 4.5 dB. The
                    # +73 dBFS is only ever an intermediate value; the float32
                    # graph carries it without complaint. Attack is slow enough
                    # not to chop the leading edge of a bass note.
                    #
                    # CN115442709B derives K = min over orders of
                    # (threshold_n / level_n); the LSP ports expose no per-order
                    # gain signal to reduce over, so that minimum is applied as
                    # the choice of this band's threshold rather than at runtime.
                    { type = lv2 name = s7k1_l plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k2_l plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k3_l plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k1_r plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k2_r plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k3_r plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }

                    # Sum of the three gain-controlled subbands.
                    { type = builtin label = mixer name = s7sum_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s7sum_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }

                    # -- stage 8: sum ----------------------- CN115442709B --
                    # In 1 = HF branch, In 2 = LF passed straight through,
                    # In 3 = the harmonic branch.
                    #
                    # Gain 3 = 0.06, set from measured distortion rather than
                    # taste. This branch synthesises harmonics, so it IS
                    # distortion by construction -- the question is how much.
                    # Electrical THD at the sink monitor, pure tones at -6 dBFS:
                    #
                    #   Gain 3    60 Hz   90 Hz  120 Hz  150 Hz
                    #    0.25     25.0%   48.6%   13.3%    6.7%
                    #    0.15     15.0%   29.6%    8.4%    4.4%
                    #    0.10     10.0%   19.8%    5.7%    3.0%
                    #    0.06      6.0%   12.0%    3.5%    1.9%   <- here
                    #    0.03      3.0%    6.0%    1.8%    1.0%
                    #
                    # Perfectly linear in Gain 3, because stage 7 has already
                    # levelled the branch to a near-constant output. 12% at the
                    # worst frequency is in the range commercial virtual bass
                    # runs at; 48% was not. Raise to 0.10 for more bass at
                    # about 20%, and stop the moment the midrange thickens.
                    #
                    # The rest of the chain is electrically clean: with this
                    # branch muted the same measurement reads 0.28% at 90 Hz,
                    # and 0.00% with stage 10 also out. Every bit of the
                    # distortion is generated here, on purpose.
                    #
                    # Narrowing band 1 does NOT substitute for this. Raising its
                    # Q from 2 to 6 cut 60 Hz from 25% to 11% but left 90 Hz at
                    # 46%, because stage 7's 20:1 leveller makes up whatever the
                    # bandpass attenuates. Band selectivity cannot win against
                    # the leveller; only the injection level can.
                    #
                    # Gain 2 = 0.6 is the crossfade engaged: the real sub-350 Hz
                    # content is turned down 4.4 dB, with the harmonics standing
                    # in for it. That content is 17 dB or more below the passband
                    # acoustically, so little is heard to go.
                    #
                    # It also pays for itself in headroom. Sub-350 Hz energy
                    # costs peak without producing sound, so removing it lets
                    # stage 10 push harder: at the same makeup, turning Gain 2
                    # from 1.0 down to 0.6 gained 0.81 dB of output RMS for
                    # 0.07 dB of peak. Take it further toward 0 for more of
                    # both, and stop when bass starts sounding synthetic.
                    { type = builtin label = mixer name = s8sum_l control = { "Gain 1" = 1.0 "Gain 2" = 0.6 "Gain 3" = 0.06 } }
                    { type = builtin label = mixer name = s8sum_r control = { "Gain 1" = 1.0 "Gain 2" = 0.6 "Gain 3" = 0.06 } }

                    # -- stage 9: mid/side widening ---------- US8660271B2 --
                    # The only stage that crosses channels. Explicit M/S
                    # matrix rather than a plugin: no LSP or Calf stereo
                    # widener is installed, and the matrix is exactly unity at
                    # these settings, which the null test needs.
                    #   M = (L+R)/2, S = (L-R)/2, L' = M+S', R' = M-S'
                    # mixer gains are clamped to [0, 10] by the plugin, so
                    # every subtraction goes through an invert node.
                    { type = builtin label = invert name = s9negr }
                    { type = builtin label = mixer name = s9mid  control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                    { type = builtin label = mixer name = s9side control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }

                    # Side is split so bass width can be collapsed on its own.
                    # Two real filters, NOT the complementary S - LP(S) trick
                    # used at the f1 split. That trick reconstructs exactly at
                    # unity gains, which is why it is right for stage 3, but it
                    # is a bad high-pass the moment you turn the low band down:
                    # it rolls off at only 6 dB/octave and puts a +1.8 dB bump
                    # at the crossover. Measured with bass mono engaged it left
                    # the side only 7 dB down at 40-150 Hz, untouched at
                    # 150-300 Hz, and 1.9 dB LOUDER at 300-600 Hz.
                    #
                    # The cost of real filters: Gain 1 and Gain 2 are now
                    # alternatives, not a blend. Both at 1.0 notches the side
                    # at 300 Hz, because a Butterworth low-pass and high-pass
                    # pair sums to zero at the corner. Use 0/1 or 1/0.
                    { type = builtin label = bq_lowpass name = s9slp control = { "Freq" = 300.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = s9shp control = { "Freq" = 300.0 "Q" = 0.707 } }

                    # Gain 1 = side width below 300 Hz, Gain 2 = above it.
                    #
                    # Gain 1 = 0.0 is bass mono: below 300 Hz both channels get
                    # the mid signal and nothing else. On drivers this small
                    # the point is not audible imaging -- there is barely any
                    # output down there to image with -- it is excursion.
                    # Out-of-phase low content makes both cones move without
                    # producing sound, and this stops that.
                    #
                    # Gain 2 stays at 1.0: widening above 300 Hz is a separate
                    # decision, and doing both at once would make it impossible
                    # to tell which one changed the sound.
                    { type = builtin label = mixer name = s9swid control = { "Gain 1" = 0.0 "Gain 2" = 1.0 } }
                    { type = builtin label = invert name = s9negs }
                    { type = builtin label = mixer name = s9outl control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
                    { type = builtin label = mixer name = s9outr control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

                    # -- stage 10: multiband compressor ----- US12342139B2 --
                    # Lowest threshold on the LF band, and the makeup that
                    # returns stage 0's headroom.
                    #
                    # g_out 2.05 is +6.24 dB: +3.12 returns stage 0's trim,
                    # the rest is makeup for the gain reduction and for the
                    # loudness the hardware cannot supply, being already at 0 dB.
                    #
                    # This one is a deliberate trade, measured with the stage 8
                    # crossfade engaged, on dense material peaking at -1 dBFS:
                    #
                    #   g_out       RMS out   limiter removes
                    #     1.75      -16.14      0.00 dB    last fully clear value
                    #     1.80      -15.91      0.01 dB
                    #     1.90      -15.46      0.46 dB
                    #     2.05      -14.84      1.12 dB    <- here
                    #     2.20      -14.30      1.74 dB
                    #
                    # 1.12 dB of peak limiting buys 1.3 dB of average level. Go
                    # to 1.80 if you would rather the brickwall never worked at
                    # all; go to 2.20 for another 0.5 dB and noticeably more
                    # limiting. Do not go further without listening hard: this
                    # is sustained power into a 2 W driver, and past here the
                    # cost is thermal as much as it is dynamic.
                    # LSP GOTT rather than Calf MultibandCompressor. Measured
                    # offline with compression disabled, sweep against the
                    # unprocessed source, worst deviation per band:
                    #
                    #        band        Calf mode 0    GOTT
                    #     40- 150 Hz      +0.99 dB      0.00 dB
                    #    150- 400 Hz      +0.85 dB      0.00 dB
                    #    800-1300 Hz      -0.57 dB      0.00 dB
                    #    1.3-  3 kHz      -0.36 dB      0.00 dB
                    #
                    # GOTT's crossover is exactly transparent -- Linkwitz-Riley
                    # sections that sum flat. Calf's colours the 40-400 Hz
                    # region by about 1 dB and it cannot be tuned away: mode 1
                    # is worse (1.46 dB notch at the freq1 crossover) and moving
                    # the crossovers is worse still (2.23 dB).
                    #
                    # It also removes a footgun. Calf's per-band bypass0..3
                    # default to 1 (bypassed) while its master bypass defaults
                    # to 0, so the plugin can load and silently do nothing.
                    # GOTT's be_1..4 default to 1 (enabled).
                    #
                    # mode 1 (Modern) is what was measured. mode 2 is Linear
                    # Phase and would add real latency; the swap already costs
                    # about 1.3 ms (GOTT 5.00 ms group delay against Calf's
                    # 3.67), taking the path to roughly 27 ms of the 30 budget.
                    #
                    # ta_/tr_ MUST be set. GOTT defaults to 2 ms attack and
                    # 3.5 ms release, fast enough to modulate gain inside a bass
                    # cycle and manufacture the distortion this stage is there
                    # to avoid. These are Calf's values, carried across.
                    #
                    # ru_ = 1.0 disables GOTT's upward compression for now, so
                    # this swap changes the crossover and nothing else. Raising
                    # ru_ above 1 lifts quiet passages and is the next loudness
                    # lever -- it buys level without pushing peaks into stage 12
                    # the way g_out does. One change at a time.
                    { type = lv2 name = s10mbc plugin = "http://lsp-plug.in/plugins/lv2/gott_compressor_stereo"
                      control = { enabled = 1 mode = 1 g_in = 1.0 g_out = 2.05
                                  g_dry = 0.0 g_wet = 1.0
                                  sf1 = 120.0 sf2 = 1000.0 sf3 = 6000.0
                                  be_1 = 1 be_2 = 1 be_3 = 1 be_4 = 1
                                  bs_1 = 0 bs_2 = 0 bs_3 = 0 bs_4 = 0
                                  bm_1 = 0 bm_2 = 0 bm_3 = 0 bm_4 = 0
                                  td_1 = 0.10 rd_1 = 4.0 ta_1 = 20.0 tr_1 = 250.0
                                  td_2 = 0.18 rd_2 = 3.0 ta_2 = 30.0 tr_2 = 250.0
                                  td_3 = 0.35 rd_3 = 2.0 ta_3 = 50.0 tr_3 = 200.0
                                  td_4 = 0.35 rd_4 = 2.0 ta_4 = 50.0 tr_4 = 200.0
                                  ru_1 = 1.0 ru_2 = 1.0 ru_3 = 1.0 ru_4 = 1.0
                                  mk_1 = 1.0 mk_2 = 1.0 mk_3 = 1.0 mk_4 = 1.0 } }

                    # -- stage 11: excursion limiter -------- US12445775B2 --
                    #                                         CN115442709B --
                    # Open loop: the SN6140 exposes no I/V sense, so the control
                    # signal is an Hx(s) displacement estimate taken off the
                    # audio itself and fed to the sidechain.
                    #
                    # Hx(s) is a second-order LOW-pass at the driver's own
                    # measured resonance, 761 Hz Q 2.63. Cone displacement for a
                    # constant drive voltage follows exactly that shape: SPL
                    # goes as w^2 * x and the SPL response is a second-order
                    # high-pass, so displacement is its low-pass counterpart --
                    # flat below resonance, peaking by Q at it, 12 dB/octave
                    # above. It sits after stage 2, so the Linkwitz boost is
                    # already in the signal it measures.
                    #
                    # bq_lowpass, not bq_raw: the shape comes from Freq and Q,
                    # so unlike stage 2 there is nothing here to go stale if the
                    # graph rate ever changes.
                    { type = builtin label = bq_lowpass name = s11hx_l control = { "Freq" = 761.0 "Q" = 2.63 } }
                    { type = builtin label = bq_lowpass name = s11hx_r control = { "Freq" = 761.0 "Q" = 2.63 } }

                    # sct = 2 (External) is the default and is what routes sc_l
                    # and sc_r to the detector. scs = 5 takes the MAX of the two
                    # channels, so the harder-working cone sets the limit, and
                    # scm = 0 detects peaks rather than RMS because a cone hits
                    # its end stop on an instantaneous peak, not on an average.
                    #
                    # al = 0.708 is -3 dBFS on the estimate. x_max is unknown --
                    # no datasheet exists for these OEM drivers -- so the
                    # threshold is set from measured extremes instead: the Hx
                    # estimate reads -7.3 dBFS on pink noise, -1.7 on the sweep,
                    # +3.4 on the 100 Hz square, and about -1 for a full-scale
                    # low tone. -3 dBFS therefore leaves normal music alone and
                    # only acts on the pathological cases. Lower it if anything
                    # ever buzzes; that is the one symptom this stage exists for.
                    { type = lv2 name = s11xcur plugin = "http://lsp-plug.in/plugins/lv2/sc_compressor_stereo"
                      control = { enabled = 1 sct = 2 scs = 5 scm = 0
                                  al = 0.708 cr = 6.0 at = 5.0 rt = 100.0
                                  kn = 0.501 mk = 1.0 } }

                    # -- stage 12: brickwall limiter ----------------------- --
                    # Always on, never bypassed for any test -- this is what
                    # stands between a boosted sub-bass transient and a 2 W
                    # sealed driver. th = 0.96605 is -0.3 dBFS.
                    # alr and boost off: both apply gain below threshold and
                    # would put the skeleton off the baseline level.
                    # lk = 2 ms, not the 5 ms default. The GOTT swap costs
                    # 1.3 ms more group delay than Calf and put the path at
                    # 31.3 ms, over the 30 ms budget; trimming lookahead brings
                    # it to 28.3. It costs nothing measurable -- the ceiling is
                    # held at exactly -0.300 dBFS at 5, 2 and even 1 ms of
                    # lookahead -- and stage 10 keeps peaks clear of this stage
                    # anyway, so it rarely has to act at all.
                    { type = lv2 name = s12brick plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = { enabled = 1 mode = 0 th = 0.96605 boost = 0 alr = 0
                                  ovs = 0 dith = 0 lk = 2.0 g_in = 1.0 g_out = 1.0 } }

                    # -- stage 13: A/B trim ------------- ITU-R BS.1770 --
                    # Static gain from tools/loudness-match.sh. Attenuation
                    # only -- the louder path gets trimmed, never the quieter
                    # one boosted. After the brickwall, so it cannot lift the
                    # signal back over the ceiling.
                    #
                    # Deliberately at unity rather than the 0.9068 the loudness
                    # match asks for. The hardware mixer is already at 0 dB with
                    # nothing left to give, so the +1.91 LU stage 10 recovers is
                    # the only loudness available -- trimming it away here would
                    # hand it straight back.
                    #
                    # The cost is that speaker-dsp ab now favours the tuned path
                    # by 1.91 dB, which is exactly the bias the loudness match
                    # exists to remove. Level it for the duration of a
                    # comparison and put it back afterwards:
                    #   pw-cli set-param <id> Props '{ params = [
                    #       "s13trim_l:Mult" 0.8026 "s13trim_r:Mult" 0.8026 ] }'
                    { type = builtin label = linear name = s13trim_l control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s13trim_r control = { "Mult" = 1.0 "Add" = 0.0 } }
                ]

                links = [
                    # stage 0 -> 1 -> 2
                    { output = "s0trim_l:Out" input = "s1sub_l:In" }
                    { output = "s0trim_r:Out" input = "s1sub_r:In" }
                    { output = "s1sub_l:Out" input = "s2lt_l:In" }
                    { output = "s1sub_r:Out" input = "s2lt_r:In" }

                    # stage 3/4 split: LF = LP(f1), HF = s2lt - LF
                    { output = "s2lt_l:Out" input = "s4lp_l:In" }
                    { output = "s2lt_r:Out" input = "s4lp_r:In" }
                    { output = "s4lp_l:Out" input = "s3neg_l:In" }
                    { output = "s4lp_r:Out" input = "s3neg_r:In" }
                    { output = "s2lt_l:Out" input = "s3hf_l:In 1" }
                    { output = "s3neg_l:Out" input = "s3hf_l:In 2" }
                    { output = "s2lt_r:Out" input = "s3hf_r:In 1" }
                    { output = "s3neg_r:Out" input = "s3hf_r:In 2" }
                    { output = "s3hf_l:Out" input = "s3dly_l:In" }
                    { output = "s3hf_r:Out" input = "s3dly_r:In" }

                    # stage 4: LF into three subbands
                    { output = "s4lp_l:Out" input = "s4bp1_l:In" }
                    { output = "s4lp_l:Out" input = "s4bp2_l:In" }
                    { output = "s4lp_l:Out" input = "s4bp3_l:In" }
                    { output = "s4lp_r:Out" input = "s4bp1_r:In" }
                    { output = "s4lp_r:Out" input = "s4bp2_r:In" }
                    { output = "s4lp_r:Out" input = "s4bp3_r:In" }

                    # stage 5 pre-gain, then x^n
                    { output = "s4bp1_l:Out" input = "s5pre1_l:In" }
                    { output = "s4bp1_r:Out" input = "s5pre1_r:In" }
                    { output = "s4bp2_l:Out" input = "s5pre2_l:In" }
                    { output = "s4bp2_r:Out" input = "s5pre2_r:In" }
                    { output = "s4bp3_l:Out" input = "s5pre3_l:In" }
                    { output = "s4bp3_r:Out" input = "s5pre3_r:In" }
                    # stage 5: x^n, n inputs of one mult tied to one subband
                    { output = "s5pre1_l:Out" input = "s5h1x4_l:In 1" }
                    { output = "s5pre1_l:Out" input = "s5h1x4_l:In 2" }
                    { output = "s5pre1_l:Out" input = "s5h1x4_l:In 3" }
                    { output = "s5pre1_l:Out" input = "s5h1x4_l:In 4" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 1" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 2" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 3" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 4" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 5" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 1" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 2" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 3" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 4" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 5" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 6" }
                    { output = "s5pre2_l:Out" input = "s5h2x3_l:In 1" }
                    { output = "s5pre2_l:Out" input = "s5h2x3_l:In 2" }
                    { output = "s5pre2_l:Out" input = "s5h2x3_l:In 3" }
                    { output = "s5pre2_l:Out" input = "s5h2x4_l:In 1" }
                    { output = "s5pre2_l:Out" input = "s5h2x4_l:In 2" }
                    { output = "s5pre2_l:Out" input = "s5h2x4_l:In 3" }
                    { output = "s5pre2_l:Out" input = "s5h2x4_l:In 4" }
                    { output = "s5pre2_l:Out" input = "s5h2x5_l:In 1" }
                    { output = "s5pre2_l:Out" input = "s5h2x5_l:In 2" }
                    { output = "s5pre2_l:Out" input = "s5h2x5_l:In 3" }
                    { output = "s5pre2_l:Out" input = "s5h2x5_l:In 4" }
                    { output = "s5pre2_l:Out" input = "s5h2x5_l:In 5" }
                    { output = "s5pre3_l:Out" input = "s5h3x2_l:In 1" }
                    { output = "s5pre3_l:Out" input = "s5h3x2_l:In 2" }
                    { output = "s5pre3_l:Out" input = "s5h3x3_l:In 1" }
                    { output = "s5pre3_l:Out" input = "s5h3x3_l:In 2" }
                    { output = "s5pre3_l:Out" input = "s5h3x3_l:In 3" }
                    { output = "s5pre3_l:Out" input = "s5h3x4_l:In 1" }
                    { output = "s5pre3_l:Out" input = "s5h3x4_l:In 2" }
                    { output = "s5pre3_l:Out" input = "s5h3x4_l:In 3" }
                    { output = "s5pre3_l:Out" input = "s5h3x4_l:In 4" }
                    { output = "s5pre1_r:Out" input = "s5h1x4_r:In 1" }
                    { output = "s5pre1_r:Out" input = "s5h1x4_r:In 2" }
                    { output = "s5pre1_r:Out" input = "s5h1x4_r:In 3" }
                    { output = "s5pre1_r:Out" input = "s5h1x4_r:In 4" }
                    { output = "s5pre1_r:Out" input = "s5h1x5_r:In 1" }
                    { output = "s5pre1_r:Out" input = "s5h1x5_r:In 2" }
                    { output = "s5pre1_r:Out" input = "s5h1x5_r:In 3" }
                    { output = "s5pre1_r:Out" input = "s5h1x5_r:In 4" }
                    { output = "s5pre1_r:Out" input = "s5h1x5_r:In 5" }
                    { output = "s5pre1_r:Out" input = "s5h1x6_r:In 1" }
                    { output = "s5pre1_r:Out" input = "s5h1x6_r:In 2" }
                    { output = "s5pre1_r:Out" input = "s5h1x6_r:In 3" }
                    { output = "s5pre1_r:Out" input = "s5h1x6_r:In 4" }
                    { output = "s5pre1_r:Out" input = "s5h1x6_r:In 5" }
                    { output = "s5pre1_r:Out" input = "s5h1x6_r:In 6" }
                    { output = "s5pre2_r:Out" input = "s5h2x3_r:In 1" }
                    { output = "s5pre2_r:Out" input = "s5h2x3_r:In 2" }
                    { output = "s5pre2_r:Out" input = "s5h2x3_r:In 3" }
                    { output = "s5pre2_r:Out" input = "s5h2x4_r:In 1" }
                    { output = "s5pre2_r:Out" input = "s5h2x4_r:In 2" }
                    { output = "s5pre2_r:Out" input = "s5h2x4_r:In 3" }
                    { output = "s5pre2_r:Out" input = "s5h2x4_r:In 4" }
                    { output = "s5pre2_r:Out" input = "s5h2x5_r:In 1" }
                    { output = "s5pre2_r:Out" input = "s5h2x5_r:In 2" }
                    { output = "s5pre2_r:Out" input = "s5h2x5_r:In 3" }
                    { output = "s5pre2_r:Out" input = "s5h2x5_r:In 4" }
                    { output = "s5pre2_r:Out" input = "s5h2x5_r:In 5" }
                    { output = "s5pre3_r:Out" input = "s5h3x2_r:In 1" }
                    { output = "s5pre3_r:Out" input = "s5h3x2_r:In 2" }
                    { output = "s5pre3_r:Out" input = "s5h3x3_r:In 1" }
                    { output = "s5pre3_r:Out" input = "s5h3x3_r:In 2" }
                    { output = "s5pre3_r:Out" input = "s5h3x3_r:In 3" }
                    { output = "s5pre3_r:Out" input = "s5h3x4_r:In 1" }
                    { output = "s5pre3_r:Out" input = "s5h3x4_r:In 2" }
                    { output = "s5pre3_r:Out" input = "s5h3x4_r:In 3" }
                    { output = "s5pre3_r:Out" input = "s5h3x4_r:In 4" }

                    # stage 5 -> 6 weighting
                    { output = "s5h1x4_l:Out" input = "s6w1x4_l:In" }
                    { output = "s5h1x5_l:Out" input = "s6w1x5_l:In" }
                    { output = "s5h1x6_l:Out" input = "s6w1x6_l:In" }
                    { output = "s5h2x3_l:Out" input = "s6w2x3_l:In" }
                    { output = "s5h2x4_l:Out" input = "s6w2x4_l:In" }
                    { output = "s5h2x5_l:Out" input = "s6w2x5_l:In" }
                    { output = "s5h3x2_l:Out" input = "s6w3x2_l:In" }
                    { output = "s5h3x3_l:Out" input = "s6w3x3_l:In" }
                    { output = "s5h3x4_l:Out" input = "s6w3x4_l:In" }
                    { output = "s5h1x4_r:Out" input = "s6w1x4_r:In" }
                    { output = "s5h1x5_r:Out" input = "s6w1x5_r:In" }
                    { output = "s5h1x6_r:Out" input = "s6w1x6_r:In" }
                    { output = "s5h2x3_r:Out" input = "s6w2x3_r:In" }
                    { output = "s5h2x4_r:Out" input = "s6w2x4_r:In" }
                    { output = "s5h2x5_r:Out" input = "s6w2x5_r:In" }
                    { output = "s5h3x2_r:Out" input = "s6w3x2_r:In" }
                    { output = "s5h3x3_r:Out" input = "s6w3x3_r:In" }
                    { output = "s5h3x4_r:Out" input = "s6w3x4_r:In" }

                    # stage 6 per-band sums
                    { output = "s6w1x4_l:Out" input = "s6sum1_l:In 1" }
                    { output = "s6w1x5_l:Out" input = "s6sum1_l:In 2" }
                    { output = "s6w1x6_l:Out" input = "s6sum1_l:In 3" }
                    { output = "s6w2x3_l:Out" input = "s6sum2_l:In 1" }
                    { output = "s6w2x4_l:Out" input = "s6sum2_l:In 2" }
                    { output = "s6w2x5_l:Out" input = "s6sum2_l:In 3" }
                    { output = "s6w3x2_l:Out" input = "s6sum3_l:In 1" }
                    { output = "s6w3x3_l:Out" input = "s6sum3_l:In 2" }
                    { output = "s6w3x4_l:Out" input = "s6sum3_l:In 3" }
                    { output = "s6w1x4_r:Out" input = "s6sum1_r:In 1" }
                    { output = "s6w1x5_r:Out" input = "s6sum1_r:In 2" }
                    { output = "s6w1x6_r:Out" input = "s6sum1_r:In 3" }
                    { output = "s6w2x3_r:Out" input = "s6sum2_r:In 1" }
                    { output = "s6w2x4_r:Out" input = "s6sum2_r:In 2" }
                    { output = "s6w2x5_r:Out" input = "s6sum2_r:In 3" }
                    { output = "s6w3x2_r:Out" input = "s6sum3_r:In 1" }
                    { output = "s6w3x3_r:Out" input = "s6sum3_r:In 2" }
                    { output = "s6w3x4_r:Out" input = "s6sum3_r:In 3" }

                    # DC block, one port per band
                    { output = "s6sum1_l:Out" input = "s7dc_l:In 1" }
                    { output = "s6sum2_l:Out" input = "s7dc_l:In 2" }
                    { output = "s6sum3_l:Out" input = "s7dc_l:In 3" }
                    { output = "s6sum1_r:Out" input = "s7dc_r:In 1" }
                    { output = "s6sum2_r:Out" input = "s7dc_r:In 2" }
                    { output = "s6sum3_r:Out" input = "s7dc_r:In 3" }

                    # stage 7: per-band gain K, then sum the bands
                    { output = "s7dc_l:Out 1" input = "s7k1_l:in" }
                    { output = "s7dc_l:Out 2" input = "s7k2_l:in" }
                    { output = "s7dc_l:Out 3" input = "s7k3_l:in" }
                    { output = "s7dc_r:Out 1" input = "s7k1_r:in" }
                    { output = "s7dc_r:Out 2" input = "s7k2_r:in" }
                    { output = "s7dc_r:Out 3" input = "s7k3_r:in" }
                    { output = "s7k1_l:out" input = "s7sum_l:In 1" }
                    { output = "s7k2_l:out" input = "s7sum_l:In 2" }
                    { output = "s7k3_l:out" input = "s7sum_l:In 3" }
                    { output = "s7k1_r:out" input = "s7sum_r:In 1" }
                    { output = "s7k2_r:out" input = "s7sum_r:In 2" }
                    { output = "s7k3_r:out" input = "s7sum_r:In 3" }

                    # stage 8: HF + LF + harmonics
                    { output = "s3dly_l:Out" input = "s8sum_l:In 1" }
                    { output = "s4lp_l:Out"  input = "s8sum_l:In 2" }
                    { output = "s7sum_l:Out" input = "s8sum_l:In 3" }
                    { output = "s3dly_r:Out" input = "s8sum_r:In 1" }
                    { output = "s4lp_r:Out"  input = "s8sum_r:In 2" }
                    { output = "s7sum_r:Out" input = "s8sum_r:In 3" }

                    # stage 9: M/S widening
                    { output = "s8sum_r:Out" input = "s9negr:In" }
                    { output = "s8sum_l:Out" input = "s9mid:In 1" }
                    { output = "s8sum_r:Out" input = "s9mid:In 2" }
                    { output = "s8sum_l:Out" input = "s9side:In 1" }
                    { output = "s9negr:Out"  input = "s9side:In 2" }
                    { output = "s9side:Out"    input = "s9slp:In" }
                    { output = "s9side:Out"    input = "s9shp:In" }
                    { output = "s9slp:Out"  input = "s9swid:In 1" }
                    { output = "s9shp:Out"  input = "s9swid:In 2" }
                    { output = "s9swid:Out" input = "s9negs:In" }
                    { output = "s9mid:Out"  input = "s9outl:In 1" }
                    { output = "s9swid:Out" input = "s9outl:In 2" }
                    { output = "s9mid:Out"  input = "s9outr:In 1" }
                    { output = "s9negs:Out" input = "s9outr:In 2" }

                    # stage 10 -> 11 -> 12 -> 13
                    { output = "s9outl:Out" input = "s10mbc:in_l" }
                    { output = "s9outr:Out" input = "s10mbc:in_r" }
                    { output = "s10mbc:out_l" input = "s11hx_l:In" }
                    { output = "s10mbc:out_r" input = "s11hx_r:In" }
                    { output = "s10mbc:out_l" input = "s11xcur:in_l" }
                    { output = "s10mbc:out_r" input = "s11xcur:in_r" }
                    { output = "s11hx_l:Out"  input = "s11xcur:sc_l" }
                    { output = "s11hx_r:Out"  input = "s11xcur:sc_r" }
                    { output = "s11xcur:out_l" input = "s12brick:in_l" }
                    { output = "s11xcur:out_r" input = "s12brick:in_r" }
                    { output = "s12brick:out_l" input = "s13trim_l:In" }
                    { output = "s12brick:out_r" input = "s13trim_r:In" }
                ]

                inputs  = [ "s0trim_l:In" "s0trim_r:In" ]
                outputs = [ "s13trim_l:Out" "s13trim_r:Out" ]
            }

            # Apps play to this virtual sink.
            capture.props = {
                node.name = "effect_input.speaker-tuning"
                node.description = "Speaker (Tuning)"
                media.class = Audio/Sink
                audio.position = [ FL FR ]
                audio.rate = 48000
                device.icon_name = "audio-speakers"
                # Keep this virtual sink preferred over the hidden raw sink.
                priority.session = 900
            }

            # The virtual sink forwards to this laptop's physical speaker.
            # Change target.object only if `pactl list sinks short` reports a
            # different node name on your machine.
            playback.props = {
                node.name = "effect_output.speaker-tuning"
                target.object = "alsa_output.pci-0000_04_00.6.HiFi__Speaker__sink"
                audio.position = [ FL FR ]
                audio.rate = 48000
                node.passive = true
                stream.dont-remix = true
            }
        }
    }
]
