# Speaker tuning DSP for Lenovo IdeaPad Slim 5 14AKP10 (83HX)
# Hardware: stereo 2W x2 front-firing speakers, Conexant SN6140 codec.
# Emulates the Windows "Dolby Audio" speaker enhancement: speaker-protective
# high-pass, clarity EQ, and a loudness maximizer (gain + lookahead limiter).
#
# This is a WirePlumber SMART FILTER: it inserts itself automatically between
# application streams and the physical Speaker sink. It is NOT a selectable
# output device; volume keys keep controlling the real hardware sink.
# It only applies to the internal speakers - headphones, USB and Bluetooth
# outputs are untouched.
#
# Tuning knobs (edit + `systemctl --user restart pipewire wireplumber`):
#   - "Input gain (dB)" on the maximizer: overall loudness boost (0 = off,
#     6.5 = default, up to ~10 before it sounds squashed).
#   - "Limit (dB)": output ceiling, keep at -0.3.
#   - EQ bands below: Freq/Q/Gain per channel (keep L/R identical).

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker Tuning DSP"
            filter.graph = {
                nodes = [
                    # 1) High-pass @ 105 Hz: these drivers can't reproduce
                    #    deep bass; removing it frees headroom = more loudness.
                    { type = builtin label = bq_highpass  name = hp_l   control = { "Freq" = 105.0  "Q" = 0.707 } }
                    { type = builtin label = bq_highpass  name = hp_r   control = { "Freq" = 105.0  "Q" = 0.707 } }
                    # 2) Warmth @ 220 Hz: restores body above the high-pass knee.
                    { type = builtin label = bq_peaking   name = warm_l control = { "Freq" = 220.0  "Q" = 1.1  "Gain" = 2.5 } }
                    { type = builtin label = bq_peaking   name = warm_r control = { "Freq" = 220.0  "Q" = 1.1  "Gain" = 2.5 } }
                    # 3) Presence @ 3.2 kHz: dialog/vocal clarity (Dolby
                    #    "dialogue enhancer" flavour).
                    { type = builtin label = bq_peaking   name = pres_l control = { "Freq" = 3200.0 "Q" = 1.6  "Gain" = 2.0 } }
                    { type = builtin label = bq_peaking   name = pres_r control = { "Freq" = 3200.0 "Q" = 1.6  "Gain" = 2.0 } }
                    # 4) Air shelf @ 8.5 kHz: sparkle the small drivers lose.
                    { type = builtin label = bq_highshelf name = air_l  control = { "Freq" = 8500.0 "Q" = 0.707 "Gain" = 2.5 } }
                    { type = builtin label = bq_highshelf name = air_r  control = { "Freq" = 8500.0 "Q" = 0.707 "Gain" = 2.5 } }
                    # 5) Loudness maximizer: +6.5 dB drive into a lookahead
                    #    limiter with a -0.3 dBFS ceiling. Big perceived
                    #    loudness gain with zero digital clipping.
                    {   type = ladspa
                        plugin = fast_lookahead_limiter_1913
                        label = fastLookaheadLimiter
                        name = maximizer
                        control = { "Input gain (dB)" = 6.5 "Limit (dB)" = -0.3 "Release time (s)" = 0.09 }
                    }
                ]
                links = [
                    { output = "hp_l:Out"   input = "warm_l:In" }
                    { output = "warm_l:Out" input = "pres_l:In" }
                    { output = "pres_l:Out" input = "air_l:In" }
                    { output = "air_l:Out"  input = "maximizer:Input 1" }
                    { output = "hp_r:Out"   input = "warm_r:In" }
                    { output = "warm_r:Out" input = "pres_r:In" }
                    { output = "pres_r:Out" input = "air_r:In" }
                    { output = "air_r:Out"  input = "maximizer:Input 2" }
                ]
                inputs  = [ "hp_l:In" "hp_r:In" ]
                outputs = [ "maximizer:Output 1" "maximizer:Output 2" ]
            }
            capture.props = {
                node.name       = "effect_input.speaker-tuning"
                media.class     = Audio/Sink
                audio.position  = [ FL FR ]
                filter.smart    = true
                filter.smart.name = speaker-tuning
                # Only wrap the internal speakers, never headphones/USB/BT.
                filter.smart.target = { node.name = "alsa_output.pci-0000_04_00.6.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name       = "effect_output.speaker-tuning"
                audio.position  = [ FL FR ]
                node.passive    = true
                stream.dont-remix = true
            }
        }
    }
]
