# Speaker tuning DSP "punch + dynamics" - Lenovo IdeaPad Slim 5 14AKP10 (83HX)
# Base tuning = the "punch" chain (user-preferred, commit 2e7dc11), built from an
# actual acoustic measurement (2026-07-15, stepped tones played through the raw
# speaker, recorded with the internal analog mic array):
#   - driver output collapses below ~450 Hz (-18..-45 dB, THD up to 90%):
#     anything sent below ~270 Hz is inaudible distortion + wasted headroom
#   - big boxy hump at 710-1000 Hz (+7..+10 dB) - THE vocal masker
#   - presence dip at 2.5-2.8 kHz (-3..-6 dB)
#   - harsh peak at 10-11 kHz (+9 dB) - THE "metallic" source
#
# NEW (2026-07-15): iPhone-style dynamics, all builtin (LADSPA dynamics are
# unusable: PipeWire 1.6.2 silently skips LADSPA nodes at <100% sink volume):
#   - lookahead LIMITER (abs -> max -> fast/slow envelope -> clamp/log/exp gain
#     computer -> delayed main path x gain). Lets drive run at +6 dB for
#     loudness while peaks are caught cleanly instead of hard-clipping (the
#     harshness that killed the earlier +5.6 dB drive attempt).
#     Measured on this build: below threshold = bit-exact unity gain; above,
#     output ceilings at ~1.3 x threshold. Threshold 0.687 -> ceiling ~0.9.
#   - DYNAMIC psycho-bass: the synthesized bass harmonics duck a few dB on
#     loud passages (envelope on the harmonic branch), so bass stays punchy
#     at normal levels but never piles up / turns pitchy when loud.
#
# ---- TUNING KNOBS (edit + systemctl --user restart pipewire wireplumber) ----
#   Loudness/makeup  : drive_l/drive_r "Mult"   (1.585=+4dB, 2.0=+6dB, 2.24=+7dB)
#   Limiter ceiling  : lm_cl "Min" = threshold T (ceiling ~1.3xT); keep
#                      lm_log "M1" = 1/T in sync!
#   Limiter strength : lm_log "M2"  (more negative = harder; -0.95 default)
#   Limiter release  : lm_slow "Freq" (lower = slower recovery; 3 Hz default)
#   Bass amount      : harm_g "Mult"  (2..6, default 4.8)
#   Bass duck thresh : bd_cl "Min" (0.15..0.5, default 0.25); keep bd_log "M1"
#                      = 1/thresh in sync!
#   Bass duck depth  : bd_log "M2" (0 = off, -0.3 default, -0.6 = strong)
#   Body/warmth      : body_l/r "Gain"   (1..4 dB, default 3.5)
#   Vocal clarity    : box_l/r "Gain"    (-7..-4, default -5.5)
#   Presence         : pres_l/r "Gain"   (2..4, default 3.0)
#   Less metallic    : metal_l/r "Gain"  (-5..-2, default -3.5)

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker Tuning DSP"
            filter.graph = {
                nodes = [
                    # ---------- input taps ----------
                    { type = builtin label = copy name = in_l }
                    { type = builtin label = copy name = in_r }

                    # mono mix feeding the bass-harmonics branch
                    { type = builtin label = mixer name = mid
                      control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }

                    # ---------- psychoacoustic bass ----------
                    # take everything below the HP cutoff...
                    { type = builtin label = bq_lowpass name = bass_lp1 control = { "Freq" = 250.0 "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = bass_lp2 control = { "Freq" = 250.0 "Q" = 0.707 } }
                    { type = builtin label = mult name = bass_sq }   # x^2 -> 2nd harmonic
                    { type = builtin label = mult name = bass_cu }   # x^3 -> 3rd harmonic
                    { type = builtin label = mixer name = hsum
                      control = { "Gain 1" = 1.0 "Gain 2" = 2.0 } }
                    { type = builtin label = dcblock name = bass_dc }
                    # ...and place the harmonics at 350-650 Hz: the lowest band
                    # this driver actually reproduces (measured)
                    { type = builtin label = bq_bandpass name = harm_bp control = { "Freq" = 450.0 "Q" = 0.8 } }
                    # kill the sub-300 Hz residue of the harmonics (the driver is
                    # dead there; digitally it wastes headroom and pumps the
                    # limiter). Two cascaded stages (LR4-style); gain 4.0 -> 4.8
                    # compensates the ~1.6 dB this costs at 450 Hz, so audible
                    # punch level is unchanged.
                    { type = builtin label = bq_highpass name = harm_hp  control = { "Freq" = 300.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = harm_hp2 control = { "Freq" = 300.0 "Q" = 0.707 } }
                    { type = builtin label = linear name = harm_g control = { "Mult" = 4.8 } }

                    # ---------- dynamic psycho-bass (duck harmonics when loud) ----------
                    { type = builtin label = abs        name = bd_abs }
                    { type = builtin label = bq_lowpass name = bd_lp  control = { "Freq" = 5.0 "Q" = 0.5 } }
                    { type = builtin label = clamp      name = bd_cl  control = { "Min" = 0.25 "Max" = 1.5 } }
                    { type = builtin label = log        name = bd_log control = { "Base" = 2.0 "M1" = 4.0 "M2" = -0.3 } }
                    { type = builtin label = exp        name = bd_exp control = { "Base" = 2.0 } }
                    { type = builtin label = mult       name = bd_mult }

                    # ---------- measured corrective EQ (per channel) ----------
                    # protect: below ~270 Hz = inaudible distortion only
                    { type = builtin label = bq_highpass  name = hp_l    control = { "Freq" = 270.0   "Q" = 0.65 } }
                    { type = builtin label = bq_highpass  name = hp_r    control = { "Freq" = 270.0   "Q" = 0.65 } }
                    # body: lowest competent octave, extends perceived bass
                    { type = builtin label = bq_peaking   name = body_l  control = { "Freq" = 560.0   "Q" = 1.2 "Gain" = 3.5 } }
                    { type = builtin label = bq_peaking   name = body_r  control = { "Freq" = 560.0   "Q" = 1.2 "Gain" = 3.5 } }
                    # flatten the measured 710-1000 Hz box hump (vocal unmasking)
                    { type = builtin label = bq_peaking   name = box_l   control = { "Freq" = 800.0   "Q" = 1.3 "Gain" = -5.5 } }
                    { type = builtin label = bq_peaking   name = box_r   control = { "Freq" = 800.0   "Q" = 1.3 "Gain" = -5.5 } }
                    # fill the measured 2.5-2.8 kHz presence dip
                    { type = builtin label = bq_peaking   name = pres_l  control = { "Freq" = 2600.0  "Q" = 1.4 "Gain" = 3.0 } }
                    { type = builtin label = bq_peaking   name = pres_r  control = { "Freq" = 2600.0  "Q" = 1.4 "Gain" = 3.0 } }
                    # tame the measured 10-11 kHz peak (the metallic edge)
                    { type = builtin label = bq_peaking   name = metal_l control = { "Freq" = 10500.0 "Q" = 1.6 "Gain" = -3.5 } }
                    { type = builtin label = bq_peaking   name = metal_r control = { "Freq" = 10500.0 "Q" = 1.6 "Gain" = -3.5 } }

                    # mix harmonics into both channels
                    { type = builtin label = mixer name = sum_l
                      control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
                    { type = builtin label = mixer name = sum_r
                      control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

                    # ---------- loudness: makeup drive into lookahead limiter ----------
                    { type = builtin label = linear name = drive_l control = { "Mult" = 2.0 } }
                    { type = builtin label = linear name = drive_r control = { "Mult" = 2.0 } }

                    # ---------- lookahead limiter (stereo-linked, all builtin) ----------
                    # sidechain highpass: the envelope must only see what the
                    # speaker can reproduce; low residue would pump the limiter
                    { type = builtin label = bq_highpass name = sc_hpl control = { "Freq" = 250.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = sc_hpr control = { "Freq" = 250.0 "Q" = 0.707 } }
                    # envelope: |L|,|R| -> max -> fast (attack) + slow (release) -> max
                    { type = builtin label = abs        name = lm_absl }
                    { type = builtin label = abs        name = lm_absr }
                    { type = builtin label = max        name = lm_max }
                    { type = builtin label = bq_lowpass name = lm_fast control = { "Freq" = 150.0 "Q" = 0.5 } }
                    { type = builtin label = bq_lowpass name = lm_slow control = { "Freq" = 3.0   "Q" = 0.5 } }
                    { type = builtin label = max        name = lm_env }
                    # gain computer: unity below threshold, ceiling ~1.3xT above
                    { type = builtin label = clamp      name = lm_cl  control = { "Min" = 0.687 "Max" = 2.0 } }
                    { type = builtin label = log        name = lm_log control = { "Base" = 2.0 "M1" = 1.456 "M2" = -0.95 } }
                    { type = builtin label = exp        name = lm_exp control = { "Base" = 2.0 } }
                    # main path delayed 2.5 ms so the gain is ready before the peak
                    { type = builtin label = delay      name = lm_dlyl
                      config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0025 } }
                    { type = builtin label = delay      name = lm_dlyr
                      config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0025 } }
                    { type = builtin label = mult       name = lm_outl }
                    { type = builtin label = mult       name = lm_outr }
                ]
                links = [
                    # mono feed
                    { output = "in_l:Out" input = "mid:In 1" }
                    { output = "in_r:Out" input = "mid:In 2" }
                    # psycho-bass branch
                    { output = "mid:Out"      input = "bass_lp1:In" }
                    { output = "bass_lp1:Out" input = "bass_lp2:In" }
                    { output = "bass_lp2:Out" input = "bass_sq:In 1" }
                    { output = "bass_lp2:Out" input = "bass_sq:In 2" }
                    { output = "bass_sq:Out"  input = "bass_cu:In 1" }
                    { output = "bass_lp2:Out" input = "bass_cu:In 2" }
                    { output = "bass_sq:Out"  input = "hsum:In 1" }
                    { output = "bass_cu:Out"  input = "hsum:In 2" }
                    { output = "hsum:Out"     input = "bass_dc:In 1" }
                    { output = "bass_dc:Out 1" input = "harm_bp:In" }
                    { output = "harm_bp:Out"  input = "harm_hp:In" }
                    { output = "harm_hp:Out"  input = "harm_hp2:In" }
                    { output = "harm_hp2:Out" input = "harm_g:In" }
                    # dynamic bass duck: gain from the harmonic branch's own envelope
                    { output = "harm_g:Out"   input = "bd_abs:In" }
                    { output = "bd_abs:Out"   input = "bd_lp:In" }
                    { output = "bd_lp:Out"    input = "bd_cl:In" }
                    { output = "bd_cl:Out"    input = "bd_log:In" }
                    { output = "bd_log:Out"   input = "bd_exp:In" }
                    { output = "harm_g:Out"   input = "bd_mult:In 1" }
                    { output = "bd_exp:Out"   input = "bd_mult:In 2" }
                    # corrective EQ - left
                    { output = "in_l:Out"    input = "hp_l:In" }
                    { output = "hp_l:Out"    input = "body_l:In" }
                    { output = "body_l:Out"  input = "box_l:In" }
                    { output = "box_l:Out"   input = "pres_l:In" }
                    { output = "pres_l:Out"  input = "metal_l:In" }
                    # corrective EQ - right
                    { output = "in_r:Out"    input = "hp_r:In" }
                    { output = "hp_r:Out"    input = "body_r:In" }
                    { output = "body_r:Out"  input = "box_r:In" }
                    { output = "box_r:Out"   input = "pres_r:In" }
                    { output = "pres_r:Out"  input = "metal_r:In" }
                    # sum EQ + (ducked) harmonics
                    { output = "metal_l:Out" input = "sum_l:In 1" }
                    { output = "bd_mult:Out" input = "sum_l:In 2" }
                    { output = "metal_r:Out" input = "sum_r:In 1" }
                    { output = "bd_mult:Out" input = "sum_r:In 2" }
                    # makeup drive
                    { output = "sum_l:Out" input = "drive_l:In" }
                    { output = "sum_r:Out" input = "drive_r:In" }
                    # limiter envelope (sidechain-highpassed)
                    { output = "drive_l:Out" input = "sc_hpl:In" }
                    { output = "drive_r:Out" input = "sc_hpr:In" }
                    { output = "sc_hpl:Out"  input = "lm_absl:In" }
                    { output = "sc_hpr:Out"  input = "lm_absr:In" }
                    { output = "lm_absl:Out" input = "lm_max:In 1" }
                    { output = "lm_absr:Out" input = "lm_max:In 2" }
                    { output = "lm_max:Out"  input = "lm_fast:In" }
                    { output = "lm_max:Out"  input = "lm_slow:In" }
                    { output = "lm_fast:Out" input = "lm_env:In 1" }
                    { output = "lm_slow:Out" input = "lm_env:In 2" }
                    { output = "lm_env:Out"  input = "lm_cl:In" }
                    { output = "lm_cl:Out"   input = "lm_log:In" }
                    { output = "lm_log:Out"  input = "lm_exp:In" }
                    # limiter apply (lookahead-delayed main x gain)
                    { output = "drive_l:Out" input = "lm_dlyl:In" }
                    { output = "drive_r:Out" input = "lm_dlyr:In" }
                    { output = "lm_dlyl:Out" input = "lm_outl:In 1" }
                    { output = "lm_exp:Out"  input = "lm_outl:In 2" }
                    { output = "lm_dlyr:Out" input = "lm_outr:In 1" }
                    { output = "lm_exp:Out"  input = "lm_outr:In 2" }
                ]
                inputs  = [ "in_l:In" "in_r:In" ]
                outputs = [ "lm_outl:Out" "lm_outr:Out" ]
            }
            capture.props = {
                node.name       = "effect_input.speaker-tuning"
                node.description = "Speaker"
                media.class     = Audio/Sink
                audio.position  = [ FL FR ]
                device.icon_name = "audio-speakers"
                priority.session = 900
                # Use this sink at (or near) 100% volume: PipeWire 1.6.2
                # applies virtual-sink volume with a steep nonlinear taper
                # (measured), so reduced volumes get quiet fast. For normal
                # quiet listening just switch to the raw "Speaker" sink
                # (speaker-dsp off).
                # NOTE: not a filter.smart filter - on PipeWire 1.6.2 /
                # WirePlumber 0.5.13 smart-filter linking silently BYPASSES the
                # DSP graph (verified by measurement 2026-07-15). This is a
                # normal virtual sink set as the default instead.
            }
            playback.props = {
                node.name       = "effect_output.speaker-tuning"
                target.object   = "alsa_output.pci-0000_04_00.6.HiFi__Speaker__sink"
                audio.position  = [ FL FR ]
                node.passive    = true
                stream.dont-remix = true
            }
        }
    }
]
