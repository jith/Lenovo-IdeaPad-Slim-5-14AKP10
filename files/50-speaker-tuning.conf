# Speaker DSP for Lenovo IdeaPad Slim 5 14AKP10 (83HX).
#
# Fourteen-stage chain, stages 0-13. All of them are live: every frequency in
# here comes from the sweep measurement in tests/captures/, not a placeholder.
#
# Before changing a value, sweep it offline -- tools/offline-chain.py runs this
# exact file over a wav without reinstalling anything -- and then confirm the
# one value you chose on hardware.
#
# Node naming: s<stage><role>_<channel>. Left and right are structurally
# identical, mechanically mirrored; only stage 9 crosses channels. Edit both
# or neither.
#
#
# ---------------------------------------------------------------------------
# SAMPLE RATE ASSUMPTION -- 48000 Hz
# ---------------------------------------------------------------------------
# Stage 2 uses bq_raw, which takes raw biquad coefficients. Those are
# rate-specific: unlike bq_lowpass and friends, bq_raw does not recompute them
# from a Freq control. The rate is pinned below in capture.props/playback.props
# and the coefficient blocks are tagged rate = 48000. If the graph rate ever
# changes, regenerate with `tools/lt-coeffs.py --rate <new>` and add a second
# coefficient entry -- bq_raw picks the block whose rate is closest to the
# graph rate, so a stale 48000 block would be silently used at 44100.
#
# bq_raw coefficient controls are clamped by the plugin to [-10, 10].
#
#
# ---------------------------------------------------------------------------
# HEADROOM BUDGET
# ---------------------------------------------------------------------------
# Keep this table balanced when enabling a stage. Only stages that can add
# gain are listed.
#
#   stage  0  headroom trim       -3.12 dB   (returned by stage 10 g_out)
#   stage  2  Linkwitz transform  +3.12 dB   (worst case, 761->650 Hz;
#                                             -10.3 dB at the resonance)
#   stage  5  harmonic pre-gain    +14.0 dB  (Mult 5, inside the branch only;
#                                             x^n collapses it again straight
#                                             after, see the node comment)
#   stage  6  harmonic weighting   +12.0 dB  (largest peaking gain; ln(n)*R(f))
#   stage  8  LF crossfade         -6.9 dB   (Gain 2 = 0.45, real bass down.
#                                             0.6 -> 0.45 on 4 Sep 2026: this is
#                                             the DISPLACEMENT lever and a better
#                                             one than g_out. See the node)
#   stage  8  harmonic injection  -24.4 dB   (Gain 3 = 0.06, set from
#                                             measured THD, not by ear)
#   stage  9  M/S widening           0.0 dB  (bass mono below 300 Hz;
#                                             no gain, removes side energy)
#   stage 10  multiband makeup    +16.26 dB  (GOTT g_out 6.50: +3.12 returns
#                                             stage 0, the rest is makeup and
#                                             deliberate loudness. Bounded by
#                                             DISPLACEMENT now -- not by true
#                                             peak, which stopped binding, and
#                                             not by limiter density. See the
#                                             node comment)
#   stage 10  presence voicing     -3.17 dB  (mk_3 = 0.694218, band 1-6 kHz)
#   stage 10  HF tilt              -6.15 dB  (mk_4 = 0.492308, band 6 kHz+; taken
#                                             WITH the same 4.65 dB off mk_3
#                                             above, so the pair is a flat
#                                             -4.65 dB shelf over 1.25-16 kHz on
#                                             top of the 14 Aug one, holding the
#                                             tilt that stage 11 going multiband
#                                             would otherwise have returned. The
#                                             last 0.18 dB of it pays for g_out
#                                             4.25, and is SIZED AT THE LISTENING
#                                             LEVEL rather than at unity -- see
#                                             the node comment, this is not the
#                                             0.44 the unity measurement asked
#                                             for)
#   stage 10  low-mid voicing       0.00 dB  (mk_2 = 1.0, REMOVED 14 Aug 2026 --
#                                             a flat cut across 120-1000 Hz to
#                                             fix a narrow 761 Hz excess that
#                                             stage 10b now handles with a bell.
#                                             Its collateral was the low-mid.
#                                             mk_3 above is still set from the
#                                             iPhone 13 A/B, and is now the only
#                                             value here taken from a comparison
#                                             against another speaker)
#   stage 10b resonance notch      -3.70 dB  (bq_peaking 760 Hz Q 3.0, at the
#                                             peak only -- -0.4 dB at 490 Hz
#                                             and -0.8 at 1008. Now the SECOND
#                                             and last instrument aimed at the
#                                             761 Hz resonance, after stage 2;
#                                             deepened from -3.0 on 14 Aug 2026
#                                             to absorb what mk_2 was doing at
#                                             800 Hz, so mk_2 could be removed
#                                             without weakening the correction.
#                                             Costs 0.1 LU and no peak;
#                                             stage 12 re-limits it)
#   stage 10c presence lift  +4.00 dB max  (DYNAMIC since 1 Sep 2026: a
#                                             parallel 2650 Hz bandpass whose
#                                             branch gain is compressed, which
#                                             is exactly a bq_peaking Q 1.2
#                                             whose Gain moves between about
#                                             +2.3 and +4.0. Anchored at the
#                                             FITTED +4.0 and pulled down by
#                                             the branch level, instead of
#                                             frozen at +3.0 to buy two-tone
#                                             IMD margin the static filter had
#                                             to pay for all the time. Peak
#                                             only -- +0.5 dB at 1 kHz and
#                                             +1.1 at 5 kHz at full lift. Costs
#                                             no headroom: stage 12 owns the
#                                             ceiling and true peak is
#                                             unchanged to 0.002 dB)
#   stage 12a band limit            -0.0 dB  (LP 22 kHz; removes 0.66 dB of
#                                             inter-sample overshoot, which is
#                                             what first unblocked g_out)
#   stage 13  A/B trim               0.0 dB  (unity -- the tuned path is
#                                             deliberately left 4.71 LU above
#                                             raw; see the node comment)
#   ------------------------------------------------------------------
#   net                                       level-matched to the raw path
#
# Stage 10 keeps everything clear of the brickwall: the 100 Hz square peaks at
# -0.46 dBFS where it used to pin the limiter at -0.30, and dense and
# bass-heavy material sit at -1.8 to -2.7 dBFS. Stage 12 is a safety net again
# rather than a working stage.
#
# The float32 graph will not clip internally. The hand-off to ALSA will, which
# is what stage 12 is there to prevent -- it is never bypassed.
#
#
# ---------------------------------------------------------------------------
# WHY f1 IS 350 Hz
# ---------------------------------------------------------------------------
# Virtual bass only works if the HARMONICS are reproduced -- the fundamental
# never is, that is the point. So f1 is set by where this driver starts
# producing output, not by where bass lives.
#
# Measured, corrected for the stage 2 transform: -20 dB at 381 Hz, -11.6 at
# 427, -6.2 at 604, -1.9 at 761. Usable output starts around 500 Hz.
#
# f1 = 350 Hz with subband centres at 0.35 / 0.50 / 0.72 of it -- 122.5, 175
# and 252 Hz, Q 2.0 -- puts every generated harmonic between 490 and 1008 Hz,
# where the speaker is within 10 dB of its passband. The 200 Hz placeholder
# this replaced put them at 200-600 Hz, where the speaker is 6 to 30 dB down
# and most of the branch was inaudible.
#
# The top band's upper edge is 323 Hz, inside the 350 Hz low-pass, so no band
# reaches past the split. Rescale all four together if f1 moves.
#
# What this cannot do: content below about 96 Hz falls outside the lowest
# subband, so it gets no enhancement. Its harmonics would need orders of 5 and
# up to clear 500 Hz, and that far up the series the missing-fundamental
# percept stops working. On a driver that resonates at 761 Hz, real sub-bass
# is not recoverable by any of this.

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker (Tuning)"

            filter.graph = {
                nodes = [
                    # -- stage 0: headroom trim ------------- US12342139B2 --
                    # Mult = 0.6983 is -3.12 dB, the worst peak increase stage 2
                    # causes across the three test signals. Sized on the 100 Hz
                    # square rather than the filter's frequency-domain peak of
                    # +2.73 dB, because a transient sees the filter's phase as
                    # well as its magnitude. Returned as part of stage 10's
                    # g_out, so the two move together.
                    # Re-derive whenever stage 2 changes: tools/lt-coeffs.py
                    # prints the peak boost.
                    { type = builtin label = linear name = s0trim_l control = { "Mult" = 0.6983 "Add" = 0.0 } }
                    { type = builtin label = linear name = s0trim_r control = { "Mult" = 0.6983 "Add" = 0.0 } }


                    # -- stage 1: subsonic high-pass -------- US12445775B2 --
                    # Active from the first commit: removes cone excursion
                    # that produces no output on a sealed micro-speaker.
                    { type = builtin label = bq_highpass name = s1sub_l control = { "Freq" = 20.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = s1sub_r control = { "Freq" = 20.0 "Q" = 0.707 } }

                    # -- stage 2: Linkwitz transform -------- US12342139B2 --
                    # One biquad per channel. Generate with:
                    #     tools/lt-coeffs.py FC QTC FC2 QTC2
                    #
                    # The filter that makes a measured response behave like a
                    # target one is H_target / H_measured. Both are second-order
                    # high-passes, so the s^2 terms cancel and what is left is
                    #
                    #     H(s) = (s^2 + (wm/Qm)s + wm^2)   <- MEASURED (fc, Qtc)
                    #            ---------------------------
                    #            (s^2 + (wt/Qt)s + wt^2)   <- TARGET  (fc', Qtc')
                    #
                    # so the measured parameters are the ones in the numerator.
                    # Putting the target on top instead inverts the correction
                    # and cuts the low end rather than extending it.
                    # Measured 761 Hz Q 2.63 -> target 650 Hz Q 0.707, 48 kHz.
                    # tools/lt-coeffs.py 761 2.63 650 0.707
                    #
                    # Q 2.63 is the LOWER of the two estimates the sweep gave
                    # (2.63 from peak height, 3.04 from -3 dB bandwidth). Taken
                    # deliberately: the measuring microphone sits inside the
                    # chassis, so part of that resonance peak is plausibly
                    # cavity rather than driver, and under-correcting leaves a
                    # small peak where over-correcting digs an audible hole.
                    # The measured +8.4 dB peak matches 20*log10(2.63) = 8.40,
                    # so the driver really does behave like a 2nd-order
                    # high-pass at this fc and Q.
                    #
                    # Corrected system is a Butterworth high-pass at 650 Hz:
                    # the 761 Hz peak goes, -3 dB lands at 650 instead.
                    # Net effect: -10.3 dB at 761 Hz, +2.7 dB peak boost.
                    { type = builtin label = bq_raw name = s2lt_l
                      config = { coefficients = [ { rate = 48000, b0 = 0.9618034723, b1 = -1.87859739, b2 = 0.9261378356, a0 = 1, a1 = -1.879860903, a2 = 0.886677795 } ] } }
                    { type = builtin label = bq_raw name = s2lt_r
                      config = { coefficients = [ { rate = 48000, b0 = 0.9618034723, b1 = -1.87859739, b2 = 0.9261378356, a0 = 1, a1 = -1.879860903, a2 = 0.886677795 } ] } }

                    # -- stage 3/4 split at f1 -------------- CN115442709B --
                    # LF = LP(f1); HF = input - LF, formed by invert + mixer
                    # rather than an independent bq_highpass. A Butterworth
                    # LP/HP pair does not sum to unity, which would put a
                    # crossover-shaped error into the null test. Complementary
                    # subtraction sums to exactly unity at delay 0.
                    { type = builtin label = bq_lowpass name = s4lp_l control = { "Freq" = 350.0 "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = s4lp_r control = { "Freq" = 350.0 "Q" = 0.707 } }
                    { type = builtin label = invert name = s3neg_l }
                    { type = builtin label = invert name = s3neg_r }
                    { type = builtin label = mixer name = s3hf_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
                    { type = builtin label = mixer name = s3hf_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

                    # -- stage 3: HF delay ------------------ CN115442709B --
                    # Matches the LF branch group delay once stages 5-7 run.
                    # Zero here; a non-zero value breaks the complementarity
                    # above, which is expected and fine at that point.
                    { type = builtin label = delay name = s3dly_l
                      config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0 "Feedback" = 0.0 "Feedforward" = 0.0 } }
                    { type = builtin label = delay name = s3dly_r
                      config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0 "Feedback" = 0.0 "Feedforward" = 0.0 } }

                    # -- stage 4: three subbands ------------ CN115442709B --
                    # Centres 0.25/0.45/0.75 * f1, Q 2.0. Upper edge of the
                    # top band is 0.96 * f1, so no band reaches past the split.
                    { type = builtin label = bq_bandpass name = s4bp1_l control = { "Freq" = 122.5  "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp2_l control = { "Freq" = 175.0  "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp3_l control = { "Freq" = 252.0 "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp1_r control = { "Freq" = 122.5  "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp2_r control = { "Freq" = 175.0  "Q" = 2.0 } }
                    { type = builtin label = bq_bandpass name = s4bp3_r control = { "Freq" = 252.0 "Q" = 2.0 } }

                    # -- stage 5: harmonic generation ------- CN115442709B --
                    #                                         US5930373A   --
                    # Order n is x^n: one mult node with n inputs all tied to
                    # the same subband output. Squaring is the primitive; the
                    # extra inputs just extend it to a chosen order without a
                    # cascade. Band 1 -> orders 4/5/6, band 2 -> 3/4/5,
                    # band 3 -> 2/3/4.
                    # Pre-gain, without which the rest of this branch cannot
                    # work. x^n collapses a quiet signal: a 122 Hz band of
                    # pink noise peaks at -19.5 dBFS, so x^4 lands at -77.9
                    # and x^6 at -116.8 dBFS. The stage 7 compressor that is
                    # meant to level that has a threshold floor of -60 dBFS,
                    # so it would never open. Mult = 5 lifts the band to
                    # roughly -6 dBFS first, which puts every order inside the
                    # compressor's working range.
                    { type = builtin label = linear name = s5pre1_l control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre1_r control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre2_l control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre2_r control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre3_l control = { "Mult" = 5.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s5pre3_r control = { "Mult" = 5.0 "Add" = 0.0 } }

                    { type = builtin label = mult name = s5h1x4_l }
                    { type = builtin label = mult name = s5h1x5_l }
                    { type = builtin label = mult name = s5h1x6_l }
                    { type = builtin label = mult name = s5h2x3_l }
                    { type = builtin label = mult name = s5h2x4_l }
                    { type = builtin label = mult name = s5h2x5_l }
                    { type = builtin label = mult name = s5h3x2_l }
                    { type = builtin label = mult name = s5h3x3_l }
                    { type = builtin label = mult name = s5h3x4_l }
                    { type = builtin label = mult name = s5h1x4_r }
                    { type = builtin label = mult name = s5h1x5_r }
                    { type = builtin label = mult name = s5h1x6_r }
                    { type = builtin label = mult name = s5h2x3_r }
                    { type = builtin label = mult name = s5h2x4_r }
                    { type = builtin label = mult name = s5h2x5_r }
                    { type = builtin label = mult name = s5h3x2_r }
                    { type = builtin label = mult name = s5h3x3_r }
                    { type = builtin label = mult name = s5h3x4_r }

                    # -- stage 6: harmonic weighting -------- CN115442709B --
                    # One peaking filter per generated order, centred on that
                    # harmonic (n * subband centre). Gain comes from
                    # RR(f,n) proportional to ln(n) * R(f) with f the subband
                    # centre -- see the description of CN115442709B, not the
                    # claims. All at 0 dB until the branch is tuned.
                    { type = builtin label = bq_peaking name = s6w1x4_l control = { "Freq" = 490.0 "Q" = 1.0 "Gain" = 12.0 } }
                    { type = builtin label = bq_peaking name = s6w1x5_l control = { "Freq" = 612.5 "Q" = 1.0 "Gain" = 8.14 } }
                    { type = builtin label = bq_peaking name = s6w1x6_l control = { "Freq" = 735.0 "Q" = 1.0 "Gain" = 3.65 } }
                    { type = builtin label = bq_peaking name = s6w2x3_l control = { "Freq" = 525.0 "Q" = 1.0 "Gain" = 8.83 } }
                    { type = builtin label = bq_peaking name = s6w2x4_l control = { "Freq" = 700.0 "Q" = 1.0 "Gain" = 3.14 } }
                    { type = builtin label = bq_peaking name = s6w2x5_l control = { "Freq" = 875.0 "Q" = 1.0 "Gain" = 7.8 } }
                    { type = builtin label = bq_peaking name = s6w3x2_l control = { "Freq" = 504.0 "Q" = 1.0 "Gain" = 5.81 } }
                    { type = builtin label = bq_peaking name = s6w3x3_l control = { "Freq" = 756.0 "Q" = 1.0 "Gain" = 1.89 } }
                    { type = builtin label = bq_peaking name = s6w3x4_l control = { "Freq" = 1008.0 "Q" = 1.0 "Gain" = 6.4 } }
                    { type = builtin label = bq_peaking name = s6w1x4_r control = { "Freq" = 490.0 "Q" = 1.0 "Gain" = 12.0 } }
                    { type = builtin label = bq_peaking name = s6w1x5_r control = { "Freq" = 612.5 "Q" = 1.0 "Gain" = 8.14 } }
                    { type = builtin label = bq_peaking name = s6w1x6_r control = { "Freq" = 735.0 "Q" = 1.0 "Gain" = 3.65 } }
                    { type = builtin label = bq_peaking name = s6w2x3_r control = { "Freq" = 525.0 "Q" = 1.0 "Gain" = 8.83 } }
                    { type = builtin label = bq_peaking name = s6w2x4_r control = { "Freq" = 700.0 "Q" = 1.0 "Gain" = 3.14 } }
                    { type = builtin label = bq_peaking name = s6w2x5_r control = { "Freq" = 875.0 "Q" = 1.0 "Gain" = 7.8 } }
                    { type = builtin label = bq_peaking name = s6w3x2_r control = { "Freq" = 504.0 "Q" = 1.0 "Gain" = 5.81 } }
                    { type = builtin label = bq_peaking name = s6w3x3_r control = { "Freq" = 756.0 "Q" = 1.0 "Gain" = 1.89 } }
                    { type = builtin label = bq_peaking name = s6w3x4_r control = { "Freq" = 1008.0 "Q" = 1.0 "Gain" = 6.4 } }

                    # Per-band sum of the three weighted orders.
                    { type = builtin label = mixer name = s6sum1_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum2_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum3_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum1_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum2_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s6sum3_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }

                    # Even orders (x^2, x^4, x^6) carry a DC term. One dcblock
                    # node handles all three bands of a channel on separate
                    # ports; DC into a 2 W sealed driver is pure excursion.
                    { type = builtin label = dcblock name = s7dc_l control = { "R" = 0.995 } }
                    { type = builtin label = dcblock name = s7dc_r control = { "R" = 0.995 } }

                    # -- stage 7: gain K -------------------- CN115442709B --
                    #                                         US10382857   --
                    # One compressor per subband, and this is what makes the
                    # harmonic branch usable at all rather than an afterthought.
                    #
                    # x^n is an n-th power law, so the generator's output level
                    # swings far harder than its input: the same x^4 node
                    # measures -77.9 dBFS on pink noise and -9.6 dBFS on the
                    # 100 Hz square -- 68 dB of range from 17 dB of input. Left
                    # alone the effect would be inaudible on quiet material and
                    # overwhelming on loud. A low threshold with a high ratio
                    # turns that into a near-constant level, which is exactly
                    # the automatic level control US10382857 describes.
                    #
                    # al 0.1 (-20 dBFS) with cr 20:1 does the work. Simulated
                    # end to end, band 1 arrives here between -15.6 dBFS on pink
                    # noise and +73.2 dBFS on the 100 Hz square -- 89 dB -- and
                    # leaves between -19.8 and -15.3, a range of 4.5 dB. The
                    # +73 dBFS is only ever an intermediate value; the float32
                    # graph carries it without complaint. Attack is slow enough
                    # not to chop the leading edge of a bass note.
                    #
                    # CN115442709B derives K = min over orders of
                    # (threshold_n / level_n); the LSP ports expose no per-order
                    # gain signal to reduce over, so that minimum is applied as
                    # the choice of this band's threshold rather than at runtime.
                    { type = lv2 name = s7k1_l plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k2_l plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k3_l plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k1_r plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k2_r plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }
                    { type = lv2 name = s7k3_r plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 al = 0.1 cr = 20.0 at = 10.0 rt = 150.0 kn = 0.501 mk = 1.0 } }

                    # Sum of the three gain-controlled subbands.
                    { type = builtin label = mixer name = s7sum_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }
                    { type = builtin label = mixer name = s7sum_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 } }

                    # -- stage 8: sum ----------------------- CN115442709B --
                    # In 1 = HF branch, In 2 = LF passed straight through,
                    # In 3 = the harmonic branch.
                    #
                    # Gain 3 = 0.06, set from measured distortion rather than
                    # taste. This branch synthesises harmonics, so it IS
                    # distortion by construction -- the question is how much.
                    # Electrical THD at the sink monitor, pure tones at -6 dBFS:
                    #
                    #   Gain 3    60 Hz   90 Hz  120 Hz  150 Hz
                    #    0.25     25.0%   48.6%   13.3%    6.7%
                    #    0.15     15.0%   29.6%    8.4%    4.4%
                    #    0.10     10.0%   19.8%    5.7%    3.0%
                    #    0.06      6.0%   12.0%    3.5%    1.9%   <- here
                    #    0.03      3.0%    6.0%    1.8%    1.0%
                    #
                    # Perfectly linear in Gain 3, because stage 7 has already
                    # levelled the branch to a near-constant output. 12% at the
                    # worst frequency is in the range commercial virtual bass
                    # runs at; 48% was not. Raise to 0.10 for more bass at
                    # about 20%, and stop the moment the midrange thickens.
                    #
                    # The rest of the chain is electrically clean: with this
                    # branch muted the same measurement reads 0.28% at 90 Hz,
                    # and 0.00% with stage 10 also out. Every bit of the
                    # distortion is generated here, on purpose.
                    #
                    # Narrowing band 1 does NOT substitute for this. Raising its
                    # Q from 2 to 6 cut 60 Hz from 25% to 11% but left 90 Hz at
                    # 46%, because stage 7's 20:1 leveller makes up whatever the
                    # bandpass attenuates. Band selectivity cannot win against
                    # the leveller; only the injection level can.
                    #
                    # Gain 2 = 0.6 is the crossfade engaged: the real sub-350 Hz
                    # content is turned down 4.4 dB, with the harmonics standing
                    # in for it. That content is 17 dB or more below the passband
                    # acoustically, so little is heard to go.
                    #
                    # It was thought to pay for itself in headroom -- sub-350 Hz
                    # energy costs peak without producing sound, so removing it
                    # should let stage 10 push harder. That holds only in the
                    # regime it was measured in, where the brickwall was working
                    # hard enough for the relief to be worth having. At the
                    # settings here it works on 0.1% of frames, so there is
                    # nothing to relieve and the energy is simply gone. Measured
                    # on music, spending whatever headroom is freed on makeup:
                    #
                    #   Gain 2   with g_out 2.40   with g_out 2.80
                    #     0.60      +1.07 LU          +2.00 LU
                    #     0.45      +0.88             +1.81
                    #     0.30      +0.78             +1.72
                    #
                    # THAT TABLE MEASURED THE WRONG THING, and the conclusion
                    # it carried -- "a loss in both directions" -- was reversed on
                    # 4 Sep 2026. It sweeps LOUDNESS AT FIXED g_out, in a regime
                    # where TRUE PEAK was the binding constraint. It is not any
                    # more; displacement is, and this control is the single
                    # biggest lever on it in the chain, because 1/f^4 weighting
                    # puts nearly all displacement in exactly the sub-350 Hz
                    # content Gain 2 turns down. There was no displacement metric
                    # until tools/offline-chain.py grew one the same day, which is
                    # why this went unseen for a month.
                    #
                    # Swept against DISPLACEMENT, music1, at fixed g_out:
                    #
                    #   Gain 2    dLU      displacement    real bass   harmonics
                    #     0.60    +0.00      +0.00 dB        +0.00       +0.00
                    #     0.45    -0.16      -1.21           -0.97       +0.30
                    #     0.30    -0.29      -3.02           -2.31       +0.56
                    #
                    # 0.45 gives back 1.21 dB of cone for 0.16 LU, and the whole
                    # remaining margin at the time was about 1.0 dB. Spending it
                    # on g_out and holding tilt at the listening level:
                    #
                    #   config                       dLU      displacement
                    #   Gain 2 0.6,  g_out 4.25     +0.00 LU    +0.00 dB
                    #   Gain 2 0.45, g_out 5.50     +0.56       -0.12
                    #
                    # MORE LEVEL FOR LESS CONE, which g_out alone can never do:
                    # 4.25 bought +0.42 LU and spent 0.52 dB. At 80% volume the
                    # gain is +1.07 dB rather than +0.56, the same level
                    # dependence the mk cut has.
                    #
                    # A/B'd on hardware at 80%, level-matched to 0.00 dB, and
                    # reported as sounding the SAME. That is what licenses the
                    # change: the voicing was judged equal, so the measurement
                    # decides, and it is not close.
                    #
                    # WHAT TO WATCH. Level-matched, this moves energy INTO
                    # 160-1000 Hz: deep bass -1.08 dB, harmonics +0.86, presence
                    # and top -1.05. 761 Hz is in that band and stages 2 and 10b
                    # both exist to suppress it, so if boxiness ever appears on
                    # other material, look here first. Note also that TILT reads
                    # +0.03 across this change and is the WRONG INSTRUMENT for it
                    # -- presence and deep bass fell together, so a two-point
                    # tilt sees nothing while the middle of the band moved.
                    #
                    # SWEPT UPWARD 14 Aug 2026, which had never been done -- the
                    # table above only goes DOWN from 0.6, so "a loss in both
                    # directions" was a claim about deepening. Raising it does
                    # deliver real bass, more than any other lever here:
                    #
                    #   Gain 2    40 Hz    100 Hz   160 Hz | THD 90Hz   IMD -3
                    #     0.6      ref       ref      ref  |   0.48%    4.38%
                    #     0.7    +0.88     +0.73    +0.46  |   0.55     4.88
                    #     0.8    +1.59     +1.33    +0.91  |   0.64     5.22
                    #     1.0    +2.59     +2.22    +1.75  |   0.89     5.76
                    #
                    # And it is still refused, for two reasons. The chain's OWN
                    # distortion nearly doubles at 90 Hz by 1.0 and IMD rises
                    # 32%; and that is only the part offline can see -- the
                    # excursion this puts on a 2 W micro-speaker is additional
                    # and unmeasurable here. The content being restored is the
                    # same sub-350 Hz that sits 17 dB or more below the passband
                    # acoustically, so most of it becomes cone travel rather
                    # than sound. This is the design of CN115442709B working as
                    # intended: harmonics stand in for bass the driver cannot
                    # radiate. 0.7 is the only value worth revisiting, and only
                    # with an acoustic excursion measurement (tools/max-level.sh)
                    # rather than an offline one. The GAP is now closed: the
                    # direction has been measured, not just assumed.
                    { type = builtin label = mixer name = s8sum_l control = { "Gain 1" = 1.0 "Gain 2" = 0.45 "Gain 3" = 0.06 } }
                    { type = builtin label = mixer name = s8sum_r control = { "Gain 1" = 1.0 "Gain 2" = 0.45 "Gain 3" = 0.06 } }

                    # -- stage 9: mid/side widening ---------- US8660271B2 --
                    # The only stage that crosses channels. Explicit M/S
                    # matrix rather than a plugin: no LSP or Calf stereo
                    # widener is installed, and the matrix is exactly unity at
                    # these settings, which the null test needs.
                    #   M = (L+R)/2, S = (L-R)/2, L' = M+S', R' = M-S'
                    # mixer gains are clamped to [0, 10] by the plugin, so
                    # every subtraction goes through an invert node.
                    { type = builtin label = invert name = s9negr }
                    { type = builtin label = mixer name = s9mid  control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                    { type = builtin label = mixer name = s9side control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }

                    # Side is split so bass width can be collapsed on its own.
                    # Two real filters, NOT the complementary S - LP(S) trick
                    # used at the f1 split. That trick reconstructs exactly at
                    # unity gains, which is why it is right for stage 3, but it
                    # is a bad high-pass the moment you turn the low band down:
                    # it rolls off at only 6 dB/octave and puts a +1.8 dB bump
                    # at the crossover. Measured with bass mono engaged it left
                    # the side only 7 dB down at 40-150 Hz, untouched at
                    # 150-300 Hz, and 1.9 dB LOUDER at 300-600 Hz.
                    #
                    # The cost of real filters: Gain 1 and Gain 2 are now
                    # alternatives, not a blend. Both at 1.0 notches the side
                    # at 300 Hz, because a Butterworth low-pass and high-pass
                    # pair sums to zero at the corner. Use 0/1 or 1/0.
                    { type = builtin label = bq_lowpass name = s9slp control = { "Freq" = 300.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = s9shp control = { "Freq" = 300.0 "Q" = 0.707 } }

                    # Gain 1 = side width below 300 Hz, Gain 2 = above it.
                    #
                    # Gain 1 = 0.0 is bass mono: below 300 Hz both channels get
                    # the mid signal and nothing else. On drivers this small
                    # the point is not audible imaging -- there is barely any
                    # output down there to image with -- it is excursion.
                    # Out-of-phase low content makes both cones move without
                    # producing sound, and this stops that.
                    #
                    # Gain 2 stays at 1.0: widening above 300 Hz is a separate
                    # decision, and doing both at once would make it impossible
                    # to tell which one changed the sound.
                    #
                    # THAT DECISION HAS NEVER BEEN TAKEN, so read the stage name
                    # accurately: at Gain 2 = 1.0 this stage applies NO widening
                    # at all. Measured 14 Aug 2026, side-minus-mid through the
                    # whole chain moves -0.53 to +0.17 dB over 400 Hz-16 kHz --
                    # unity, within noise. The bass-mono half is doing its job
                    # (-28.7 dB of side at 40 Hz); the widening half is inert by
                    # configuration, not by defect.
                    #
                    # What it would deliver, if ever wanted (music1, whole chain):
                    #
                    #   Gain 2   side-mid 400Hz-16k   mono-sum loss   true peak
                    #     1.0         -6.55 dB           -0.89 dB      -1.000
                    #     1.2         -4.97              -1.22         -0.997
                    #     1.5         -3.05              -1.77         -0.992
                    #
                    # Cheap in headroom -- 3.5 dB more side energy costs 8 mdB of
                    # true peak. The real cost is mono-sum loss, which is what a
                    # listener off-axis and any wall reflection hear. Taste, not
                    # a defect: do not ship it to close a "gap".
                    { type = builtin label = mixer name = s9swid control = { "Gain 1" = 0.0 "Gain 2" = 1.0 } }
                    { type = builtin label = invert name = s9negs }
                    { type = builtin label = mixer name = s9outl control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
                    { type = builtin label = mixer name = s9outr control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

                    # -- stage 10: multiband compressor ----- US12342139B2 --
                    # Lowest threshold on the LF band, and the makeup that
                    # returns stage 0's headroom.
                    #
                    # g_out 3.80 is +11.60 dB: +3.12 returns stage 0's trim,
                    # the rest is makeup for the gain reduction and for the
                    # loudness the hardware cannot supply, being already at 0 dB.
                    #
                    # This is the ONLY loudness lever left in the chain. Every
                    # other candidate was swept and rejected -- see the README
                    # section "Where the loudness is, and where it is not".
                    #
                    # WHAT BOUNDS IT IS NO LONGER TRUE PEAK. It was, and the
                    # value sat at 2.60 for that reason through two rounds of
                    # tuning, but the constraint was coming from ONE synthetic
                    # signal. On programme material true peak does not respond to
                    # g_out at all, because the limiter absorbs the increase:
                    #
                    #   g_out    music LUFS    dLU    music true peak
                    #    2.60      -12.28     +0.00      -0.633
                    #    2.80      -11.84     +0.44      -0.625
                    #    3.00      -11.45     +0.83      -0.625
                    #    3.20      -11.11     +1.17      -0.625
                    #
                    # Flat peak, rising loudness. Only the full-scale log sweep
                    # ever breached, and it breached because the limiter holds
                    # its SAMPLE peak at th while the inter-sample peak
                    # overshoots past it.
                    #
                    # The way through is stage 12's th. It is loudness-NEUTRAL on
                    # music -- +0.02 LU across its whole usable range, because it
                    # only ever catches rare transients -- but it does set where
                    # the sweep's overshoot lands. So th pays for the sweep and
                    # g_out collects the loudness: th 0.9290 -> 0.8900 costs
                    # music nothing and buys g_out 2.60 -> 3.00. Neither value
                    # means much without the other; move them together.
                    #
                    # CONFIRMED on hardware, both halves live-switched in one
                    # session at unity sink volume, against the 2.60 / 0.9290
                    # chain, with two real masters in the set:
                    #
                    #   signal      dLU     TP before   TP after   margin
                    #   music1     +0.78     -0.633      -0.999     0.799
                    #   music2     +0.61     -0.563      -0.936     0.736
                    #   pink       +1.24     -5.074      -3.831     3.631
                    #   square100  -0.10     -0.571      -0.943     0.743
                    #   sweep      -0.08     -0.874      -0.663     0.463
                    #
                    # +0.78 LU on the master against a predicted +0.80, and pink
                    # landed on its predicted true peak of -3.831 exactly. The
                    # two synthetic signals lose a tenth of a LU each; both are
                    # limiter-pinned, and neither is programme.
                    #
                    # music2 is the one that matters, and it is the hardest
                    # material in the repo: -11.25 LUFS trailer audio with
                    # dialogue over music, arriving at +0.634 dBTP -- already
                    # clipping before the chain sees it. It is 3.5 LU hotter than
                    # music1 and drives the limiter hardest, so it is where this
                    # change had the most room to go wrong. It did not: +0.61 LU
                    # with true peak 0.373 dB LOWER, and hardware reproduced the
                    # offline true peak to the third decimal on both sides.
                    # Dialogue also puts energy through 800 Hz, the one frequency
                    # where these drivers actually compress, which is the reason
                    # to keep a speech-carrying track in the set rather than only
                    # music.
                    #
                    # THE WORST-CASE MARGIN IMPROVED, which is the part worth
                    # keeping. Before: 0.371 dB, on square100. After: 0.463 dB,
                    # on the sweep. Louder AND further from the ceiling.
                    #
                    # WHAT BOUNDS IT NOW is limiter workload, not peak. At 3.00
                    # the limiter absorbs about 0.45 dB of the 1.25 dB that g_out
                    # adds; by 3.80 it is absorbing 1.35 dB and the cost is
                    # audible density rather than a number. Offline, the sweep
                    # holds about -0.40 dBTP all the way to 3.80 with th at
                    # 0.8900, so peak will not stop you -- 3.40 is a further
                    # +0.63 LU and is available. Past 3.00, listen before
                    # believing the meter.
                    #
                    # Thermal is the other bound and no capture here is long
                    # enough to see it: 3.00 is about 1.33x the average power of
                    # 2.60 into a 2 W driver already at its electrical maximum.
                    #
                    # The DRIVERS are not the constraint, and that is measured
                    # rather than assumed -- tools/max-level.sh, and the README
                    # section "What the drivers actually take". The tightest band
                    # still sits about 12.8 dB under where these drivers begin to
                    # compress after this change. Nothing here is limited by the
                    # speakers; it is limited by the DAC and by the limiter.
                    #
                    # Do NOT measure true peak with ffmpeg's loudnorm here. It
                    # over-reports by 1.4 dB on the sweep, and ebur128's 4x
                    # oversampling under-reports by the same order. They agree
                    # with each other and with an exact reconstruction on music
                    # and disagree on high-frequency content, which is exactly
                    # the case this limit is about.
                    # LSP GOTT rather than Calf MultibandCompressor. Measured
                    # offline with compression disabled, sweep against the
                    # unprocessed source, worst deviation per band:
                    #
                    #        band        Calf mode 0    GOTT
                    #     40- 150 Hz      +0.99 dB      0.00 dB
                    #    150- 400 Hz      +0.85 dB      0.00 dB
                    #    800-1300 Hz      -0.57 dB      0.00 dB
                    #    1.3-  3 kHz      -0.36 dB      0.00 dB
                    #
                    # GOTT's crossover is exactly transparent -- Linkwitz-Riley
                    # sections that sum flat. Calf's colours the 40-400 Hz
                    # region by about 1 dB and it cannot be tuned away: mode 1
                    # is worse (1.46 dB notch at the freq1 crossover) and moving
                    # the crossovers is worse still (2.23 dB).
                    #
                    # It also removes a footgun. Calf's per-band bypass0..3
                    # default to 1 (bypassed) while its master bypass defaults
                    # to 0, so the plugin can load and silently do nothing.
                    # GOTT's be_1..4 default to 1 (enabled).
                    #
                    # mode 1 (Modern) is what was measured. mode 2 is Linear
                    # Phase and would add real latency; the swap already costs
                    # about 1.3 ms (GOTT 5.00 ms group delay against Calf's
                    # 3.67), taking the path to roughly 27 ms of the 30 budget.
                    #
                    # ta_/tr_ MUST be set. GOTT defaults to 2 ms attack and
                    # 3.5 ms release, fast enough to modulate gain inside a bass
                    # cycle and manufacture the distortion this stage is there
                    # to avoid. These are Calf's values, carried across.
                    #
                    # ru_ = 1.0 disables GOTT's upward compression, and it must
                    # STAY off. It was measured as the next loudness lever and
                    # it is not one: the virtual sink's volume is applied before
                    # this graph, so upward compression lifts exactly what the
                    # volume control just lowered. Measured on music, as the
                    # error between the volume change asked for and the output
                    # change delivered:
                    #
                    #    volume     ru_ = 1 (off)   ru_ 1.5   ru_ 2.0
                    #     -6 dB        +0.64 dB      +2.82     +3.41
                    #    -12 dB        +0.59         +4.29     +5.41
                    #    -30 dB        +0.59         +4.47     +5.65
                    #
                    # Turning it down 30 dB gets you 24. It does buy about
                    # +1.9 LU, but it fights the only volume control the desktop
                    # has. This is the volume dependence US12342139B2 is about,
                    # and the fix for it is per-volume parameters, not a static
                    # upward compressor.
                    # ebe = 1 ("Enable extra band") and it MUST be set. It
                    # defaults to 0, and with it at 0 this plugin runs THREE
                    # bands, not four: sf3 = 6000 splits nothing, band 3 runs
                    # from 1 kHz to Nyquist, and td_4 / rd_4 / ta_4 / tr_4 /
                    # be_4 / mk_4 are all inert. Every one of them was set here
                    # from the day stage 10 was built and none of them did
                    # anything, so this chain ran three bands for its whole
                    # history while the config and the README both described
                    # four.
                    #
                    # Found by measuring what mk_3 actually moves, +2.98 dB
                    # applied to one control at a time, third-octave, against
                    # the same render with everything at unity:
                    #
                    #     band     mk_3 alone   mk_4 alone
                    #     2 kHz      +2.69        0.00
                    #     5 kHz      +2.60        0.00
                    #     8 kHz      +2.60        0.00
                    #    16 kHz      +2.61        0.00
                    #
                    # mk_4 moves nothing anywhere; mk_3 reaches the top octave.
                    #
                    # CORRECTED 14 Aug 2026. That table was taken with ebe = 0,
                    # when this plugin ran three bands and band 4 did not exist
                    # -- it is the SYMPTOM that found ebe, not a property of
                    # mk_4. With ebe = 1 as shipped, mk_4 works fully: swept
                    # offline on programme it delivers -3.04 dB at 10 kHz and
                    # +2.90 at 1.41, flat across 6.3-16 kHz, and moves nothing
                    # below 4 kHz. Do not read the table above as "mk_4 is
                    # inert" -- it is the fourth band's makeup and it is live.
                    # With ebe = 1 the same lift lands where it is aimed --
                    # +3.0 to +3.6 dB across 1.26-4 kHz, falling to +0.5 dB by
                    # 8 kHz, which is g_out alone. Costs 0.06 LU and it BUYS
                    # peak margin: true peak -0.928 -> -0.951 dBTP.
                    #
                    # mk_3 is VOICING, and it is the only thing in this chain
                    # still set from a comparison against another speaker rather
                    # than against this one's own measurement. (mk_2 was the
                    # other; it was removed 14 Aug 2026 -- see below. mk_4 is
                    # not a reference value: it carries half of the tilt
                    # correction, which came from this chain's own transfer.)
                    #
                    # Source: an acoustic A/B against an iPhone 13, 12 Aug 2026.
                    # Same programme (40 s of the trailer, 1:30-2:10, -10.26
                    # LUFS), same Mic2, same position, both devices at full
                    # volume. The mic's own response cancels when one capture is
                    # divided by the other, which is what makes an uncalibrated
                    # in-chassis mic able to answer this at all. Third-octave,
                    # noise-subtracted per session, iPhone minus this chain:
                    #
                    #     157 Hz  +9.8      1260 Hz  +3.9
                    #     198     +6.9      1587     +2.4
                    #     250     +5.2      2000     +6.3
                    #     315      0.0      2520     +7.5
                    #     397     -4.1      3175     +4.8
                    #     630     -5.4      4000     +1.6
                    #     794     -3.3
                    #
                    # Two corrections follow, and they pull opposite ways:
                    #
                    # mk_3 = 1.41 (+2.98 dB, band 3 = 1-6 kHz) fills the
                    # presence deficit. That gap holds the SAME SIGN across five
                    # consecutive bands over 1.3 octaves, which is what makes it
                    # a voicing difference and not a comb artefact -- a path
                    # artefact alternates sign as the path passes through
                    # half-wavelengths, which is exactly what everything above
                    # 4.5 kHz in that measurement does. It is nearly free: true
                    # peak -0.956 -> -0.938 dBTP, and it GAINS 0.55 LU. The
                    # drivers carry 21-25 dB of margin in this band.
                    #
                    # ON 14 Aug 2026 THESE BECAME mk_3 = 1.1864, mk_4 = 0.8414
                    # -- both 1.5 dB below the values above, taken together as a
                    # TILT correction. (Both came down a further 1.65 dB on
                    # 1 Sep 2026 to hold that same tilt when stage 11 went
                    # multiband; the shipped values are 0.9806 and 0.6954, and
                    # the reasoning is in the block just above the node.) Bands 3 and 4 are everything
                    # above 1 kHz, so cutting both by the same amount is a flat
                    # -1.41 dB shelf from 1.25 to 16 kHz that leaves the
                    # presence SHAPE alone; cutting mk_3 by itself would have
                    # left 6 kHz+ standing and made the top octave relatively
                    # more prominent, which is the opposite of what was asked
                    # for. Bass is untouched -- 50 Hz moves 0.02 dB.
                    #
                    # Why it was needed, and why nothing here had found it: the
                    # chain applied +11.75 dB at 2.5 kHz against +1.64 dB at
                    # 50 Hz, a 10.1 dB tilt, of which 5.65 dB is mk_3 and stage
                    # 10c together. Each was measured ALONE and each was nearly
                    # free alone; their sum was never taken. Nor could the
                    # iPhone A/B see it -- it licenses 250 Hz to 4.5 kHz, and a
                    # tilt is precisely the relationship between below-250 and
                    # above-1.6k, the two regions it cannot compare. Session D's
                    # detrending removes a broadband slope BY CONSTRUCTION.
                    # Reported by the listener, confirmed by measurement, and
                    # A/B'd on a -TEST sink before shipping.
                    #
                    # It is a cut, so per the rule below only headroom needed
                    # testing -- but it improves distortion as well: THD
                    # identical to two decimals at 90/400/2650 Hz, true peak
                    # improves on every signal, and SMPTE 60+2650 Hz IMD at
                    # -3 dBFS falls 8.18% -> 4.38%. Costs 0.3-0.5 LU.
                    #
                    # mk_2 = 1.0 -- REMOVED 14 Aug 2026. It was 0.89 (-1.01 dB,
                    # band 2 = 120-1000 Hz), taking down the residual 761 Hz
                    # resonance that stage 2 leaves, because 630-794 Hz is the
                    # one region where this chain reads HOTTER than the phone.
                    #
                    # It was the wrong instrument, and this file said so at the
                    # time: "2 dB flat across 120-1000 Hz is a blunt change to a
                    # band this chain is otherwise correcting narrowly", and the
                    # README's "a band makeup is the wrong place for a FIXED
                    # acoustic correction; a bell after the compressor is the
                    # right one". Stage 10b is that bell. It was built to take
                    # the residual AFTER mk_2, and mk_2 was then never removed.
                    #
                    # What the flat cut was costing, measured: -0.5 to -0.7 dB
                    # across 160-630 Hz, for -0.46 dB of useful work at 800.
                    # That collateral lands in the low-mid -- and the same
                    # iPhone A/B recorded below says this chain is DEFICIENT
                    # there (phone +5.2 to +9.8 dB at 157-250 Hz). It was
                    # cutting a region already short to fix one narrow peak.
                    #
                    # The swap: mk_2 to 1.0 and s10res from -3.0 to -3.7 dB, so
                    # 800 Hz is held while 160-630 is given back. Offline the
                    # residual at 800 is +0.06 dB on music1 and +0.01 on music2
                    # -- -3.7 was chosen over -3.6 by fitting BOTH tracks, not
                    # one. On hardware through a -TEST sink at matched volume:
                    # +0.79 dB gained over 160-630 Hz and 800 Hz held to
                    # +0.25 dB, inside the 1.4 dB re-setup repeatability, so the
                    # resonance correction survives intact. Costs about 0.2 dB
                    # at 40-100 Hz, which is GOTT redistributing, and that is
                    # the trade. A/B'd by ear and kept.
                    # (That advice used to rest on 2 dB "thinning the harmonic
                    # branch at 490-1008 Hz". Measured 13 Aug 2026: on real
                    # programme the branch runs 14-26 dB below the chain's own
                    # output in those bands, so nothing mk_2 does to it is
                    # audible in band power. The advice stands; the reason for
                    # it did not. See README, What the harmonic branch actually
                    # contributes.)
                    #
                    # What this measurement does NOT license, recorded so it is
                    # not read as more than it is:
                    #
                    #   - Nothing above 4.5 kHz. The +17.8 dB at 6.35 kHz is the
                    #     largest number in it and the least trustworthy: it
                    #     reproduces across sessions, so it is a real feature of
                    #     the speaker-to-INTERNAL-MIC path, but that mic is
                    #     inside the chassis and a 15 dB swing across a third of
                    #     an octave is a comb notch's shape. Settling it needs a
                    #     mic at the listening position.
                    #   - No distortion comparison. Coherence was the intended
                    #     metric and had to be abandoned: the phone's playback
                    #     path applies a time-varying fractional delay that
                    #     scrambles fine phase while leaving band envelopes
                    #     correlated at 0.85-0.93, so its coherence measures that
                    #     and this chain's measures the speaker. Response and
                    #     dynamics only.
                    #   - Nothing below 157 Hz. Neither device rose above the
                    #     room floor there, so the 157-250 Hz deficit is bounded
                    #     from above only.
                    #   - Do NOT answer that deficit by raising stage 8's
                    #     Gain 3. Those harmonics land at 490-1008 Hz, which is
                    #     precisely the excess mk_2 is here to remove. (Measured
                    #     since: on programme it would not answer it either way.
                    #     Taking Gain 3 from 0.06 to 0.12 moves 490-1008 Hz by
                    #     0.04-0.11 dB on real material. The knob only bites on
                    #     near-pure bass tones.)
                    #
                    # g_out 3.40 was taken in the same change, for the same
                    # reason (it is 3.80 since 1 Sep 2026): the phone runs about
                    # 3.5 dB DENSER (400 ms level
                    # spread p90-p10, 300 Hz-6 kHz: phone 6.1, this chain 9.6,
                    # source 9.6) while measuring no quieter. The note above
                    # about 3.40 buying density rather than headroom still
                    # stands -- density is now the thing being bought on purpose.
                    # lkahead = 0 -- SET EXPLICITLY, 1 Sep 2026. The port
                    # defaults to 5 ms, and that default was this stage's ENTIRE
                    # measured latency: impulse group delay 5.00 ms at the
                    # default, 0.33 ms at zero. The crossover costs almost
                    # nothing; the lookahead cost all of it.
                    #
                    # That 5 ms is why the latency table read 29.9 ms of a 30 ms
                    # budget, and why stage 12's lookahead was cut from 5 ms to
                    # 1 to pay for the true-peak oversampler. Both were paying
                    # for a port nobody had set.
                    #
                    # It buys nothing here. Measured through the whole chain:
                    #
                    #     signal      lkahead = 5        lkahead = 0
                    #     music1      -10.57 LUFS        -10.55
                    #     music2       -8.50              -8.50
                    #     square100    -8.64              -8.64
                    #
                    # True peak identical to 0.001 dB on all three, square100
                    # included -- and square100 is the transient case a
                    # lookahead exists for. Third time this plugin has hidden
                    # behaviour behind a default: ru_* = 1.0 being the port
                    # minimum, tm_* defaulting equal to tu_*, and now this.
                    # Write every port this stage depends on, including the
                    # ones you want at zero.
                    # g_out 3.40 -> 3.80 AND mk_3/mk_4 DOWN 1.65 dB, 1 Sep
                    # 2026, taken together as ONE change. Read them as one
                    # setting; either alone moves the voicing.
                    #
                    # Stage 11 went multiband on the same day and stopped ducking
                    # everything above 1 kHz on bass transients. That returned
                    # level where the driver works -- and returned it as TILT:
                    # +0.82 dB on music1, +1.55 on music2, because the amount
                    # stage 11 was darkening by depends on how hard the material
                    # drives the cone. The 14 Aug listener correction took 1.41 dB
                    # of tilt OUT. Shipping stage 11's fix without this trim would
                    # have quietly put most of it back.
                    #
                    # So mk_3/mk_4 come down 1.65 dB together -- the same flat
                    # 1.25-16 kHz shelf instrument the 14 Aug correction used, for
                    # the same reason: it leaves the presence SHAPE alone. And
                    # g_out goes up to spend the headroom that buys. Held at
                    # matched tilt, against the chain as it stood before today:
                    #
                    #   g_out  mk cut    music1              music2
                    #   3.40   -1.19  -0.03 LU  +0.07 dB   +0.09 LU  +0.00 dB
                    #   3.80   -1.65  +0.52 LU  +0.64 dB   +0.43 LU  +0.42 dB
                    #   4.25   -2.09  +0.97 LU  +1.16 dB   +0.73 LU  +0.79 dB  <- SHIPPED
                    #                 (loudness) (displacement)
                    #
                    # WHAT BOUNDS THIS IS THE CONE, not the ceiling. True peak
                    # is nowhere near binding -- the worst signal in the battery
                    # lands at -0.651 dBTP against a -0.20 ceiling at 4.25 -- the
                    # sweep, 0.451 dB inside it, worst of a seven-signal set -- and it
                    # stays flat all the way to g_out 4.50 because the brickwall
                    # pins it. What costs is displacement: roughly 1 dB of it per
                    # 1 LU, out of the 2.6 dB between stage 11's threshold and the
                    # driver's measured 1 dB compression point.
                    #
                    # 4.25 TAKEN 4 Sep 2026, AND THE GATE WAS RUN FIRST. The
                    # instruction that used to stand here was not to take this
                    # without re-running tools/max-level.sh, because that margin is
                    # measured rather than assumed and it is the only thing between
                    # a boosted transient and the end stop. It was re-run, on the
                    # same grid as the original:
                    #
                    #   800 Hz compression at full scale   2.34 dB  (was 2.35)
                    #   1 kHz                              0.85     (was 0.82)
                    #   800 Hz 1 dB point, interpolated   -8.05 dBFS (was -8.1)
                    #
                    # The driver has not moved, so this spends out of the same
                    # margin the figure was derived from. Everything else in the
                    # grid sits inside its own reference scatter, as before.
                    #
                    # It spends 1.16 dB of the 2.6, leaving about 1.0 dB. THE NEXT
                    # STEP IS NOT AVAILABLE ON THIS REASONING: half a margin for
                    # 1 LU was the argument against 4.25 when there were 2.1 dB in
                    # hand, and at 1.0 dB left it argues harder, not less. Anything
                    # above 4.25 needs a NEW measurement, not this one.
                    #
                    # CONFIRMED ON HARDWARE, captured at the physical sink either
                    # side of a live pw-cli change so nothing else moved:
                    #
                    #   music1 loudness   +0.42 LU measured, +0.44 predicted
                    #   music1 displace   +0.52 dB measured, +0.53 predicted
                    #   true peak         -0.991 dBTP, 0.791 dB inside the ceiling
                    #   tilt              held to 0.06 dB AT UNITY -- and that is
                    #                     the wrong place to have checked it; see
                    #                     the next block
                    #
                    # THE mk CUT IS 0.18 dB, NOT THE 0.44 THE UNITY MEASUREMENT
                    # ASKED FOR, and the reason is that this correction is
                    # LEVEL-DEPENDENT. mk_3/mk_4 are makeup gains sitting AFTER
                    # per-band compression, so how much of a change in them
                    # reaches the output depends on how hard those bands are
                    # compressing -- which depends on drive. A cut sized at unity
                    # is not the same cut at the volume anyone listens at.
                    #
                    # Measured both ways, level-matched, on music1, offline and
                    # then confirmed on hardware. Tilt change vs the 3.80 chain:
                    #
                    #   mk cut     at 80% volume    at unity
                    #   -0.44      -0.22 (-0.25 hw)  +0.02      dull where it is
                    #                                           actually used
                    #   -0.18      +0.03 (+0.03 hw)  +0.26      holds at 80%
                    #
                    # YOU CAN HOLD THE TILT AT 80% OR AT 100%, NOT BOTH. 0.18 is
                    # the choice to hold it at 80%, and it was confirmed by ear:
                    # -0.44 was reported dull on this machine before the
                    # measurement above was taken, and -0.18 was reported right.
                    #
                    # The argument beyond "hold it where you listen": this chain
                    # stops compressing below about -20 LUFS at the graph input.
                    # At 80% music arrives near -20.6 and film near -33, so nearly
                    # everything played here sits in the regime where -0.18 holds
                    # and -0.44 over-corrects. -0.44 is only right for loud music
                    # near full volume.
                    #
                    # It costs no headroom and no cone margin: the change is
                    # entirely above 1 kHz, so 1/f^4 displacement does not see it
                    # (0.00 to -0.12 dB across the battery, i.e. unchanged or
                    # slightly less), and worst true peak goes -0.651 -> -0.647
                    # dBTP, 0.447 dB inside the ceiling.
                    #
                    # WHAT IT COSTS ELSEWHERE, measured across the battery:
                    #   - THD at 400 Hz / -3 dBFS: 1.18% -> 1.38%. At -12 dBFS it
                    #     does not move (0.96% -> 0.95%). 90 Hz: 6.86% -> 7.05%.
                    #   - Stationary material LOSES: pink-prog -0.25 LU, pink
                    #     -0.41. They pay the mk cut and collect none of stage 11's
                    #     return, because pink has no bass transients for the old
                    #     broadband stage to have been ducking on. The gain here is
                    #     transient-dependent by construction; do not tune it on
                    #     noise.
                    #   - square100 -1.20 LU and 1.67 dB LESS displacement. That is
                    #     stage 11 working, and it is the direction that signal
                    #     should move.
                    # -- stage 9b: upper-bass lift ------------------------ --
                    # Added 4 Sep 2026, SHIPPED AT GAIN 0 -- bypass-equivalent
                    # until an A/B says otherwise. It exists because of a
                    # cross-device measurement, not a theory.
                    #
                    # An iPhone 13 playing a 25-150 Hz sweep, captured on Mic2
                    # against this chain playing the same file on the same mic,
                    # each normalised to its own total so the mic cancels:
                    #
                    #   Hz     iPhone   this chain   phone ahead by
                    #   25-63   -36..-27  -29..-21    -10 to -6  (WE win)
                    #   160      -4.4     -13.9         +9.5
                    #   200      -5.7     -20.0        +14.2
                    #   250      -6.2     -17.6        +11.3
                    #   400-1600 -25..-32  -5..-20     -14 to -25 (WE win)
                    #
                    # The phone's bass is 160-250 Hz. It radiates LESS than this
                    # chain below 63 Hz, so deep extension is not what is being
                    # heard. Our energy is at 400-1600 where the harmonic branch
                    # emits -- working as designed, but too high to read as bass.
                    #
                    # Gain 2 IS NOT THE LEVER for this, checked: fully open at
                    # 1.0 it returns +0.94 dB at 200 Hz on music1 and +0.15 on
                    # sustained organ, against a 14 dB gap. The hole is mostly
                    # the driver, which is 20 dB down by 251 Hz.
                    #
                    # WHY THIS SITS BEFORE GOTT, unlike 10b and 10c which sit
                    # after it on purpose. Boosting 200 Hz here makes GOTT
                    # compress harder, and that pulls down the 25-63 Hz content
                    # which is what actually moves the cone. Displacement
                    # therefore FALLS as this rises -- 1/f^4 weights 50 Hz 256x
                    # over 200 Hz, so trading sub-60 energy for 200 Hz energy
                    # is excursion spent on sound instead of heat:
                    #
                    #   bell   delivered at 200   dLU     displacement   margin
                    #   +3 dB      +1.63         +0.26      -0.62         2.26
                    #   +6 dB      +3.04         +0.52      -1.37         3.01
                    #
                    # It closes about 3 dB of 14 at best -- the dynamics eat
                    # half of whatever is set here. It is a large TONAL change
                    # and the failure mode is boominess, which is why it ships
                    # at 0 and moves only by ear.
                    { type = builtin label = bq_peaking name = s9blift_l control = { "Freq" = 200.0 "Q" = 1.2 "Gain" = 0.0 } }
                    { type = builtin label = bq_peaking name = s9blift_r control = { "Freq" = 200.0 "Q" = 1.2 "Gain" = 0.0 } }

                    { type = lv2 name = s10mbc plugin = "http://lsp-plug.in/plugins/lv2/gott_compressor_stereo"
                      control = { enabled = 1 mode = 1 g_in = 1.0 g_out = 6.50
                                  lkahead = 0.0
                                  g_dry = 0.0 g_wet = 1.0
                                  sf1 = 120.0 sf2 = 1000.0 sf3 = 6000.0
                                  ebe = 1
                                  be_1 = 1 be_2 = 1 be_3 = 1 be_4 = 1
                                  bs_1 = 0 bs_2 = 0 bs_3 = 0 bs_4 = 0
                                  bm_1 = 0 bm_2 = 0 bm_3 = 0 bm_4 = 0
                                  td_1 = 0.10 rd_1 = 4.0 ta_1 = 20.0 tr_1 = 250.0
                                  td_2 = 0.18 rd_2 = 3.0 ta_2 = 30.0 tr_2 = 250.0
                                  td_3 = 0.35 rd_3 = 2.0 ta_3 = 50.0 tr_3 = 200.0
                                  td_4 = 0.35 rd_4 = 2.0 ta_4 = 50.0 tr_4 = 200.0
                                  ru_1 = 1.0 ru_2 = 1.0 ru_3 = 1.0 ru_4 = 1.0
                                  mk_1 = 1.0 mk_2 = 1.0 mk_3 = 0.694218 mk_4 = 0.492308 } }

                    # -- stage 10b: residual resonance notch ---------------- --
                    # The 761 Hz cone resonance again, and since 14 Aug 2026 the
                    # SECOND and last instrument aimed at it rather than the
                    # third. Stage 2's Linkwitz transform takes about 5 dB, mk_2
                    # took 1.01 dB more, and an acoustic A/B on 13 Aug 2026 says
                    # 4.7 dB of it is still radiating. This was sized -3.0 dB
                    # against that residual; it is now -3.7, having absorbed
                    # mk_2's share so the flat band cut could be removed. See
                    # the mk_2 note above for what that cut was costing.
                    #
                    # Source: second iPhone 13 A/B, "Bum Baa Diga Diga"
                    # (-5.7 LUFS, +6.0 dBTP, LRA 3.2 -- a far denser master than
                    # the trailer stage 10 was set on). Same method as stage 10:
                    # same Mic2, same position, phone left physically in place
                    # for both captures so only the emitting device changed.
                    # iPhone minus this chain, after a smooth trend is fitted
                    # over 397-4000 Hz and removed, so that what is left is only
                    # what a smooth response difference CANNOT explain:
                    #
                    #     630 Hz  -2.5      1260 Hz  +2.9
                    #     794     -4.7      1587     +1.3
                    #     1000    -1.3      2000     +0.9
                    #
                    # Removing the trend is the whole discipline here. The RAW
                    # gap at 794 Hz is -6.5 dB, but the phone is rolling off
                    # below 1 kHz -- most of that is its speaker running out,
                    # not this one misbehaving. Correcting the raw number would
                    # have cut 6.5 dB out of the low mids to chase a limitation.
                    # 4.7 dB is the part that survives the trend, and 3.0 dB is
                    # what is taken.
                    #
                    # Freq 760: fitting a bell to that residual lands at
                    # 740-760 Hz Q 3-5, independently of tools/lt-coeffs.py,
                    # which measured the driver at 761 Hz Q 2.63 weeks earlier
                    # off a sweep. Two methods, different material, same answer.
                    #
                    # Gain -3.7, and NOT the -6.8 the unconstrained fit wants:
                    # -6.8 improves the residual rms from 2.34 to 1.78 dB where
                    # -3.0 already reaches 1.90, and it costs the stage 5-8
                    # harmonic branch 6.7 dB at 750 Hz instead of 3.0. Those
                    # harmonics are at 490-1008 Hz by construction and are the
                    # entire virtual-bass percept, so that trade is not worth
                    # 0.12 dB.
                    #
                    # The -3.0 this paragraph and the next were written for was
                    # the value until 14 Aug 2026, when mk_2 was removed and
                    # this bell absorbed its 0.7 dB share at 800 Hz. The
                    # REASONING is unchanged and still argues against -6.8; only
                    # the number moved. Read every "-3.0" below as "the depth
                    # before it absorbed mk_2".
                    #
                    # Q 3.0 is why this is a bell and not more mk_2. The config
                    # already ruled out mk_2 = 0.79 because 2 dB flat across
                    # 120-1000 Hz thins the branch. This costs it 0.4 dB at 490
                    # and 0.8 dB at 1008 for a deeper correction at the peak.
                    #
                    # WHY IT SITS HERE, between 10 and 11:
                    #   - After GOTT, so no band makeup can drift it. GOTT gives
                    #     back 2.8 dB more broadband on this master than on the
                    #     trailer and unevenly per band (-3.4/-3.3/-4.4/-5.0),
                    #     so a band makeup is the wrong place for a FIXED
                    #     acoustic correction.
                    #   - Before stage 11, whose sidechain is low-passed at this
                    #     same 761 Hz Q 2.63. The excursion estimator should see
                    #     the corrected signal: less is being radiated at the
                    #     resonance, so there is genuinely less displacement to
                    #     protect against.
                    #   - Before stage 12, so the brickwall still owns the
                    #     ceiling. This matters and was measured: applying the
                    #     same bell AFTER the limiter instead moves true peak
                    #     -1.0 -> -0.4 dBTP, because a minimum-phase filter
                    #     redistributes peaks the limiter had already flattened.
                    #
                    # WHAT IT ACTUALLY DELIVERS -- this is not -3.0 dB at the
                    # output, and the difference is worth knowing before anyone
                    # "corrects" it. Measured NEW minus OLD on the third-octave
                    # at 794 Hz, both rendered through the real graph in one
                    # session, ideal filter over that band being -2.81:
                    #
                    #     hot track  -2.22      music1  -1.67
                    #     music2     -2.05      sweep   -1.33
                    #
                    # Stages 11 and 12 hand 20-40% of it back. They are dynamic
                    # and the notch lowers what they see, so they compress less
                    # and restore part of it. The sweep is the extreme because
                    # its entire energy sits at the notch as it passes through;
                    # broadband programme, where 760 Hz is a small share, keeps
                    # most of the cut.
                    #
                    # Left at -3.7 rather than raised to hit -3.7 delivered.
                    # The give-back is programme-dependent (1.67 to 2.22 dB
                    # across three tracks), so a static gain chosen to hit the
                    # target on one would overshoot on another -- and the
                    # give-back is in the useful direction anyway: it backs off
                    # exactly when 760 Hz dominates, which is when overcutting
                    # would be most audible as a hole. -2.2 dB on the material
                    # this was measured on takes the 4.7 dB narrowband residual
                    # to about 2.5, inside the method's 3.5 dB worst case.
                    #
                    # Nothing else moves: outside 500-1300 Hz the largest
                    # third-octave change across the whole battery is 0.13 dB.
                    # DYNAMIC SINCE 2 Sep 2026, and built the same way stage
                    # 10c was: a parallel bandpass whose branch gain is moved by
                    # a compressor, rather than a fixed bq_peaking. The identity
                    # is the one 10c documents below --
                    #
                    #     dry - |k| * bandpass(f0, Qbp)  ==  bq_peaking(f0, Qpk, G)
                    #        k   = 10^(G/20) - 1        (negative for a cut)
                    #        Qbp = 10^(G/40) * Qpk
                    #
                    # -- and it holds for a CUT exactly as it does for a boost:
                    # verified to 4.4e-13 dB at 760/3.0/-3.7 against this file's
                    # own _rbj, which is the same order as the 3.3e-13 recorded
                    # for it below. The `invert` node carries the sign so the
                    # mixer gain can stay positive; PipeWire's builtin mixer is
                    # not documented to take a negative one and the chain
                    # already spells subtraction this way at stages 3 and 9.
                    #
                    # WHY. The static value was under-correcting and could not
                    # be raised. An acoustic A/B says 4.7 dB of the resonance is
                    # still radiating; -3.7 dB electrical delivers only 1.33 to
                    # 2.22 dB of that, because stages 11 and 12 are dynamic and
                    # hand 20-40% of any cut back. Raising the static value to
                    # hit the target on one track overshoots on another -- which
                    # is the same bind stage 10c was in at +3.0 against a fitted
                    # +4.0, and it has the same answer. Anchor at the measured
                    # residual, and let the branch back off when 760 Hz is what
                    # is playing, which is exactly when overcutting would be
                    # audible as a hole.
                    #
                    # Qbp IS FROZEN at 2.4244947873, the -3.7 dB value, and
                    # only the branch gain moves -- same approximation 10c
                    # makes. Peak gain stays exact at 760 Hz at every setting,
                    # to three decimals; the SHAPE error is what drifts, and
                    # WHERE it lands is what decides how deep the anchor can go:
                    #
                    #     anchor   |k|         peak got   err 500-1300   outside
                    #     -3.7   0.3468694     -3.700       0.000         0.000
                    #     -4.5   0.4043379     -4.500       0.101         0.046
                    #     -5.0   0.4376587     -5.000       0.182         0.081
                    #     -5.5   0.4691156     -5.500       0.276         0.122
                    #     -6.0   0.4988128     -6.000       0.382         0.167
                    #
                    # Read the last column, not the middle one. This chain's
                    # 0.13 dB "nothing else moves" bar was measured OUT OF BAND
                    # -- it is the largest third-octave change outside
                    # 500-1300 Hz -- and the frozen-Q error is overwhelmingly
                    # INSIDE the notch, which is to say the notch comes out
                    # slightly the wrong width rather than leaking somewhere
                    # else. Out of band the bar holds to -5.5 dB and breaks at
                    # -6.0. A first pass here read the middle column and capped
                    # the anchor at -4.6; that was the wrong column.
                    #
                    # ANCHORED AT -5.5, the deepest the frozen Q allows. The
                    # measured acoustic residual is 4.7 dB and the anchor is
                    # not what delivers it: stages 11 and 12 hand 20-40% back,
                    # so -5.5 electrical delivers 2.79 to 4.01 dB depending on
                    # material. The static -3.7 delivered 1.85 to 2.82 and was
                    # therefore under-correcting on everything, which is the
                    # bind this stage was actually in -- not the overcutting
                    # the earlier note here worried about.
                    #
                    # Deepening the anchor is very nearly free, measured across
                    # the whole battery: music1 loses 0.02 LU, true peak moves
                    # from -0.995 to -0.998 dBTP, and the chain's overall tilt
                    # moves 0.03 dB. Nothing here is spent on it.
                    { type = builtin label = bq_bandpass name = s10rbp_l control = { "Freq" = 760.0 "Q" = 2.4244947873 } }
                    { type = builtin label = bq_bandpass name = s10rbp_r control = { "Freq" = 760.0 "Q" = 2.4244947873 } }

                    # cr = 1.0, WHICH IS A WIRE, AND THAT IS THE MEASURED
                    # ANSWER -- not an unfinished stage. This branch was built
                    # to be dynamic and both directions were then swept through
                    # the whole chain. Neither has a job. Delivered depth at
                    # 800 Hz, anchor -5.5 throughout:
                    #
                    #                        music1  music2  pink-p  sq100  sweep
                    #   cr = 1.0 (wire)       -3.00   -3.58   -4.01  -1.97  -2.79
                    #   comp  -16 dBFS 4:1    -2.71   -2.81   -4.01  -1.82  -1.45
                    #   comp  -12 dBFS 4:1    -2.96   -3.34   -4.01  -1.96  -2.07
                    #   expander em=1 er=1.5  -3.22   -4.26   -4.01  -2.07  -4.55
                    #   expander em=1 er=2.0  -3.44   -5.03   -4.02  -2.17  -6.72
                    #
                    # A compressor only gives the anchor back. An expander only
                    # runs away on the sweep. NEITHER FLATTENS THE ROW, and the
                    # reason is the useful part: what makes the delivered depth
                    # programme-dependent is stages 11 and 12 handing part of
                    # any cut back, and their give-back is keyed on BROADBAND
                    # level, not on how much 760 Hz is present. square100 gets
                    # the most back because it drives the excursion limiter
                    # hardest, and no gain applied to a 760 Hz branch can
                    # reach that. 10c's dynamics work because a boost costs
                    # intermodulation at high level and backing it off buys the
                    # cost back. A cut has no such cost -- see "What a boost
                    # costs that a cut does not" -- so there is nothing here for
                    # dynamics to trade against.
                    #
                    # The node stays, inert, for the reason the whole chain was
                    # built as a skeleton first: if stage 11 or 12 ever changes
                    # what it hands back, this becomes a value edit rather than
                    # a topology edit, and the null gate below still holds.
                    #
                    # sla = 0.0 written explicitly, as at 10c, because that is
                    # where GOTT's lkahead hid 5 ms of this chain's budget.
                    { type = lv2 name = s10rdyn_l plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 sla = 0.0 cm = 0 cr = 1.0
                                  al = 0.1000 at = 5.0 rt = 300.0 kn = 0.5
                                  mk = 1.0 g_in = 1.0 g_out = 1.0 } }
                    { type = lv2 name = s10rdyn_r plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 sla = 0.0 cm = 0 cr = 1.0
                                  al = 0.1000 at = 5.0 rt = 300.0 kn = 0.5
                                  mk = 1.0 g_in = 1.0 g_out = 1.0 } }

                    { type = builtin label = invert name = s10rneg_l }
                    { type = builtin label = invert name = s10rneg_r }

                    # Gain 2 is |k|, and the invert ahead of it makes the sum a
                    # subtraction. THE REGRESSION GATE, exactly as it was for
                    # 10c: set Gain 2 back to 0.3468694474, Q to 2.4244947873
                    # and cr to 1.0, and the chain must reproduce the bq_peaking
                    # this replaced. Measured on music1: residual -120.0 dBFS,
                    # 106.6 dB below the signal, worst sample difference
                    # 1.6e-05 -- under a 16-bit LSB. Not bit-exact, and it
                    # cannot be: the branch takes one extra float32 round-trip
                    # through ffmpeg that the numpy biquad did not, and stages
                    # 10c, 11 and 12 amplify that at their gain decisions. The
                    # harness itself is bit-deterministic, checked, so that
                    # floor is the structure and nothing else.
                    { type = builtin label = mixer name = s10rsum_l control = { "Gain 1" = 1.0 "Gain 2" = 0.4691156 } }
                    { type = builtin label = mixer name = s10rsum_r control = { "Gain 1" = 1.0 "Gain 2" = 0.4691156 } }

                    # -- stage 10c: presence lift -------------------------- --
                    # The other half of what the same A/B measured, and the last
                    # thing in the whole comparison this method is competent to
                    # act on. mk_3 = 1.41 closed the 2-3.2 kHz presence deficit
                    # against the iPhone 13 from +6.2 to +3.4 dB. This finishes
                    # it. Same session, same captures, same discipline as 10b.
                    #
                    # Source: iPhone 13 minus this chain, third-octave,
                    # noise-subtracted, positive = the PHONE is louder, i.e.
                    # this chain is short. Raw gap, no trend removed, because
                    # unlike the 794 Hz case there is no rolloff to correct for
                    # -- the phone is well inside its own passband here:
                    #
                    #     1260 Hz  +2.4      2520 Hz  +4.5
                    #     1587     +1.6      3175     +3.5
                    #     2000     +2.1      4000     +1.9
                    #
                    # WHY THIS ONE IS SAFE TO ACT ON, when 5-10 kHz is not:
                    #   - Inside the licensed window. Below 4.5 kHz, above
                    #     250 Hz. Outside that this in-chassis mic cannot tell
                    #     a driver notch from a comb notch -- see the README.
                    #   - Above the noise. +4.5 dB against a split-half
                    #     repeatability of sd 0.77 dB, worst case 2.2.
                    #   - It is a SIGN RUN. +2.1/+4.5/+3.5/+1.9 across four
                    #     adjacent bands, one sign throughout. Path artefacts
                    #     alternate sign; that is exactly how 12.7 and 16 kHz
                    #     were disqualified in the same table.
                    #   - It is attributable. Dividing the chain's own measured
                    #     contribution out of the acoustic gap leaves the
                    #     DRIVER 7.6 dB down at 2520 Hz with the chain already
                    #     adding 3.0 back. mk_3 is aimed correctly and is
                    #     simply too shallow -- the same position stage 10b was
                    #     in, which is the good position to be in.
                    #
                    # Freq 2650 Q 1.2: fitted to those six points over
                    # 1260-4000 Hz, the unsettled bands deliberately excluded
                    # from the fit so they cannot drive it. The fit optimum is
                    # 2650 Hz Q 1.1-1.2 at +4.0 to +4.25 dB, which takes the
                    # residual rms from 2.85 to 0.72. The shipped gain is +3.0,
                    # not the fitted +4.0, and the reason is distortion rather
                    # than fit -- see WHAT IT COSTS below. At +3.0 the residual
                    # rms is 1.07, still better than a third of the raw gap.
                    #
                    # WHY NOT JUST RAISE mk_3, which is already the presence
                    # control. Because GOTT band 3 runs 1000-6000 Hz and makes
                    # up the whole of it flat. To buy +3 dB at 2520 that way
                    # costs +3 dB at 5040 as well -- a region three sessions
                    # have now declined to act on -- and another +3 dB at
                    # 1000 Hz, where this chain already reads 2.5 dB too HOT
                    # and stage 10b has just finished pulling it down. The bell
                    # puts +2.96 dB where it is wanted, +0.81 at 5040 and
                    # +0.36 at 1000. A band makeup cannot be aimed; this can.
                    #
                    # WHY IT SITS HERE, after 10b and before 11: same three
                    # reasons as 10b, which see. The one that is specific to a
                    # BOOST rather than a cut is the third -- before stage 12,
                    # so the brickwall still owns the ceiling. Measured, not
                    # assumed: sample peak is pinned at -1.012 dBFS with this
                    # in, unchanged on every signal.
                    #
                    # WHAT IT COSTS in peak and level: nothing, and it BUYS
                    # loudness. Stage 12 was already the binding stage, so a
                    # pre-limiter boost turns into density rather than headroom
                    # -- sample peak stays pinned at -1.012 dBFS and real
                    # programme gains about 0.3 LU. True peak actually improves
                    # on the sweep, the only signal that has ever bound this
                    # chain. The drivers are not the constraint either: 2 kHz
                    # and 3.15 kHz compression from tools/max-level.sh is +0.34
                    # and +0.23 dB at FULL SCALE, which is to say zero, against
                    # roughly 21 dB of margin at the chain's own output.
                    #
                    # WHAT IT COSTS in distortion, which is why the gain is 3.0
                    # and not the fitted 4.0. Harmonic distortion is a non-
                    # issue: THD on a 2650 Hz tone through the whole graph
                    # moves under 0.01 percentage points at -20, -12 and
                    # -3 dBFS. INTERMODULATION is not, and single-tone THD
                    # cannot see it. SMPTE 60 + 2650 Hz at 4:1, sidebands to
                    # the 5th order, this graph against the one before it:
                    #
                    #     peak      old     +4.0     +3.0     +2.0
                    #     -12    0.008    0.008    0.008    0.008
                    #      -9    0.069    0.072    0.071    0.070
                    #      -6    0.142    1.988    0.329    0.143
                    #      -3    1.320    9.876    8.135    5.644
                    #
                    # The knee is the LIMITER, not the squaring branch: muting
                    # stage 8's Gain 3 leaves the numbers unchanged (2.085 and
                    # 9.847). A 60 Hz sine carrying 80 % of the amplitude drives
                    # stage 12 into periodic gain reduction at 60 Hz, which
                    # amplitude-modulates whatever else is present, and raising
                    # 2650 Hz gives it more to modulate.
                    #
                    # On REAL programme this does not happen and that is what
                    # licenses shipping it at all. music2 renormalised to
                    # -6.3 LUFS and clipped at 0 dBFS -- harder than anything
                    # that plays here -- band-passed 2-4 kHz, 5 ms envelopes,
                    # the gain the chain applies to that band moment to moment:
                    #
                    #     old  mean +4.52  sd 4.786  p95-p5 13.159
                    #     +4.0 mean +6.44  sd 4.879  p95-p5 13.529
                    #     +3.0 mean +5.95  sd 4.850  p95-p5 13.410
                    #
                    # 2 % more gain modulation for 1.4 dB more presence. Real
                    # music is broadband and never hands the limiter a single
                    # dominant bass sine, so the two-tone knee is a stress
                    # result and not a defect. But it is a real regime, this
                    # master's energy does peak below 60 Hz, and +3.0 sits 6x
                    # lower on it than +4.0 for 0.5 dB less delivered gain.
                    # That is a cheap margin, so it is taken.
                    #
                    # Gain +3.0 and not inflated to hit +3.0 delivered. Stages
                    # 11 and 12 hand part of it back exactly as they do for
                    # 10b, and for the same reason and in the same useful
                    # direction: the give-back is largest when 2.6 kHz already
                    # dominates, which is when overcorrecting would be most
                    # audible as harshness. Under-correcting a presence lift is
                    # the safe side of the error, so it is left alone.
                    # BUILT AS A PARALLEL BANDPASS, not as a bq_peaking, so
                    # that the lift can be made level-dependent. The two are
                    # the SAME FILTER -- this is an identity, not an
                    # approximation:
                    #
                    #     dry + k * bandpass(f0, Qbp)  ==  bq_peaking(f0, Qpk, G)
                    #        k   = 10^(G/20) - 1
                    #        Qbp = 10^(G/40) * Qpk
                    #
                    # verified to 9.6e-15 dB at 2650/1.2/+3.0 and 3.3e-13 at
                    # 760/3.0/-3.7. PipeWire's bq_bandpass is the RBJ 0 dB peak
                    # form, which tools/offline-chain.py already self-tests.
                    #
                    # Qbp is FROZEN at the +3.0 dB value, 1.4262, and only the
                    # branch gain moves. The exact Qbp depends on the gain, so
                    # a frozen one is a bell only at +3.0 -- but the peak gain
                    # stays exact at every setting and the SHAPE error over
                    # +1 to +4 dB is at most 0.113 dB, against this chain's own
                    # 0.13 dB "nothing else moves" bar:
                    #
                    #     target   k        peak got   shape err
                    #     +1.0   0.1220     +1.00       0.057 dB
                    #     +2.0   0.2589     +2.00       0.057
                    #     +3.0   0.4125     +3.00       0.000
                    #     +4.0   0.5849     +4.00       0.113
                    { type = builtin label = bq_bandpass name = s10pbp_l control = { "Freq" = 2650.0 "Q" = 1.4262 } }
                    { type = builtin label = bq_bandpass name = s10pbp_r control = { "Freq" = 2650.0 "Q" = 1.4262 } }

                    # The dynamics. compressor_mono, the same plugin stage 7
                    # runs six of, self-keyed off the branch: the lift backs off
                    # as 2.6 kHz content gets loud and opens up when it does not.
                    #
                    # WHY SELF-KEYED AND NOT KEYED OFF THE BASS, which is what
                    # the IMD mechanism would suggest -- the knee is stage 12
                    # pumping at 60 Hz, so bass is the obvious detector. It is
                    # the wrong one twice over. It would be cross-band ducking,
                    # which the 1 Sep multiband stage 11 change exists to
                    # remove. And it is not needed: MEASURED, the branch level
                    # on the two-tone stress signals is HIGHER than on real
                    # programme, because a bare 2650 Hz sine concentrates in
                    # this bandpass where broadband music spreads.
                    #
                    #   branch level, 5 ms RMS envelope, dBFS
                    #   signal          p50    p90    p99    max
                    #   music1        -32.4  -24.0  -19.7  -16.5
                    #   music2        -25.8  -18.7  -14.8  -10.8
                    #   imd60_2650_6  -15.3  -15.3  -15.3  -15.3
                    #   imd60_2650_3  -12.4  -12.3  -12.3  -12.3
                    #
                    # So a detector that only ever looks at 2.6 kHz already
                    # separates the stress case from programme by 5 to 12 dB.
                    # al = 0.1 is -20 dBFS, which sits above music1 entirely and
                    # above music2 except on peaks, and 8 dB INTO the two-tone
                    # signals.
                    #
                    # al / cr swept, Gain 2 held at 0.5849. b2500 is the
                    # delivered third-octave at 2500 Hz on music1; IMD is SMPTE
                    # 60 + 2650 at 4:1, sidebands to the 5th order, at -6 and
                    # -3 dBFS peak, by tools/imd.py:
                    #
                    #   variant              b2500    IMD-6    IMD-3
                    #   +3.0 static (was)    10.18    0.075    5.202
                    #   +4.0 static (fit)    11.13    0.323    7.536
                    #   al -18 cr 2.0        11.09    0.075    5.330   FAILS
                    #   al -20 cr 2.0        11.02    0.075    4.656
                    #   al -22 cr 2.0 <-     10.91    0.075    4.053
                    #   al -24 cr 2.0        10.76    0.075    3.548
                    #
                    # THESE NUMBERS ARE NOT THE ONES THIS STAGE WAS FIRST FITTED
                    # ON. The first sweep ran through a harness bug -- mono LSP
                    # plugins were being fed a duplicated stereo pair, which
                    # reads 0.316 dB low on a compressor -- and it flattered
                    # every aggressive row. See the README. -18 looked like it
                    # passed and does not: at 5.330 it is WORSE than the static
                    # filter it replaces, which is the one thing this change is
                    # not allowed to be.
                    #
                    # -22 was taken over -20 when cr was fixed at 2.0, because
                    # -20 sat directly against the failing row. THEN cr AND rt
                    # WERE SWEPT TOO, which changes that answer -- a higher
                    # ratio lets the threshold go back up, because it leaves
                    # quiet material alone for longer and clamps harder once it
                    # does engage. Modulation is p95-p5 of the 2-4 kHz gain on
                    # the clipped stress fixture, which is the instrument a
                    # ratio change has to answer to, not IMD:
                    #
                    #   variant                b2500   IMD-3   modulation
                    #   +3.0 static (was)      10.18   5.202      8.895
                    #   cr 2.0 al -22 rt 150   10.91   4.053      9.152
                    #   cr 3.0 al -20 rt 150   10.99   3.900        --
                    #   cr 3.0 al -18 rt 150   11.07   4.695        --
                    #   cr 4.0 al -18 rt 150   11.07   4.388        --
                    #   cr 4.0 al -20 rt 150   10.97   3.581      9.194
                    #   cr 4.0 al -20 rt 300   10.93   3.580      9.093  <-
                    #   cr 6.0 al -18 rt 150   11.06   4.119        --
                    #
                    # The shipped row is the only one that improves on cr 2.0 in
                    # ALL THREE columns at once: same presence to 0.02 dB, 12%
                    # less intermodulation, and LESS gain modulation than the
                    # setting it replaces -- 9.093 against 9.152, where the
                    # static filter reads 8.895. A slower release is what buys
                    # that last column back; rt 150 at the same cr and al reads
                    # 9.194, the worst of the three.
                    #
                    # It still delivers 79% of the fitted gain (0.75 dB of the
                    # 0.95 the +4.0 row buys) with IMD-6 unmoved at baseline and
                    # true peak unmoved at -0.791 dBTP on the sweep.
                    #
                    # rt = 150 ms is slow enough that the branch gain does not
                    # track syllables -- see the gain-modulation measurement in
                    # the README, which is the instrument this has to pass, not
                    # THD.
                    #
                    # sla is written explicitly at 0 even though the PORT
                    # DEFAULT IS ALREADY 0 -- checked, unlike GOTT's lkahead,
                    # which defaulted to 5 ms and cost this chain two rounds of
                    # compromise before anyone read it. Measured 0.00 ms here.
                    { type = lv2 name = s10pdyn_l plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 sla = 0.0 cm = 0 cr = 4.0
                                  al = 0.1000 at = 5.0 rt = 300.0 kn = 0.5
                                  mk = 1.0 g_in = 1.0 g_out = 1.0 } }
                    { type = lv2 name = s10pdyn_r plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                      control = { enabled = 1 sla = 0.0 cm = 0 cr = 4.0
                                  al = 0.1000 at = 5.0 rt = 300.0 kn = 0.5
                                  mk = 1.0 g_in = 1.0 g_out = 1.0 } }

                    # Gain 2 is k. At cr = 1.0 the compressor is a wire and this
                    # sum is bit-identical to the bq_peaking it replaced -- that
                    # is the regression gate, not a claim.
                    { type = builtin label = mixer name = s10psum_l control = { "Gain 1" = 1.0 "Gain 2" = 0.5849 } }
                    { type = builtin label = mixer name = s10psum_r control = { "Gain 1" = 1.0 "Gain 2" = 0.5849 } }

                    # -- stage 11: excursion limiter -------- US12445775B2 --
                    #                                         CN115442709B --
                    # Open loop: the SN6140 exposes no I/V sense, so the control
                    # signal is an Hx(s) displacement estimate taken off the
                    # audio itself and fed to the sidechain.
                    #
                    # Hx(s) is a second-order LOW-pass at the driver's own
                    # measured resonance, 761 Hz Q 2.63. Cone displacement for a
                    # constant drive voltage follows exactly that shape: SPL
                    # goes as w^2 * x and the SPL response is a second-order
                    # high-pass, so displacement is its low-pass counterpart --
                    # flat below resonance, peaking by Q at it, 12 dB/octave
                    # above. It sits after stage 2, so the Linkwitz boost is
                    # already in the signal it measures.
                    #
                    # bq_lowpass, not bq_raw: the shape comes from Freq and Q,
                    # so unlike stage 2 there is nothing here to go stale if the
                    # graph rate ever changes.
                    { type = builtin label = bq_lowpass name = s11hx_l control = { "Freq" = 761.0 "Q" = 2.63 } }
                    { type = builtin label = bq_lowpass name = s11hx_r control = { "Freq" = 761.0 "Q" = 2.63 } }

                    # sct = 2 (External) is the default and is what routes sc_l
                    # and sc_r to the detector. scs = 5 takes the MAX of the two
                    # channels, so the harder-working cone sets the limit, and
                    # scm = 0 detects peaks rather than RMS because a cone hits
                    # its end stop on an instantaneous peak, not on an average.
                    #
                    # al = 0.708 is -3 dBFS on the estimate. x_max is unknown --
                    # no datasheet exists for these OEM drivers -- so the
                    # threshold is set from measured extremes instead: the Hx
                    # estimate reads -7.3 dBFS on pink noise, -1.7 on the sweep,
                    # +3.4 on the 100 Hz square, and about -1 for a full-scale
                    # low tone.
                    #
                    # THE SHAPE AND THE THRESHOLD ARE BOTH CONFIRMED NOW, on
                    # acoustic measurement rather than inference.
                    # tools/max-level.sh drives the raw sink with sine bursts at
                    # rising levels and reads the internal mic; every test level
                    # is bracketed by a -18 dBFS reference, so the answer is a
                    # difference and not a fit. Compression at full scale, at
                    # hardware volume 100%:
                    #
                    #     315 Hz  -0.06 dB     1250 Hz  +0.31 dB
                    #     400 Hz  -0.73        1600 Hz  +0.09
                    #     500 Hz  -0.17        2000 Hz  +0.34
                    #     630 Hz  -0.42        3150 Hz  +0.23
                    #     800 Hz  +2.35  <--   8000 Hz  +0.12
                    #    1000 Hz  +0.82       12500 Hz  -0.05
                    #
                    # Reference blocks repeat to 0.03-0.14 dB, so 800 Hz is the
                    # only frequency in the band that mechanically runs out, and
                    # 800 Hz is where this filter peaks. A displacement estimate
                    # built from fc and Qtc predicted the one frequency that
                    # compresses without ever being told about it, which is the
                    # strongest evidence in this file that Hx is the right
                    # control signal.
                    #
                    # It is also correctly, mildly conservative. Hx has +7.68 dB
                    # of gain at 800 Hz, so al = 0.708 is reached by an 800 Hz
                    # sine at -10.7 dBFS, and the driver's own 1 dB compression
                    # point measures -8.1 dBFS. This stage starts working 2.6 dB
                    # before the driver starts failing. Do not close that gap:
                    # it is a peak detector with a 5 ms attack and the measured
                    # figure is a steady tone, so a transient needs the margin.
                    #
                    # This stage IS working on ordinary music, which an earlier
                    # note here denied. Those extremes were all taken on the
                    # shipped test material, and tests/material/pink.wav is
                    # -20 dBFS RMS -- about 12 dB below anything you actually
                    # listen to. On a music track at a real level the Hx
                    # estimate peaks at +4.41 dBFS, 7.4 dB over threshold, and
                    # the stage removes 0.39 dB. At g_out 2.40 that is 0.68 dB.
                    #
                    # Left at -3 dBFS deliberately. It is the only thing between
                    # a boosted bass transient and a 2 W cone, x_max is unknown,
                    # and raising al to 1.0 recovers only 0.5 LU. It also does
                    # exactly what it should on the pathological case: the
                    # 100 Hz square gains 0.31 LU across the same g_out change
                    # that gains pink 1.37, because this stage clamps it.
                    # Lower it if anything ever buzzes; that is the one symptom
                    # this stage exists for.
                    # MULTIBAND SINCE 1 Sep 2026, and this stage was broadband
                    # for every measurement above. The settings below are the
                    # broadband ones, moved onto band 0, unchanged: scs = 5
                    # (Max), scm = 0 (Peak), al = 0.708, cr = 6, at = 5,
                    # rt = 100, kn = 0.501. scr and sla stay at their defaults,
                    # which are the same 10 ms and 0 ms the broadband plugin
                    # had. Every port name and default matches; sct is the one
                    # that does not exist here, and sce_0 = 1 replaces it.
                    #
                    # THE SETTINGS TRANSFER, THE RESPONSE DOES NOT. These are
                    # not the same engine with a crossover bolted on, and it is
                    # worth knowing before treating one as a drop-in for the
                    # other. Collapsed to a single band with every control
                    # matched, they do not null -- and driven with the same
                    # signal in isolation the multiband compresses far less:
                    #
                    #     isolated, music1 at   broadband GR   multiband GR
                    #     programme level          -6.51 dB       -0.41 dB
                    #
                    # So equivalence cannot be argued from the settings. It has
                    # to be measured IN THE CHAIN, where stage 11 sees a
                    # post-GOTT signal with a quite different crest factor than
                    # any bench test. There the two land in the same place, by
                    # all three bypass methods (ce_0 = 0, enabled = 0, cr_0 = 1,
                    # which agree exactly):
                    #
                    #     loudness this stage removes   broadband   multiband
                    #     music1                          0.91 dB     0.91 dB
                    #     music2                          1.05        0.95
                    #     square100                       1.89        3.89
                    #
                    # Same depth on music, twice the depth on the signal this
                    # stage exists for. That is the claim, and it is an in-situ
                    # one -- do not re-derive it from a bench comparison of the
                    # two plugins, which says something else.
                    #
                    # WHY. A cone has one displacement, and it is a low-frequency
                    # quantity. Ducking 3 kHz does nothing for it. The broadband
                    # stage pulled the whole spectrum down whenever a bass
                    # transient crossed the threshold, so vocals dipped with the
                    # kick for no mechanical benefit -- collateral damage, not
                    # protection.
                    #
                    # THE SPLIT AT 1 kHz IS NOT A TUNING CHOICE, it is where Hx
                    # runs out. Band 1 was tested driven by the same external
                    # sidechain at the same threshold and ratio 6, and again on
                    # sce_1 = 2 (Link): all three measured BIT-IDENTICAL to
                    # ce_1 = 0. Hx is a 761 Hz low-pass falling 12 dB/octave, so
                    # above 1 kHz its detector never reaches threshold no matter
                    # how it is configured. ce_1 = 0 states what the plugin does
                    # anyway. Do not move the split DOWN: 400-1000 Hz is where
                    # Hx peaks and where the driver measurably runs out of
                    # travel, so that region must stay inside band 0.
                    #
                    # PROTECTION IS NOT WEAKER, it is better placed. Hx applied
                    # to the chain OUTPUT -- the displacement the cone actually
                    # sees -- broadband to multiband:
                    #
                    #     signal      Hx peak    Hx rms   1/f^4 displacement
                    #     music1       +0.21     +0.05        +0.01 dB
                    #     music2       -0.24     -0.08        -0.07
                    #     pink-prog    -0.17     -0.05        -0.07
                    #     square100    -0.04     -2.32        -2.21
                    #
                    # square100 is the case this stage exists for and it is
                    # 2.2 dB better protected, because all of the gain reduction
                    # now lands in the band the square's energy is in instead of
                    # being spread over a spectrum that was not causing the
                    # excursion. music1 costs 0.21 dB of peak estimate, inside
                    # the 2.6 dB margin between this threshold and the driver's
                    # measured 1 dB compression point.
                    #
                    # THE CROSSOVER IS TRANSPARENT WHEN IT IS NOT WORKING.
                    # mode = 1 (Modern), and the two renders of a below-threshold
                    # signal null at -109.7 dB. It also adds NO latency: 0.00 ms
                    # measured by impulse, against the broadband plugin's 0.
                    #
                    # envb = 0 IS LOAD-BEARING. This plugin defaults it to 1
                    # (Pink BT) where GOTT defaults it to 0, so a drop-in arrives
                    # with envelope boost already on -- and README records that
                    # weighting the detector away from bass costs this driver
                    # 1.4-4.3 dB of excursion it cannot radiate. Wrong on any
                    # stage here, and worst on this one.
                    { type = lv2 name = s11xcur plugin = "http://lsp-plug.in/plugins/lv2/sc_mb_compressor_stereo"
                      control = { enabled = 1 mode = 1 envb = 0
                                  cbe_1 = 1 sf_1 = 1000.0
                                  cbe_2 = 0 cbe_3 = 0 cbe_4 = 0
                                  cbe_5 = 0 cbe_6 = 0 cbe_7 = 0
                                  ce_0 = 1 sce_0 = 1 scs_0 = 5 scm_0 = 0
                                  cm_0 = 0 al_0 = 0.708 cr_0 = 6.0
                                  at_0 = 5.0 rt_0 = 100.0 kn_0 = 0.501 mk_0 = 1.0
                                  ce_1 = 0 mk_1 = 1.0
                                  ce_2 = 0 ce_3 = 0 ce_4 = 0
                                  ce_5 = 0 ce_6 = 0 ce_7 = 0 } }

                    # -- stage 12: brickwall limiter ----------------------- --
                    # Always on, never bypassed for any test -- this is what
                    # stands between a boosted sub-bass transient and a 2 W
                    # sealed driver. th = 0.8900 is -1.01 dBFS sample. It is NOT
                    # -0.3 dBFS -- that was th = 0.96605, and it measured
                    # +0.137 dBTP on hardware.
                    #
                    # MEASURE THIS AGAINST tests/material/sweep_fs.wav, NOT
                    # sweep.wav. sweep.wav peaks at -6 dBFS, and overshoot
                    # scales with level, so it reports 0.59 dB of headroom that
                    # is not there. It reads th = 0.96605 -- the value the
                    # line above says clips -- as -0.248 dBTP, comfortably
                    # inside the ceiling. Against the full-scale file the real
                    # headroom is 0.470 dB and the ceiling is th = 0.9400
                    # (-0.210 dBTP, 0.010 dB to spare). That mistake has now
                    # been made twice, three weeks apart, which is why
                    # sweep_fs.wav exists. 0.8900 -> 0.9400 buys about +0.2 LU
                    # on programme and spends the whole margin: not worth it
                    # alone, only as the other half of a g_out move.
                    #
                    # alr and boost off: both apply gain below threshold and
                    # would put the skeleton off the baseline level.
                    #
                    # th IS A LOUDNESS CONTROL FOR THE SWEEP AND NOTHING ELSE.
                    # Measured across 0.9290 -> 0.9800 on a real master, the
                    # integrated loudness moves +0.02 LU total -- the limiter
                    # only catches rare transients, so raising th buys peak
                    # headroom that programme material never spends. What th DOES
                    # change is where the full-scale sweep's inter-sample
                    # overshoot lands, and that is the one signal that has ever
                    # bound this chain. So it is set LOW, to buy the sweep, and
                    # stage 10's g_out is set high to collect the loudness that
                    # costs. 0.9290 -> 0.8900 was worth g_out 2.60 -> 3.00, which
                    # is +0.78 LU on music. Read the two as one setting.
                    #
                    # THIS STAGE IS WHY THE NULL TEST LOST THE SWEEP. While
                    # it is engaging, the chain's output depends on where the
                    # input sits relative to the processing block: a ONE-SAMPLE
                    # input shift changes the output by -21 dBFS, and turning
                    # this stage off drops that to -70. It is the engaging that
                    # does it, not ovs, lk or th -- each was swept, none helps.
                    # Quiet the input until the limiter lets go and it vanishes
                    # (-6 dBFS in: -21.2; -18: -79.9; -30: -95.5). pink and
                    # square100 still null because pink stays under the ceiling
                    # and square100 is stationary, so its gain reduction is
                    # constant and a constant gain is shift-invariant. It is
                    # non-stationary material at the ceiling that breaks. See
                    # README "Repeatability". Not a defect to fix here: it is
                    # what a lookahead peak limiter does.
                    #
                    # ovs = 22 is True Peak/24 bit, and it is not optional.
                    # With ovs = 0 this limits SAMPLE peaks only: samples land
                    # at exactly -0.300 dBFS while the reconstructed waveform
                    # reaches +1.785 dBFS, and the codec's DAC clips it. That is
                    # analog clipping into a 2 W driver on exactly the loud
                    # transients where it would be heard.
                    #
                    #   ovs   sample pk   TRUE pk   latency
                    #    0      -0.300    +1.438    2.00 ms   DAC clips
                    #   11      +1.805    +2.278    1.56 ms   ceiling BROKEN
                    #   15      +2.035    +2.035    1.58 ms   ceiling BROKEN
                    #   19      +1.867    +1.886    1.58 ms   ceiling BROKEN
                    #   21      -0.300    +0.425    1.42 ms   still clips
                    #   22      -0.300    -0.020    3.58 ms   <- clean
                    #
                    # The "Full xN" modes 11/15/19 do not hold the sample
                    # ceiling at all -- measured, not assumed. Only 21 and 22
                    # (True Peak) work, and only 22 gets under 0 dBFS.
                    #
                    # x42's Digital Peak Limiter was measured as an alternative
                    # and is not better here: its truepeak mode has to back the
                    # threshold off to -0.6 dB to control inter-sample peaks,
                    # costing 0.54 dB of output RMS. Its truepeak control also
                    # defaults to 0, i.e. off. LSP holds -0.3 and still lands
                    # true peak at -0.020.
                    #
                    # lk = 1 ms, down from the 5 ms default. ovs = 22 costs
                    # 2.16 ms of latency and the path was already at 28.3 of a
                    # 30 ms budget; 1 ms lookahead brings it to 29.88. The
                    # ceiling is held exactly at 5, 2 and 1 ms of lookahead --
                    # measured when th was 0.96605, so the figure then was
                    # -0.300 dBFS; the point is that lookahead does not move it.
                    #
                    # This stage is no longer only a safety net, and at g_out
                    # 3.00 it is the thing setting the output level: it absorbs
                    # roughly 0.45 dB of the 1.25 dB g_out adds, and on the sweep
                    # it is what stands between the chain and a clipped DAC.
                    # Anything that makes it work materially harder -- a further
                    # g_out rise above about 3.40 -- is buying density, not
                    # headroom, and has to be judged by ear.
                    #
                    # -- stage 12a: band limit ---------------------------------
                    # A single bq_lowpass at 22 kHz, and the reason it exists is
                    # loudness, not tone.
                    #
                    # g_out was stuck at 2.40 because ONE signal said so: the
                    # full-scale log sweep reached +0.30 dBTP at 2.60 while
                    # music, pink and the square were all still clear. The
                    # overshoot is inter-sample, it lives in the sweep's last
                    # two seconds above 17 kHz, and it is there because near
                    # Nyquist there are barely two samples per cycle for the
                    # reconstruction filter to work with. ovs = 22 measures that
                    # correctly; it cannot make it go away.
                    #
                    # Removing the band removes the problem. Measured on
                    # tests/captures/gout/sweep.current.wav, filtered offline:
                    #
                    # CHOOSING THE CORNER. The overshoot lives at 22-24 kHz; the
                    # loudness lives across 18-22. So the true peak recovered is
                    # almost flat in corner frequency while the cost is not, and
                    # the first attempt at 18 kHz was on the wrong end of it.
                    # Measured: TP on the sweep capture, LUFS cost on the pink
                    # capture, both at g_out 2.40 without this filter:
                    #
                    #   corner    pink cost   TP recovered   @16 kHz   @18 kHz
                    #   18 kHz     -0.42 LU      0.712 dB    -1.02 dB  -3.01 dB
                    #   20 kHz     -0.25         0.684       -0.20     -0.70
                    #   22 kHz     -0.10         0.661       -0.01     -0.04
                    #
                    # 22 kHz keeps 93% of the benefit for a quarter of the cost,
                    # and -0.01 dB at 16 kHz retires the audibility question that
                    # 18 kHz's -1.02 dB legitimately raised.
                    #
                    # Do not read the 18 kHz row as an argument for going lower.
                    # Steeper or lower costs loudness fast and buys almost no
                    # extra true peak: 16 kHz Q0.707 x3 recovers 0.79 dB, only
                    # 0.08 more than 18 kHz, for -0.49 dB at 10 kHz.
                    #
                    # Placed BEFORE the limiter, not after. After, it would
                    # reshape the waveform the limiter had just clamped and put
                    # the overshoot back. Before, the limiter sees band-limited
                    # audio and its true-peak detector has an easier job.
                    #
                    # It is a builtin biquad, so it adds no latency -- there is
                    # none left in the 30 ms budget to add.
                    #
                    # At 22 kHz the audibility claim is close to trivial: the
                    # response is down 0.01 dB at 16 kHz and 0.25 dB at 20 kHz,
                    # into 2 W micro-speakers. If you disagree, delete these two
                    # nodes and put g_out back to 2.40 -- but note that the
                    # sweep, not this filter, is what has always set that
                    # ceiling, and stage 12's th is the cheaper way to pay it.
                    #
                    # THE COST IS NOT ZERO, and the first write-up of this
                    # understated it. "0.04 dB at 10 kHz" is a response figure,
                    # not a loudness one: on pink noise, which has energy all the
                    # way to Nyquist and is K-weighted upward, an 18 kHz corner
                    # cost 0.42 LU -- most of what raising g_out had just bought.
                    # Net gain on pink was +0.28 LU, not the +0.70 the g_out
                    # delta showed with the filter already on both sides.
                    # At 22 kHz the cost is 0.10 LU and the net is +0.60 --
                    # CONFIRMED on hardware against the pre-change chain, both
                    # halves live-switched in one session: pink -14.01 -> -13.41
                    # LUFS, and its true peak went DOWN 0.686 dB at the same
                    # time. Louder and lower-peaking together, which is the
                    # whole point. Worst true peak on any signal -0.571
                    # (square100), 0.37 dB inside the ceiling.
                    #
                    # Pink is the worst case here; music carries far less
                    # ultrasonic energy, so expect the net to be better on it.
                    { type = builtin label = bq_lowpass name = s12lp_l control = { "Freq" = 22000 "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = s12lp_r control = { "Freq" = 22000 "Q" = 0.707 } }

                    { type = lv2 name = s12brick plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = { enabled = 1 mode = 0 th = 0.8900 boost = 0 alr = 0
                                  ovs = 22 dith = 0 lk = 1.0 g_in = 1.0 g_out = 1.0 } }

                    # -- stage 13: A/B trim ------------- ITU-R BS.1770 --
                    # Static gain from tools/loudness-match.sh. Attenuation
                    # only -- the louder path gets trimmed, never the quieter
                    # one boosted. After the brickwall, so it cannot lift the
                    # signal back over the ceiling.
                    #
                    # Deliberately at unity rather than the value the loudness
                    # match asks for. The hardware mixer is already at 0 dB with
                    # nothing left to give, so the loudness stage 10 recovers is
                    # the only loudness available -- trimming it away here would
                    # hand it straight back.
                    #
                    # The cost is that speaker-dsp ab favours the tuned path by
                    # exactly that much, which is the bias the loudness match
                    # exists to remove. Level it for the duration of a
                    # comparison and put it back afterwards:
                    #   pw-cli set-param <id> Props '{ params = [
                    #       "s13trim_l:Mult" 0.4864 "s13trim_r:Mult" 0.4864 ] }'
                    #
                    # 0.4864 is -6.26 LU, RE-MEASURED 4 Sep 2026 at g_out 6.50 /
                    # Gain 2 0.45 /
                    # mk cut -0.18 / th 0.8900, on tests/material/music1.wav, a
                    # real -14.76 LUFS master: tuned -9.53 LUFS against raw
                    # -14.76. The history, because this number has rotted twice
                    # before: 0.6847 (-3.29 LU) at g_out 3.00, then 0.5811
                    # (-4.71 LU) at 3.80 after stage 11 went multiband, then
                    # 0.5495 (-5.20 LU) at 4.25 with the 0.44 cut.
                    #
                    # Measure this on MUSIC, not on pink. The previous figure,
                    # 3.44 LU, was taken on pink at g_out 2.40, and the offset
                    # went DOWN to 3.29 while g_out went UP two steps -- because
                    # music is limiter-pinned and pink is not, so the chain
                    # cannot add to music what it adds to pink. Pink overstates
                    # the offset, and the trim exists to make an A/B honest.
                    #
                    # Re-measure after any change to stages 7, 10, 11 or 12. Two
                    # earlier revisions of this comment rotted here -- 1.91 dB /
                    # 0.8026 and then 3.44 dB / 0.6730 -- so if you change a
                    # level and cannot re-run the tool, delete the number rather
                    # than leave it.
                    { type = builtin label = linear name = s13trim_l control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin label = linear name = s13trim_r control = { "Mult" = 1.0 "Add" = 0.0 } }
                ]

                links = [
                    # stage 0 -> 1 -> 2
                    { output = "s0trim_l:Out" input = "s1sub_l:In" }
                    { output = "s0trim_r:Out" input = "s1sub_r:In" }
                    { output = "s1sub_l:Out" input = "s2lt_l:In" }
                    { output = "s1sub_r:Out" input = "s2lt_r:In" }

                    # stage 3/4 split: LF = LP(f1), HF = s2lt - LF
                    { output = "s2lt_l:Out" input = "s4lp_l:In" }
                    { output = "s2lt_r:Out" input = "s4lp_r:In" }
                    { output = "s4lp_l:Out" input = "s3neg_l:In" }
                    { output = "s4lp_r:Out" input = "s3neg_r:In" }
                    { output = "s2lt_l:Out" input = "s3hf_l:In 1" }
                    { output = "s3neg_l:Out" input = "s3hf_l:In 2" }
                    { output = "s2lt_r:Out" input = "s3hf_r:In 1" }
                    { output = "s3neg_r:Out" input = "s3hf_r:In 2" }
                    { output = "s3hf_l:Out" input = "s3dly_l:In" }
                    { output = "s3hf_r:Out" input = "s3dly_r:In" }

                    # stage 4: LF into three subbands
                    { output = "s4lp_l:Out" input = "s4bp1_l:In" }
                    { output = "s4lp_l:Out" input = "s4bp2_l:In" }
                    { output = "s4lp_l:Out" input = "s4bp3_l:In" }
                    { output = "s4lp_r:Out" input = "s4bp1_r:In" }
                    { output = "s4lp_r:Out" input = "s4bp2_r:In" }
                    { output = "s4lp_r:Out" input = "s4bp3_r:In" }

                    # stage 5 pre-gain, then x^n
                    { output = "s4bp1_l:Out" input = "s5pre1_l:In" }
                    { output = "s4bp1_r:Out" input = "s5pre1_r:In" }
                    { output = "s4bp2_l:Out" input = "s5pre2_l:In" }
                    { output = "s4bp2_r:Out" input = "s5pre2_r:In" }
                    { output = "s4bp3_l:Out" input = "s5pre3_l:In" }
                    { output = "s4bp3_r:Out" input = "s5pre3_r:In" }
                    # stage 5: x^n, n inputs of one mult tied to one subband
                    { output = "s5pre1_l:Out" input = "s5h1x4_l:In 1" }
                    { output = "s5pre1_l:Out" input = "s5h1x4_l:In 2" }
                    { output = "s5pre1_l:Out" input = "s5h1x4_l:In 3" }
                    { output = "s5pre1_l:Out" input = "s5h1x4_l:In 4" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 1" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 2" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 3" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 4" }
                    { output = "s5pre1_l:Out" input = "s5h1x5_l:In 5" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 1" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 2" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 3" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 4" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 5" }
                    { output = "s5pre1_l:Out" input = "s5h1x6_l:In 6" }
                    { output = "s5pre2_l:Out" input = "s5h2x3_l:In 1" }
                    { output = "s5pre2_l:Out" input = "s5h2x3_l:In 2" }
                    { output = "s5pre2_l:Out" input = "s5h2x3_l:In 3" }
                    { output = "s5pre2_l:Out" input = "s5h2x4_l:In 1" }
