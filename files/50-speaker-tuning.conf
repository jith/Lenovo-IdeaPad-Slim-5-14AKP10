# Speaker tuning DSP "punch + dynamics" - Lenovo IdeaPad Slim 5 14AKP10 (83HX)
# Base tuning = the "punch" chain (user-preferred, commit 2e7dc11), built from an
# actual acoustic measurement (2026-07-15, stepped tones played through the raw
# speaker, recorded with the internal analog mic array):
#   - driver output collapses below ~450 Hz (-18..-45 dB, THD up to 90%):
#     anything sent below ~270 Hz is inaudible distortion + wasted headroom
#   - big boxy hump at 710-1000 Hz (+7..+10 dB) - THE vocal masker
#   - presence dip at 2.5-2.8 kHz (-3..-6 dB)
#   - harsh peak at 10-11 kHz (+9 dB) - THE "metallic" source
#
# NEW (2026-07-16): iPhone-style dynamics:
#   - LSP Multiband Limiter Stereo (LV2, lsp-plugins-lv2 package): 4 bands
#     (bass|vocal|presence|air), each true-lookahead limited independently,
#     plus a final -1 dBFS brickwall on the sum. Separation: loud bass ducks
#     only bass; vocals/treble untouched (verified: 3 kHz bit-identical with
#     and without a full-tilt 500 Hz tone at the band stage). Lets drive run
#     at +8 dB without hard-clip harshness.
#     LV2-in-graph safety verified by measurement 2026-07-16: LSP keeps
#     processing at 100%/50%/25% sink volume (the old LADSPA skip bug does
#     not apply to LV2; sink volume is applied BEFORE the graph).
#   - DYNAMIC psycho-bass (builtin): the synthesized bass harmonics duck a
#     few dB on loud passages (envelope on the harmonic branch), so bass
#     stays punchy at normal levels but never piles up / turns pitchy.
#
# ---- TUNING KNOBS (edit + systemctl --user restart pipewire wireplumber) ----
#   Loudness/makeup  : drive_l/drive_r "Mult"   (2.5=+8dB, 3.2=+10dB, 3.6=+11dB)
#   Final ceiling    : lim "th"    (0.891 = -1 dBFS; lower = more headroom)
#   Band ceilings    : lim "th_1..th_4" bass|vocal|presence|air. Defaults
#                      0.75|-2.5dB, 0.71|-3dB, 0.63|-4dB, 0.355|-9dB.
#                      (2026-07-22: layout fixed to consecutive splits - the
#                      old gap-indexed se_2/4/6 layout mis-mapped the params:
#                      vocals were really on th_3 and 2.5-11 kHz had NO active
#                      ceiling at all, measured by tone captures. th_1/th_2
#                      here = the previously ACTIVE bass/vocal values, so bass
#                      and vocal behavior is unchanged; th_3/th_4 newly cap the
#                      treble that used to run free to the brickwall = the
#                      "ears hurt at high frequencies" fix.)
#   Band splits      : lim "sf_1"=650 "sf_2"=2500 "sf_3"=8000 (CONSECUTIVE
#                      se_1/2/3 only - gap-indexing breaks the band mapping!)
#   Release          : lim "rt_n" ms (raise toward 20 for gentler recovery)
#   NEVER enable     : lim "alr*" (auto-level, kills ~11 dB) or "gb*" (boost)
#   Loudness contour : loud "volume"/"input" are RUNTIME-managed by the
#                      speaker-loudness service - editing them here is
#                      overwritten on the next volume change
#   Vocal density    : mbc "bsa_5" = max dynamic lift of quiet vocals
#                      (1.12=+1dB, 1.26=+2dB default, 1.41=+3dB); unity above
#                      al_5 x knee (-13 dB). Presence lift: bsa_6/al_6.
#                      "ce_X" 0 bypasses a band. KEEP "cm_X" = 2 (Boost) on
#                      lift bands: cm=1 "Up" is UNCAPPED (measured +11 dB @-39).
#   Dynamic bass     : mbc "bsa_0" quiet-bass lift (1.41=+3dB, 1.6=+4dB dflt)
#   Dynamic box cut  : mbc "cr_4" 2:1 dflt (more = harder unmasking when the
#                      710-1000 hump is hot), "al_4" 0.4 = onset level; static
#                      part is box_l/r (see below) - keep their sum ~-9 dB hot
#   ECHO WARNING     : lift swell after notes/words reads as ECHO. Keep mbc
#                      releases slow (rt_0 400, rt_4 800, rt_5/6 400), lifts
#                      modest (bsa <= ~1.6) and mode = 2 (linear-phase; mode 1 combs
#                      = metallic). Verified with burst+tail capture 2026-07-21:
#                      swell +4.9 dB/250 ms -> +1.4 dB/300 ms slow drift.
#   Bass amount      : harm_g "Mult"  (3..8, default 6.5)
#   Bass duck thresh : bd_cl "Min" (0.15..0.5, default 0.3); keep bd_log "M1"
#                      = 1/thresh in sync!
#   Bass duck depth  : bd_log "M2" (0 = off, -0.3 default, -0.6 = strong)
#   Stereo width     : w_g "Mult" (0 = off/exact bypass, 0.3 default subtle,
#                      0.6 = wide; center vocals mathematically untouched)
#   Body/warmth      : body_l/r "Gain"   (3..6 dB, default 5.0)
#   Vocal clarity    : box_l/r "Gain"    (-5..-2, default -3.5 static; the
#                      mbc 650-1100 band adds the dynamic part when hot)
#   Presence         : pres_l/r "Gain"   (2..4, default 3.0)
#   Less metallic    : metal_l/r "Gain"  (-8..-3, default -3.0; S6 traded static
#                      cut for GOTT band-4 dynamic cut) + lim "th_4"
#   Thermal guard    : thermal "knee" (0.70 = strong protection / duller loud
#                      music, 0.85 default since S1, 1.6 = nearly off). MUST be
#                      re-measured if the analog Speaker level ever changes -
#                      the guard is digital and cannot see that; regenerate the
#                      FIR (fir_l/fir_r) only from a new measurement session
#   Crest clipper    : clip "ce" 0 = bypassed (default). Measured +0.56..1.13 dB
#                      for 3-4x the THD on hot sustained content - rejected on
#                      cost/benefit. "ct" alone does nothing; needs "thresh" +
#                      "boost" = 1. See the node comment before re-enabling.
#   Bass depth vs vol: HP corner map lives in speaker-loudness-follow (S2)

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker Tuning DSP"
            filter.graph = {
                nodes = [
                    # ---------- input taps ----------
                    { type = builtin label = copy name = in_l }
                    { type = builtin label = copy name = in_r }

                    # ---------- volume-aware loudness contour (Apple-style) ----------
                    # ISO 226 equal-loudness compensation (LSP loud_comp, IIR
                    # mode = low latency). At low volume the ear loses bass and
                    # treble sensitivity; this shifts the EQ with the knob.
                    # "volume" (listening level dB) and "input" (makeup, cancels
                    # the double attenuation since the sink already applied its
                    # cubic taper pre-graph) are updated at RUNTIME by
                    # /usr/local/bin/speaker-loudness-follow via
                    #   pw-cli s effect_input.speaker-tuning Props ...
                    # Defaults = flat (volume 0 dB = 100%): safe if follower dies.
                    { type = lv2 plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_stereo" name = loud
                      control = { "volume" = 0.0 "input" = 1.0 "mode" = 1.0 "hclip" = 0.0 } }
                    # ---------- S8: loudness normalization across sources ----------
                    # (2026-08-02) Placed immediately after the contour so every
                    # downstream stage - GOTT, the clipper slot, the limiter - sees a
                    # consistent level regardless of source, and operates in the window
                    # it was tuned for. This is why a quiet clip and a loud master no
                    # longer need the volume knob touched between them.
                    #
                    # The critical choice is SLOW, BETWEEN-SOURCE normalization, not
                    # within-track levelling. GOTT already does the latter; doing it
                    # twice pumps and flattens music. Hence lperiod at maximum.
                    #
                    # Two defaults here are actively dangerous and are overridden:
                    #   max_on default 0 + max_amp default 36 dB would apply up to
                    #   +36 dB to quiet passages and detonate on the noise floor.
                    # silence -60 keeps it from chasing the floor between tracks.
                    { type = lv2 plugin = "http://lsp-plug.in/plugins/lv2/autogain_stereo" name = norm
                      control = {
                          "enabled" = 1.0
                          "lperiod" = 2000.0
                          "level"   = -16.0
                          "silence" = -60.0
                          "max_on"  = 1.0
                          "max_amp" = 12.0
                          "qamp"    = 0.0
                          "scmode"  = 0.0
                      } }
                    # fan-out taps: one output port must drive one link in this
                    # graph engine ("already used by link, use copy") - copies
                    # feed the widener, psycho-bass and EQ coherently
                    { type = builtin label = copy name = cpl }
                    { type = builtin label = copy name = cpr }

                    # mono mix feeding the bass-harmonics branch
                    { type = builtin label = mixer name = mid
                      control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }

                    # ---------- stereo widener (mid/side delta, vocal-safe) ----------
                    # Adds w_g x side-signal to L and subtracts it from R, side
                    # high-passed at 350 Hz. Center (mono) content has zero side
                    # signal -> passes BIT-IDENTICAL; mono sum L+R unchanged;
                    # bass stays untouched. w_g "Mult" 0 = exact bypass.
                    { type = builtin label = linear      name = w_nl control = { "Mult" = -0.5 } }
                    { type = builtin label = mixer       name = w_s
                      control = { "Gain 1" = 0.5 "Gain 2" = 1.0 } }
                    { type = builtin label = bq_highpass name = w_hp control = { "Freq" = 350.0 "Q" = 0.707 } }
                    # S5 (2026-08-02) shaped shuffler. The side gain was FLAT above
                    # 350 Hz; widening now peaks where the ear's ITD/ILD image cues
                    # actually live (~1-3 kHz) and rolls off before the metallic band so
                    # widening never feeds 9-11 kHz. Mono safety is structural and
                    # survives any LINEAR shaping of the side path: centre content has
                    # zero side signal, so it still passes bit-identical. Zero latency.
                    { type = builtin label = bq_peaking  name = w_pk control = { "Freq" = 1800.0 "Q" = 0.6 "Gain" = 5.0 } }
                    { type = builtin label = bq_lowpass  name = w_lp control = { "Freq" = 8000.0 "Q" = 0.707 } }
                    # 0.3 -> 0.32: the mono psycho-bass is summed in AFTER the widener,
                    # which raises mid without raising side and so dilutes the side/mid
                    # ratio in the 330-680 Hz harmonic band.
                    { type = builtin label = linear      name = w_g  control = { "Mult" = 0.32 } }
                    { type = builtin label = linear      name = w_nd control = { "Mult" = -1.0 } }
                    { type = builtin label = mixer       name = w_l
                      control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
                    { type = builtin label = mixer       name = w_r
                      control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

                    # ---------- psychoacoustic bass ----------
                    # take everything below the HP cutoff...
                    # S7 (2026-08-02) SPLIT-BAND harmonic generation - the fix for
                    # "kick drum and bass guitar together turn to mush".
                    # x^2 and x^3 are nonlinear, so feeding them the WHOLE <250 Hz mono
                    # sum means two simultaneous bass notes intermodulate: x^2 of (a+b)
                    # is a^2 + 2ab + b^2, and that 2ab cross term is not a harmonic of
                    # anything - it is mud, and it lands right in the 330-680 Hz window
                    # the branch is trying to fill. Generating per sub-band removes the
                    # cross term for notes that fall in different bands.
                    # bass_hp: content below ~80 Hz produces no useful harmonic in the
                    # 330-680 Hz window (its 2nd/3rd land at 160-240) but plenty of
                    # cross-term mud, so it is removed before the nonlinearity.
                    { type = builtin label = bq_highpass name = bass_hp  control = { "Freq" = 80.0  "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = bass_lp1 control = { "Freq" = 250.0 "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = bass_lp2 control = { "Freq" = 250.0 "Q" = 0.707 } }
                    # split the 80-250 Hz source into two legs at ~150 Hz
                    { type = builtin label = bq_lowpass  name = sp_lo control = { "Freq" = 150.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = sp_hi control = { "Freq" = 150.0 "Q" = 0.707 } }
                    { type = builtin label = mult name = sq_lo }   # low leg  x^2
                    { type = builtin label = mult name = cu_lo }   # low leg  x^3
                    { type = builtin label = mult name = sq_hi }   # high leg x^2
                    { type = builtin label = mult name = cu_hi }   # high leg x^3
                    # four legs now: lo-x2, lo-x3, hi-x2, hi-x3. Weights per leg are
                    # the original 1.3 (x^2) / 2.0 (x^3) so the timbre is unchanged.
                    { type = builtin label = mixer name = hsum
                      control = { "Gain 1" = 1.3 "Gain 2" = 2.0 "Gain 3" = 1.3 "Gain 4" = 2.0 } }
                    { type = builtin label = dcblock name = bass_dc }
                    # ...and place the harmonics at 350-650 Hz: the lowest band
                    # this driver actually reproduces (measured)
                    { type = builtin label = bq_bandpass name = harm_bp control = { "Freq" = 420.0 "Q" = 1.0 } }  # S7: Q 0.75 -> 1.0, keeps harmonics below ~680 Hz where the box cut is -7 dB
                    # kill the sub-300 Hz residue of the harmonics (the driver is
                    # dead there; digitally it wastes headroom and pumps the
                    # limiter). Two cascaded stages (LR4-style); gain 4.0 -> 4.8
                    # compensates the ~1.6 dB this costs at 450 Hz, so audible
                    # punch level is unchanged.
                    { type = builtin label = bq_highpass name = harm_hp  control = { "Freq" = 300.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = harm_hp2 control = { "Freq" = 300.0 "Q" = 0.707 } }
                    { type = builtin label = linear name = harm_g control = { "Mult" = 6.5 } }

                    # ---------- dynamic psycho-bass (duck harmonics when loud) ----------
                    { type = builtin label = abs        name = bd_abs }
                    { type = builtin label = bq_lowpass name = bd_lp  control = { "Freq" = 5.0 "Q" = 0.5 } }
                    { type = builtin label = clamp      name = bd_cl  control = { "Min" = 0.3 "Max" = 1.5 } }
                    { type = builtin label = log        name = bd_log control = { "Base" = 2.0 "M1" = 3.3333 "M2" = -0.3 } }
                    { type = builtin label = exp        name = bd_exp control = { "Base" = 2.0 } }
                    { type = builtin label = mult       name = bd_mult }

                    # ---------- measured corrective EQ (per channel) ----------
                    # protect: below ~270 Hz = inaudible distortion only
                    { type = builtin label = bq_highpass  name = hp_l    control = { "Freq" = 270.0   "Q" = 0.65 } }
                    { type = builtin label = bq_highpass  name = hp_r    control = { "Freq" = 270.0   "Q" = 0.65 } }
                    # S2a (2026-08-02) staggered second HP section at 0.75 x the main
                    # corner. One 12 dB/oct section was the only excursion protection,
                    # even though the psycho-bass branch already cascades two HPs for the
                    # same reason. Staggered rather than a plain LR4 because it buys
                    # -7.6 dB more at 135 Hz while costing only 0.26 dB at 400 Hz and
                    # 0.10 dB at 560 Hz - the body band is untouched.
                    # The daemon drives BOTH sections: hp_* = HPF, hp2_* = 0.75 x HPF.
                    { type = builtin label = bq_highpass  name = hp2_l   control = { "Freq" = 200.0   "Q" = 0.707 } }
                    { type = builtin label = bq_highpass  name = hp2_r   control = { "Freq" = 200.0   "Q" = 0.707 } }
                    # body: lowest competent octave, extends perceived bass
                    # S2b (2026-08-02) OVERBOOST: 5.0 -> 8.0, paired with mbc band 0
                    # (see :296). US 12,342,139 names a static shelf like this as the
                    # thing it improves on: "the low shelf filter cannot use more
                    # headroom than is available. Most musical content is not a full
                    # scale most of the time, and the use of the low shelf filter does
                    # not take advantage of this." +5 was sized for the worst case, so
                    # it threw away the headroom that exists nearly all the time.
                    # Now: boost past what is sustainable and let a compressor on the
                    # SAME band claw it back only when content actually demands it.
                    # NEVER raise this without mbc band 0 enabled - alone it overdrives.
                    { type = builtin label = bq_peaking   name = body_l  control = { "Freq" = 560.0   "Q" = 1.0 "Gain" = 8.0 } }
                    { type = builtin label = bq_peaking   name = body_r  control = { "Freq" = 560.0   "Q" = 1.0 "Gain" = 8.0 } }
                    # flatten the measured 710-1000 Hz box hump (vocal unmasking).
                    # -3.5 static since 2026-07-21: the mbc's 650-1100 band adds
                    # up to ~-6 dB more DYNAMICALLY when the hump is actually
                    # hot, so the old -5.5 static cut over-thinned quiet content
                    { type = builtin label = bq_peaking   name = box_l   control = { "Freq" = 800.0   "Q" = 1.3 "Gain" = -3.5 } }
                    { type = builtin label = bq_peaking   name = box_r   control = { "Freq" = 800.0   "Q" = 1.3 "Gain" = -3.5 } }
                    # fill the measured 2.5-2.8 kHz presence dip
                    { type = builtin label = bq_peaking   name = pres_l  control = { "Freq" = 2600.0  "Q" = 1.4 "Gain" = 3.0 } }
                    { type = builtin label = bq_peaking   name = pres_r  control = { "Freq" = 2600.0  "Q" = 1.4 "Gain" = 3.0 } }
                    # tame the measured 10-11 kHz peak (the metallic edge).
                    # -6 dB, wider Q: the raw peak is +9..+11 dB and the
                    # aluminum chassis rings; the old -3.5 left it dominant.
                    # S6 (2026-08-02): -6.0 -> -3.0, static cut traded for dynamic cut.
                    # Summed against the deployed FIR the region was -12.3 dB at 9 kHz
                    # and -8.4 dB at 10.5 kHz, PLUS the limiter's -9 dB air ceiling:
                    # safe when loud, dull when quiet. Every measurement it was designed
                    # from used the display-bezel mic, which with up-firing drivers sits
                    # near the display reflection and in the drivers' upward HF beam, so
                    # it over-reads 8-12 kHz relative to the ear. Loud-content
                    # protection now comes from GOTT band 4 (deepened, see :311) and the
                    # unchanged lim th_4 cap - not from a static cut that also applies
                    # at whisper level.
                    # THIS IS THE BAND BEHIND THE EAR-PAIN BUG (e524719). Revert with:
                    #   "metal_l:Gain" -6.0 "metal_r:Gain" -6.0
                    { type = builtin label = bq_peaking   name = metal_l control = { "Freq" = 10500.0 "Q" = 1.2 "Gain" = -3.0 } }
                    { type = builtin label = bq_peaking   name = metal_r control = { "Freq" = 10500.0 "Q" = 1.2 "Gain" = -3.0 } }

                    # ---------- fine-ripple FIR correction (2026-07-23, S1) ----------
                    # Min-phase 2048-tap FIR from the 1/12-octave 3-pass acoustic
                    # measurement (both/L-only/R-only at 3 lid angles, power-
                    # averaged to reject mic-position combing). Corrects only the
                    # RIPPLE between the coarse biquad points toward the chain's
                    # own broad voicing trend (voicing itself unchanged):
                    #   key fixes: extra -7 dB @ 670-800 (box hump still ~+7 over
                    #   the mid plateau after the static cut), -7 dB @ ~9 kHz
                    #   (the TRUE metallic peak center - the 10.5 kHz biquad
                    #   partially missed it), +1..+2 dB fills @ 1.1-1.4 kHz,
                    #   +3 dB (capped) into the 5.4-6.4 kHz dip.
                    # Caps: boost <=+4 dB (<=+3 in the position-dependent 5-7 kHz
                    # null region, 0 above 9 kHz - never boost the metallic
                    # band), cut >=-8 dB; flat below 300 Hz and above 14 kHz.
                    # Min-phase = no added latency, no pre-echo. IR is scaled
                    # 0.25 in the wav; gain 4.0 restores unity.
                    { type = builtin label = convolver name = fir_l
                      config = { filename = "/usr/local/share/speaker-dsp/fir-correction.wav" gain = 4.0 } }
                    { type = builtin label = convolver name = fir_r
                      config = { filename = "/usr/local/share/speaker-dsp/fir-correction.wav" gain = 4.0 } }

                    # mix harmonics into both channels
                    { type = builtin label = mixer name = sum_l
                      control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
                    { type = builtin label = mixer name = sum_r
                      control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

                    # ---------- adaptive dynamics: 5-band compressor (LV2) ----------
                    # NOTE 2026-07-21: bands ship DISABLED (ce_* = 0) - the user
                    # chose the GOTT leveler below as production default after
                    # A/B listening. Full tuned band set kept for instant
                    # switch-back (swap commands in the GOTT block).
                    # (2026-07-21) Phone-DSP style input-adaptive processing,
                    # every band verified with level-ramp capture A/B:
                    #   <650    BASS LIFT (Boost): quiet bass +4.5 dB -> unity
                    #           when loud. Quiet bass lines stay audible.
                    #   650-1100 DYNAMIC BOX CUT (Down 2.5:1): the measured
                    #           710-1000 Hz hump is cut HARDER the hotter it
                    #           gets (up to ~-6 dB dynamic on top of the -3.5
                    #           static box_l/r cut) - adaptive vocal unmasking;
                    #           when the band is quiet nothing is thinned.
                    #   1100-2500 VOCAL CORE LIFT (Boost): +5 dB quiet -> exact
                    #           unity above -13 dBFS (loud vocals untouched).
                    #   2500-8000 PRESENCE LIFT (Boost): +3 dB quiet detail.
                    #   >8000   pass-through: the metallic 10-11k region must
                    #           never be lifted (limiter th_4 caps it).
                    # MODE SEMANTICS (measured, LSP 1.2.x): cm=1 "Up" is an
                    # UNCAPPED ratio-slope lift (+11 dB at -39 dBFS - bsa/bth
                    # do NOT cap it; avoid). cm=2 "Boost" = bsa-capped plateau,
                    # unity above al x knee. Pink loudness with all bands on:
                    # +0.9 dB vs bands bypassed (peaks still -1 dBFS).
                    { type = lv2 plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo" name = mbc
                      control = {
                          # mode 2 = Linear Phase: minimum-phase crossovers comb-filter the vocal
                          # region when band gains differ (audible as metallic echo);
                          # costs a few ms latency - set mode 1 if lipsync ever bothers
                          "enabled" = 1.0 "mode" = 2.0 "g_in" = 1.0 "g_out" = 1.0
                          "g_dry" = 0.0 "g_wet" = 1.0
                          "cbe_1" = 0.0 "cbe_2" = 0.0 "cbe_3" = 0.0
                          "cbe_4" = 1.0 "sf_4" = 650.0
                          "cbe_5" = 1.0 "sf_5" = 1100.0
                          "cbe_6" = 1.0 "sf_6" = 2500.0
                          "cbe_7" = 1.0 "sf_7" = 8000.0
                          # bass <650: Boost mode, quiet bass +4.5 dB max
                          # S2b (2026-08-02) band 0 is now the ONLY active mbc band, and
                          # it is DOWNWARD (cm_0 = 0), not Boost. It exists solely to
                          # claw back the +3 dB overboost on body_l/r when the <650 Hz
                          # band is actually hot - the patent's "only apply compression
                          # to frequency bands that are being overboosted, leaving the
                          # other bands uncompressed". al_0 0.45 -> 0.60 and cr_0
                          # 2.0 -> 1.5 came from measurement, NOT from the old
                          # Boost-mode values (al means the opposite thing in Down mode).
                          # Measured, 400 Hz at three input levels, vs the old +5 static:
                          #   al=0.60 cr=1.5   quiet +1.98   mid -0.09   loud +0.03 dB
                          #   al=0.50 cr=1.5   quiet +1.98   mid -0.30   loud +0.05
                          #   al=0.60 cr=2.0   quiet +1.98   mid -0.55   loud +0.07
                          #   al=0.50 cr=3.0   quiet +1.98   mid -1.62   loud -0.19
                          #   al=0.25 cr=3.0   quiet +1.44   mid -3.42   loud -1.82
                          # Ratio matters more than threshold: anything above ~1.5
                          # removes more than the 3 dB of boost, making MID-level
                          # content quieter than before - and mid is where music sits.
                          # Band selectivity verified by crush test: al_0=0.01 cr_0=100
                          # took 400 Hz down 16.7 dB while 3 kHz moved +0.28 dB.
                          # NOT volume-indexed via the daemon (the plan proposed it):
                          # the compressor is the signal-adaptive version of the same
                          # idea and measurably works, so a knob-indexed gain on top
                          # would fight it.
                          "ce_0" = 1.0 "cm_0" = 0.0 "al_0" = 0.60 "cr_0" = 1.5
                          "at_0" = 15.0 "rt_0" = 250.0 "bsa_0" = 1.6 "bth_0" = 0.1 "mk_0" = 1.0
                          # box 650-1100: Down 2.5:1, dynamic hump cut when hot
                          "ce_4" = 0.0 "cm_4" = 0.0 "al_4" = 0.4 "cr_4" = 2.0
                          "at_4" = 10.0 "rt_4" = 800.0 "mk_4" = 1.0
                          # vocal core 1100-2500: Boost mode, +5 dB max
                          "ce_5" = 0.0 "cm_5" = 2.0 "al_5" = 0.5 "cr_5" = 2.0
                          "at_5" = 15.0 "rt_5" = 400.0 "bsa_5" = 1.26 "bth_5" = 0.1 "mk_5" = 1.0
                          # presence 2.5-8k: Boost mode, +3 dB max
                          "ce_6" = 0.0 "cm_6" = 2.0 "al_6" = 0.4 "cr_6" = 1.5
                          "at_6" = 15.0 "rt_6" = 400.0 "bsa_6" = 1.12 "bth_6" = 0.1 "mk_6" = 1.0
                          # air >8k: pass-through (limiter th_4 still caps it)
                          "ce_7" = 0.0
                      } }

                    # ---------- EXPERIMENTAL: GOTT two-sided leveler (bloom-style) ----------
                    # (2026-07-21 A/B experiment) LSP GOTT compressor: per band a
                    # "comfort zone" - upward compression below tu, downward
                    # above td, floor at tm. The closest LV2 to oeksound bloom /
                    # Gullfoss auto-leveling. PRODUCTION DEFAULT since 2026-07-21
                    # (user pick after A/B listening) - the 5-band mbc stage
                    # above ships bypassed; swap at runtime to compare:
                    #   GOTT on : pw-cli s effect_input.speaker-tuning Props
                    #     '{ params = [ "gott:enabled" 1 "mbc:ce_0" 0 "mbc:ce_4" 0
                    #                   "mbc:ce_5" 0 "mbc:ce_6" 0 ] }'
                    #   mbc on  : swap the 1/0s back
                    # Timing deliberately slow (anti-echo, see ECHO WARNING);
                    # tm floor -25 dB bounds the tail runaway (measured: without
                    # it the upward ratio drags reverb tails +7 dB and climbing;
                    # with it the swell converges at +3.5 dB/600 ms).
                    # A/B verdict 2026-07-21: GOTT +0.8 dB louder, much stronger
                    # quiet-detail lift (+4.5 bass/+6.5 vocal vs mbc), tails sit
                    # ~4 dB hotter and mid-pause swell is steeper. User chose
                    # GOTT by ear regardless (detail/loudness win). If vocals
                    # ever turn washy/roomy: raise tm_* floor, or switch back.
                    { type = lv2 plugin = "http://lsp-plug.in/plugins/lv2/gott_compressor_stereo" name = gott
                      control = {
                          "enabled" = 1.0 "mode" = 2.0 "prot" = 1.0
                          "g_in" = 1.0 "g_out" = 1.0 "g_dry" = 0.0 "g_wet" = 1.0
                          "sf1" = 650.0 "sf2" = 2500.0 "sf3" = 8000.0
                          # bass <650: zone -20..-6 dB, gentle 2:1 both ways
                          "be_1" = 1.0 "tm_1" = 0.056 "tu_1" = 0.1 "td_1" = 0.5
                          "ru_1" = 2.0 "rd_1" = 2.0 "ta_1" = 25.0 "tr_1" = 400.0 "mk_1" = 1.0
                          # vocals 650-2500: zone -18..-5 dB
                          "be_2" = 1.0 "tm_2" = 0.056 "tu_2" = 0.125 "td_2" = 0.56
                          "ru_2" = 1.7 "rd_2" = 2.0 "ta_2" = 15.0 "tr_2" = 400.0 "mk_2" = 1.0
                          # presence 2.5-8k (2026-07-22 HF-pain pass): weaker
                          # up-lift (ru 1.5->1.2, zone top -20->-22) so sibilance
                          # tails/hiss are dragged up less; downward starts -6->-8
                          "be_3" = 1.0 "tm_3" = 0.056 "tu_3" = 0.079 "td_3" = 0.4
                          "ru_3" = 1.2 "rd_3" = 2.0 "ta_3" = 15.0 "tr_3" = 400.0 "mk_3" = 1.0
                          # air >8k: downward only (ru 1 = no upward - never
                          # lift the metallic 10-11k region)
                          # S6 (2026-08-02): td_4 0.32 -> 0.25, rd_4 2.0 -> 3.0.
                          # Takes over the protection the static metal_* cut used to
                          # provide: air band starts levelling downward earlier
                          # (-9.9 -> -12 dB) and harder (2:1 -> 3:1), so loud content is
                          # held at least as tightly as before while quiet content keeps
                          # the +3 dB of air that S6 restored. ru_4 stays 1.0 - the air
                          # band must NEVER be lifted upward.
                          "be_4" = 1.0 "tm_4" = 0.005 "tu_4" = 0.01 "td_4" = 0.25
                          "ru_4" = 1.0 "rd_4" = 3.0 "ta_4" = 10.0 "tr_4" = 400.0 "mk_4" = 1.0
                      } }

                    # ---------- loudness: makeup drive into lookahead limiter ----------
                    # S0 (2026-08-02): 3.6 -> 2.5. The analog side was throwing away
                    # 7.00 dB (Speaker element sat at 67/74) which the DSP path inherited
                    # from whatever the RAW sink was last left at - measured, not a HW
                    # limit (element max IS 0.00 dB, no UCM/TLV cap). The daemon now pins
                    # the hardware sink at 0 dB, so drive comes back 3.17 dB: net ~+3.8 dB
                    # SPL with ~3 dB less limiter gain reduction than before.
                    { type = builtin label = linear name = drive_l control = { "Mult" = 2.5 } }
                    { type = builtin label = linear name = drive_r control = { "Mult" = 2.5 } }

                    # S3 (2026-08-02) crest-factor clipper - IN GRAPH BUT BYPASSED.
                    # Kept for A/B the same way the mbc stage is. Measured and rejected
                    # on cost/benefit, NOT because it fails to work.
                    #
                    # The idea: all loudness so far comes from gain reduction (the
                    # limiter), which costs what it gains. A soft clipper reduces crest
                    # instead - same peak, more RMS.
                    #
                    # PARAMETER TRAP, cost hours: "ct" (sigmoid threshold) does NOTHING
                    # on its own - 0.9/0.7/0.5/0.3 all measured bit-identical. The real
                    # controls are "thresh" (dB) AND "boost"=1. With thresh=0 the clipper
                    # never engages no matter what ct says. Do not repeat that hunt.
                    #
                    # Measured through the whole chain (pink RMS; THD at 400 Hz, tone at
                    # -3 dBFS "hot" and -23 dBFS "quiet"). Baseline THD 9.2% is mostly
                    # the psycho-bass branch's INTENTIONAL harmonics, not driver error:
                    #   bypassed      THD hot  9.2%  quiet 0.47%   pink -13.39
                    #   thresh=-1     THD hot 26.7%  quiet 0.47%   pink -12.83  (+0.56)
                    #   thresh=-2     THD hot 32.9%  quiet 0.47%   pink -12.47  (+0.92)
                    #   thresh=-3     THD hot 38.6%  quiet 0.47%   pink -12.26  (+1.13)
                    #   thresh=-6     THD hot 53.1%                pink -12.11  (+1.28)
                    # Level-dependence is correct - quiet content is untouched at every
                    # setting. But even the gentlest setting nearly TRIPLES THD on hot
                    # sustained content to buy 0.56 dB, and the projected +2-3 dB never
                    # materialised (peaks fall below the limiter ceiling, so part of the
                    # apparent RMS gain is just unused headroom). On a driver whose
                    # defining problem is distortion, that is a bad trade.
                    #
                    # To try it anyway (one line, no reinstall):
                    #   pw-cli s effect_input.speaker-tuning Props \
                    #     '{ params = [ "clip:ce" 1.0 "clip:thresh" -1.0 "clip:boost" 1.0 ] }'
                    # Revert with "clip:ce" 0.0 "clip:thresh" 0.0.
                    { type = lv2 plugin = "http://lsp-plug.in/plugins/lv2/clipper_stereo" name = clip
                      control = {
                          "enabled" = 1.0  "g_in" = 1.0  "g_out" = 1.0
                          "lufs_on" = 0.0  "thresh" = 0.0  "boost" = 0.0
                          "ce" = 0.0  "cf" = 5.0  "ct" = 0.70  "cp" = 0.0
                          "dcoff" = 0.0  "dcomp" = 1.0
                          "op" = 0.0  "slink" = 100.0  "dither" = 0.0
                      } }

                    # ---------- multiband lookahead limiter: LSP (LV2) ----------
                    # 4 bands (<650 | 650-2500 | 2500-8000 | >8000 Hz), each
                    # limited independently at its own unequal ceiling (see
                    # knobs above), then a main brickwall on the sum at -1 dBFS. Separation: a bass peak only ducks
                    # bass - vocals/presence are untouched (phone-DSP style).
                    # LV2-in-graph verified safe at any sink volume 2026-07-16.
                    # ALL alr (auto-level) OFF: measured to over-regulate
                    # sustained content ~11 dB. All gain-boost (gb*) OFF: drive
                    # supplies the loudness, keeps thresholds predictable.
                    { type = lv2 plugin = "http://lsp-plug.in/plugins/lv2/mb_limiter_stereo" name = lim
                      control = {
                          # S4 (2026-08-02): ovs 0 -> 6 ("Half x4/24 bit"). With heavy
                          # drive into a 48 kHz brickwall, limiting products alias back
                          # down into the audible band as inharmonic distortion - part of
                          # the "harsh" character. Sub-ms latency cost; back this off
                          # FIRST if the latency budget ever moves.
                          "lk" = 5.0 "ovs" = 6.0 "dither" = 0.0 "envb" = 0.0
                          "on" = 1.0 "alr" = 0.0 "th" = 0.891 "gb" = 0.0 "at" = 5.0 "rt" = 5.0
                          # CONSECUTIVE splits (2026-07-22 fix): the old
                          # gap-indexed layout (se_2/se_4/se_6) silently shifted
                          # the band-to-param mapping - measured with tones:
                          # vocals obeyed th_3 (not th_2), and NOTHING above
                          # 2500 Hz was band-limited at all (5 kHz and 10.5 kHz
                          # tones passed at linear level with every th at -20 dB;
                          # only the -1 dBFS brickwall caught treble). That
                          # uncapped 2.5-11 kHz + the +11 dB drive = the "highs
                          # hurt" complaint. With consecutive se_1/2/3 the
                          # mapping is unambiguous: th_1 <650 | th_2 650-2500 |
                          # th_3 2500-8000 | th_4 >8000.
                          "se_1" = 1.0 "sf_1" = 650.0
                          "se_2" = 1.0 "sf_2" = 2500.0
                          "se_3" = 1.0 "sf_3" = 8000.0
                          "se_4" = 0.0 "se_5" = 0.0 "se_6" = 0.0 "se_7" = 0.0
                          # UNEQUAL band ceilings = dynamic tonal balance at
                          # loudness. Equal ceilings (all 0.708) measured wrong:
                          # bass/mids limit constantly while treble never does,
                          # so loud music tilted metallic. Vocals get the most
                          # headroom (clarity priority), the 10-11 kHz metallic
                          # band gets a hard dynamic cap.
                          # th_1/th_2 carry over the previously ACTIVE bass and
                          # vocal ceilings unchanged (bass sound untouched, user
                          # constraint). th_3/th_4 are the restored presence/air
                          # caps that the old layout never actually applied.
                          # S4 (2026-08-02) band releases: rt_1 10 -> 60 ms, rt_2 5 -> 20.
                          # 10 ms is ~3 periods of 300 Hz content, so the bass band's
                          # limiter was tracking the waveform envelope rather than the
                          # programme - that is envelope modulation, heard as IMD/growl
                          # on bass. 2.5k and 8k stay at 5 ms: treble needs fast recovery.
                          "on_1" = 1.0 "alr_1" = 0.0 "gb_1" = 0.0 "th_1" = 0.75  "at_1" = 5.0 "rt_1" = 60.0
                          "on_2" = 1.0 "alr_2" = 0.0 "gb_2" = 0.0 "th_2" = 0.71  "at_2" = 5.0 "rt_2" = 20.0
                          "on_3" = 1.0 "alr_3" = 0.0 "gb_3" = 0.0 "th_3" = 0.63  "at_3" = 5.0 "rt_3" = 5.0
                          "on_4" = 1.0 "alr_4" = 0.0 "gb_4" = 0.0 "th_4" = 0.355 "at_4" = 5.0 "rt_4" = 5.0
                          "on_5" = 0.0 "on_6" = 0.0 "on_7" = 0.0 "on_8" = 0.0
                      } }

                    # ---------- thermal guard (2026-07-23, S3) ----------
                    # Software stand-in for a smart amp's thermal model: a very
                    # slow single-band downward compressor AFTER the limiter.
                    # The MB limiter is peak-based - it happily passes sustained
                    # -1 dBFS content that a 2 W coil shouldn't eat for long
                    # with +11 dB drive upstream. RMS sidechain (scm 1), attack
                    # 1000 ms / release 3000 ms: beats and transients build no
                    # reduction; only content that SITS loud does. Threshold
                    # -8 dB RMS (al 0.4), ratio 4:1 - measured placement: loud
                    # pink program sits at -9.8 dB RMS (stays ~2 dB under, guard
                    # untouched); a sustained full-scale sine sits at -4 dB RMS
                    # -> ~1.5-2 dB slow trim (~30-35% less coil power). Only
                    # attenuates (mk 1, wet-only): the -1 dBFS peak ceiling from
                    # the limiter is never exceeded.
                    # NOTE (platform bugs #10/#11, both measured 2026-07-23):
                    #  #10 LSP compressor_stereo does NOT instantiate inside
                    #      filter-chain on this stack (sink fails to load, only
                    #      "invalid message id:2 op:2" in the journal;
                    #      limiter/mbc/gott/loud_comp all fine).
                    #  #11 a SECOND mb_compressor instance loads and passes
                    #      audio (g_wet works) but its band compression is dead
                    #      - crush-test al 0.01 / cr 100 / at 5 = zero effect on
                    #      any band, with or without conf-built splits, both
                    #      crossover modes.
                    # So the guard is LSP limiter_stereo (a 2nd limiter instance
                    # verifiably works) in ALR mode: ALR is a slow RMS-style
                    # level regulator - the same behavior that is deliberately
                    # BANNED in the loudness limiter (over-regulation) is
                    # exactly what a thermal guard wants, slowed to the max
                    # (alr_at 200 ms, alr_rt 1000 ms) and with the peak side
                    # neutralized (th 1.0 = 0 dBFS ceiling; upstream brickwall
                    # already caps at -1 dBFS, so only ALR ever acts).
                    # knee tuned by measured sweep (2026-07-23, DSP 100%):
                    #   knee 0.5: sine -7.2 -> -16.4, pink -9.8 -> -14.2 (way too hot)
                    #   knee 1.0: sine -10.4, pink -10.5 | 1.12: -9.5 / -10.3
                    #   knee 1.25 (SHIPPED): sine -8.8 (-1.65 dB = ~32% less
                    #     coil power on pinned content), pink -10.1 (-0.34 dB
                    #     only in the loudest sustained windows)
                    #   knee 1.6: sine -7.9 (too weak) | 2.5: no effect
                    # Knob: lower knee = stronger thermal protection, more
                    # loudness cost on dense music.
                    { type = lv2 plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo" name = thermal
                      control = {
                          "enabled" = 1.0 "alr" = 1.0
                          # S1 RE-TUNE (2026-08-02): 1.25 -> 0.85. MANDATORY after S0.
                          # The guard is digital, so it sees the same signal as before -
                          # but that signal now drives an amp at 0 dB instead of -7 dB.
                          # Re-measured sweep (settled RMS of the last 2 s of a 7 s
                          # source, DSP sink 100%; knee 2.5 = unguarded reference):
                          #   knee 2.5 : sine  -6.5  pink -13.0   (no effect - baseline)
                          #   knee 1.25: sine  -8.7  pink -13.0   (old shipped value)
                          #   knee 1.12: sine  -9.6  pink -13.1
                          #   knee 1.00: sine -10.5  pink -13.3
                          #   knee 0.85: sine -11.9  pink -13.7   <-- SHIPPED
                          #   knee 0.70: sine -13.6  pink -14.5
                          # Why 0.85 and not the ~1.0-1.12 first guessed: at knee 1.25
                          # sustained sine sits at -8.7 dBFS into a 0 dB amp, versus
                          # -8.8 dBFS into a -7 dB amp before = +7.1 dB more coil power,
                          # roughly double the agreed increase. 0.85 puts sustained
                          # content at +3.9 dB over the old config - the ~4 dB actually
                          # chosen - for only 0.7 dB off loud pink (real music).
                          # Lower = safer/duller. 0.70 fully restores the OLD coil power
                          # but costs 1.5 dB on music. Sustained tones are the risk case;
                          # music sits ~6 dB below them here.
                          "alr_at" = 200.0 "alr_rt" = 1000.0 "knee" = 0.85
                          "th" = 1.0 "lk" = 0.1 "at" = 0.25 "rt" = 20.0
                          "ovs" = 0.0 "dith" = 0.0
                      } }
                ]
                links = [
                    # loudness contour first: psycho-bass and EQ see the
                    # volume-compensated signal
                    { output = "in_l:Out" input = "loud:in_l" }
                    { output = "in_r:Out" input = "loud:in_r" }
                    { output = "loud:out_l" input = "norm:in_l" }
                    { output = "loud:out_r" input = "norm:in_r" }
                    { output = "norm:out_l" input = "cpl:In" }
                    { output = "norm:out_r" input = "cpr:In" }
                    # mono feed
                    { output = "cpl:Out" input = "mid:In 1" }
                    { output = "cpr:Out" input = "mid:In 2" }
                    # stereo widener: S = 0.5L - 0.5R, delta = w_g x HP350(S)
                    { output = "cpr:Out"  input = "w_nl:In" }
                    { output = "cpl:Out"  input = "w_s:In 1" }
                    { output = "w_nl:Out" input = "w_s:In 2" }
                    { output = "w_s:Out"  input = "w_hp:In" }
                    { output = "w_hp:Out" input = "w_pk:In" }
                    { output = "w_pk:Out" input = "w_lp:In" }
                    { output = "w_lp:Out" input = "w_g:In" }
                    { output = "w_g:Out"  input = "w_nd:In" }
                    # L' = L + delta, R' = R - delta
                    { output = "cpl:Out"  input = "w_l:In 1" }
                    { output = "w_g:Out"  input = "w_l:In 2" }
                    { output = "cpr:Out"  input = "w_r:In 1" }
                    { output = "w_nd:Out" input = "w_r:In 2" }
                    # psycho-bass branch
                    { output = "mid:Out"      input = "bass_hp:In" }
                    { output = "bass_hp:Out"  input = "bass_lp1:In" }
                    { output = "bass_lp1:Out" input = "bass_lp2:In" }
                    # S7: split, then generate harmonics PER LEG (no cross terms
                    # between a note in the low leg and one in the high leg)
                    { output = "bass_lp2:Out" input = "sp_lo:In" }
                    { output = "bass_lp2:Out" input = "sp_hi:In" }
                    { output = "sp_lo:Out"    input = "sq_lo:In 1" }
                    { output = "sp_lo:Out"    input = "sq_lo:In 2" }
                    { output = "sq_lo:Out"    input = "cu_lo:In 1" }
                    { output = "sp_lo:Out"    input = "cu_lo:In 2" }
                    { output = "sp_hi:Out"    input = "sq_hi:In 1" }
                    { output = "sp_hi:Out"    input = "sq_hi:In 2" }
                    { output = "sq_hi:Out"    input = "cu_hi:In 1" }
                    { output = "sp_hi:Out"    input = "cu_hi:In 2" }
                    { output = "sq_lo:Out"    input = "hsum:In 1" }
                    { output = "cu_lo:Out"    input = "hsum:In 2" }
                    { output = "sq_hi:Out"    input = "hsum:In 3" }
                    { output = "cu_hi:Out"    input = "hsum:In 4" }
                    { output = "hsum:Out"     input = "bass_dc:In 1" }
                    { output = "bass_dc:Out 1" input = "harm_bp:In" }
                    { output = "harm_bp:Out"  input = "harm_hp:In" }
                    { output = "harm_hp:Out"  input = "harm_hp2:In" }
                    { output = "harm_hp2:Out" input = "harm_g:In" }
                    # dynamic bass duck: gain from the harmonic branch's own envelope
                    { output = "harm_g:Out"   input = "bd_abs:In" }
                    { output = "bd_abs:Out"   input = "bd_lp:In" }
                    { output = "bd_lp:Out"    input = "bd_cl:In" }
                    { output = "bd_cl:Out"    input = "bd_log:In" }
                    { output = "bd_log:Out"   input = "bd_exp:In" }
                    { output = "harm_g:Out"   input = "bd_mult:In 1" }
                    { output = "bd_exp:Out"   input = "bd_mult:In 2" }
                    # corrective EQ - left
                    { output = "w_l:Out"     input = "hp_l:In" }
                    { output = "hp_l:Out"    input = "hp2_l:In" }
                    { output = "hp2_l:Out"   input = "body_l:In" }
                    { output = "body_l:Out"  input = "box_l:In" }
                    { output = "box_l:Out"   input = "pres_l:In" }
                    { output = "pres_l:Out"  input = "metal_l:In" }
                    # corrective EQ - right
                    { output = "w_r:Out"     input = "hp_r:In" }
                    { output = "hp_r:Out"    input = "hp2_r:In" }
                    { output = "hp2_r:Out"   input = "body_r:In" }
                    { output = "body_r:Out"  input = "box_r:In" }
                    { output = "box_r:Out"   input = "pres_r:In" }
                    { output = "pres_r:Out"  input = "metal_r:In" }
                    # fine-ripple FIR correction after the biquads
                    { output = "metal_l:Out" input = "fir_l:In" }
                    { output = "metal_r:Out" input = "fir_r:In" }
                    # sum EQ + (ducked) harmonics
                    { output = "fir_l:Out"   input = "sum_l:In 1" }
                    { output = "bd_mult:Out" input = "sum_l:In 2" }
                    { output = "fir_r:Out"   input = "sum_r:In 1" }
                    { output = "bd_mult:Out" input = "sum_r:In 2" }
                    # adaptive dynamics (mbc), experimental GOTT, then makeup drive
                    { output = "sum_l:Out" input = "mbc:in_l" }
                    { output = "sum_r:Out" input = "mbc:in_r" }
                    { output = "mbc:out_l" input = "gott:in_l" }
                    { output = "mbc:out_r" input = "gott:in_r" }
                    { output = "gott:out_l" input = "drive_l:In" }
                    { output = "gott:out_r" input = "drive_r:In" }
                    # limiter, then thermal guard
                    { output = "drive_l:Out" input = "clip:in_l" }
                    { output = "drive_r:Out" input = "clip:in_r" }
                    { output = "clip:out_l"  input = "lim:in_l" }
                    { output = "clip:out_r"  input = "lim:in_r" }
                    { output = "lim:out_l" input = "thermal:in_l" }
                    { output = "lim:out_r" input = "thermal:in_r" }
                ]
                inputs  = [ "in_l:In" "in_r:In" ]
                outputs = [ "thermal:out_l" "thermal:out_r" ]
            }
            capture.props = {
                node.name       = "effect_input.speaker-tuning"
                node.description = "Speaker"
                media.class     = Audio/Sink
                audio.position  = [ FL FR ]
                device.icon_name = "audio-speakers"
                priority.session = 900
                # Use this sink at (or near) 100% volume: PipeWire 1.6.2
                # applies virtual-sink volume with a steep nonlinear taper
                # (measured), so reduced volumes get quiet fast. For normal
                # quiet listening just switch to the raw "Speaker" sink
                # (speaker-dsp off).
                # NOTE: not a filter.smart filter - on PipeWire 1.6.2 /
                # WirePlumber 0.5.13 smart-filter linking silently BYPASSES the
                # DSP graph (verified by measurement 2026-07-15). This is a
                # normal virtual sink set as the default instead.
            }
            playback.props = {
                node.name       = "effect_output.speaker-tuning"
                target.object   = "alsa_output.pci-0000_04_00.6.HiFi__Speaker__sink"
                audio.position  = [ FL FR ]
                node.passive    = true
                stream.dont-remix = true
            }
        }
    }
]
