# Speaker DSP starter template for Lenovo IdeaPad Slim 5 14AKP10 (83HX).
#
# This is deliberately a stereo pass-through filter-chain: it creates a
# selectable PipeWire sink but applies no EQ, dynamics, loudness processing,
# or FIR correction. Add and verify one processing stage at a time.
#
# The FIR asset in this repository is intentionally not loaded. When a new
# calibration is ready, add a `convolver` node and link it into this graph.

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker (Tuning)"

            filter.graph = {
                # Each channel has an explicit copy node. Replace either node
                # or insert filters between its In and Out ports as you tune.
                nodes = [
                    { type = builtin label = copy name = left }
                    { type = builtin label = copy name = right }
                ]
                inputs = [ "left:In" "right:In" ]
                outputs = [ "left:Out" "right:Out" ]
            }

            # Apps play to this virtual sink.
            capture.props = {
                node.name = "effect_input.speaker-tuning"
                node.description = "Speaker (Tuning)"
                media.class = Audio/Sink
                audio.position = [ FL FR ]
                device.icon_name = "audio-speakers"
                # Keep this virtual sink preferred over the hidden raw sink.
                priority.session = 900
            }

            # The virtual sink forwards to this laptop's physical speaker.
            # Change target.object only if `pactl list sinks short` reports a
            # different node name on your machine.
            playback.props = {
                node.name = "effect_output.speaker-tuning"
                target.object = "alsa_output.pci-0000_04_00.6.HiFi__Speaker__sink"
                audio.position = [ FL FR ]
                node.passive = true
                stream.dont-remix = true
            }
        }
    }
]
