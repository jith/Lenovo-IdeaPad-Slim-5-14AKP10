                    { output = "s10mbc:out_l" input = "s10rbp_l:In" }
                    { output = "s10mbc:out_r" input = "s10rbp_r:In" }
                    { output = "s10rbp_l:Out"  input = "s10rdyn_l:in" }
                    { output = "s10rbp_r:Out"  input = "s10rdyn_r:in" }
                    { output = "s10rdyn_l:out" input = "s10rneg_l:In" }
                    { output = "s10rdyn_r:out" input = "s10rneg_r:In" }
                    { output = "s10mbc:out_l"  input = "s10rsum_l:In 1" }
                    { output = "s10rneg_l:Out" input = "s10rsum_l:In 2" }
                    { output = "s10mbc:out_r"  input = "s10rsum_r:In 1" }
                    { output = "s10rneg_r:Out" input = "s10rsum_r:In 2" }
                    { output = "s10rsum_l:Out" input = "s10pbp_l:In" }
                    { output = "s10rsum_r:Out" input = "s10pbp_r:In" }
                    { output = "s10pbp_l:Out" input = "s10pdyn_l:in" }
                    { output = "s10pbp_r:Out" input = "s10pdyn_r:in" }
                    { output = "s10rsum_l:Out"  input = "s10psum_l:In 1" }
                    { output = "s10pdyn_l:out"  input = "s10psum_l:In 2" }
                    { output = "s10rsum_r:Out"  input = "s10psum_r:In 1" }
                    { output = "s10pdyn_r:out"  input = "s10psum_r:In 2" }
                    # both the detector and the audio path take the corrected
                    # signal -- see stage 10b on why the sidechain gets it too
                    { output = "s10psum_l:Out" input = "s11hx_l:In" }
                    { output = "s10psum_r:Out" input = "s11hx_r:In" }
                    { output = "s10psum_l:Out" input = "s11xcur:in_l" }
                    { output = "s10psum_r:Out" input = "s11xcur:in_r" }
                    { output = "s11hx_l:Out"  input = "s11xcur:sc_l" }
                    { output = "s11hx_r:Out"  input = "s11xcur:sc_r" }
                    { output = "s11xcur:out_l" input = "s12lp_l:In" }
                    { output = "s11xcur:out_r" input = "s12lp_r:In" }
                    { output = "s12lp_l:Out" input = "s12brick:in_l" }
                    { output = "s12lp_r:Out" input = "s12brick:in_r" }
                    { output = "s12brick:out_l" input = "s13trim_l:In" }
                    { output = "s12brick:out_r" input = "s13trim_r:In" }
                ]

                inputs  = [ "s0trim_l:In" "s0trim_r:In" ]
                outputs = [ "s13trim_l:Out" "s13trim_r:Out" ]
            }

            # Apps play to this virtual sink.
            capture.props = {
                node.name = "effect_input.speaker-tuning"
                node.description = "Speaker (Tuning)"
                media.class = Audio/Sink
                audio.position = [ FL FR ]
                audio.rate = 48000
                device.icon_name = "audio-speakers"
                # Keep this virtual sink preferred over the hidden raw sink.
                priority.session = 900
            }

            # The virtual sink forwards to this laptop's physical speaker.
            # Change target.object only if `pactl list sinks short` reports a
            # different node name on your machine.
            playback.props = {
                node.name = "effect_output.speaker-tuning"
                target.object = "alsa_output.pci-0000_04_00.6.HiFi__Speaker__sink"
                audio.position = [ FL FR ]
                audio.rate = 48000
                node.passive = true
                stream.dont-remix = true
            }
        }
    }
]
