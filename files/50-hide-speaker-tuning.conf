# Load the script that hides the internal Speaker Tuning DSP nodes from
# PulseAudio clients (GNOME Settings). See scripts/hide-speaker-tuning.lua
# and ~/.config/pipewire/pipewire.conf.d/50-speaker-tuning.conf.

wireplumber.components = [
  {
    name = hide-speaker-tuning.lua, type = script/lua
    provides = custom.hide-speaker-tuning
  }
]

wireplumber.profiles = {
  main = {
    custom.hide-speaker-tuning = required
  }
}
