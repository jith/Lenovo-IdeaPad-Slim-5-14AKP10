# Built-in microphone, as a source every client will list. The WirePlumber half
# is /usr/local/share/wireplumber/scripts/56-internal-mic.lua, which makes it the
# default.
#
# Mic2 is the real microphone, but UCM ties it to "Mic Jack", so with nothing
# plugged in its only port reads "not available". Chromium leaves out any source
# whose ports are all unavailable, and so does GNOME Settings: Brave told
# WhatsApp Web there was no microphone at all, 24 Sep 2026. A selection hook
# cannot change what a client is told about a port. This source has no ports.
#
# Passive toward Mic2, so the hardware runs only while something records from
# here. No fallback: with Mic2 gone, the capture side waits instead of linking
# to the default source -- which is this node.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Built-in Microphone"
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "internal-mic.capture"
        target.object = "alsa_input.pci-0000_04_00.6.HiFi__Mic2__source"
        node.passive = true
        node.dont-fallback = true
        stream.dont-remix = true
      }
      playback.props = {
        node.name = "internal-mic"
        media.class = "Audio/Source"
        device.icon-name = "audio-input-microphone"
      }
    }
  }
]
