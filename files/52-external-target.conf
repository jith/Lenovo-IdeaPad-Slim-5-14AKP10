# Load the script that points each External (Tuning) chain at the device
# currently matching its class pattern. See
# /usr/local/share/wireplumber/scripts/52-external-target.lua

wireplumber.components = [
  {
    name = 52-external-target.lua, type = script/lua
    provides = custom.external-target
  }
]

wireplumber.profiles = {
  main = {
    custom.external-target = required
  }
}
